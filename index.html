<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Corea del Sur</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    .mapa {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      touch-action: none; /* usamos pan/zoom custom */
    }

    .mapa-inner {
      position: absolute;
      left: 0;
      top: 0;
      will-change: transform;
      transform-origin: 0 0;
    }

    .mapa img.mapa-base {
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* ===== PIN ===== */
    .pin {
      position: absolute;
      width: 70px;
      height: auto;
      z-index: 10;
      cursor: pointer;
      transform: translate(-50%, -100%);
      transition: transform 0.2s ease, filter 0.2s ease;
      user-select: none;
      -webkit-user-drag: none;
      touch-action: manipulation;
    }

    @media (hover: hover) {
      .pin:hover,
      .pin.activo {
        transform: translate(-50%, -100%) scale(1.12);
        filter: drop-shadow(0 0 10px rgba(255,255,255,0.9));
        z-index: 20;
      }
    }

    @media (hover: none) {
      .pin.activo {
        transform: translate(-50%, -100%) scale(1.08);
        filter: drop-shadow(0 0 10px rgba(255,255,255,0.85));
        z-index: 20;
      }
    }

    @media (max-width: 768px) {
      .pin { width: 42px; }
    }

    @media (hover: none) {
      .pin::before {
        content: "";
        position: absolute;
        left: -18px;
        top: -18px;
        width: calc(100% + 36px);
        height: calc(100% + 36px);
        background: transparent;
      }
    }

    /* ===== POLAROID ===== */
    .polaroid {
      position: absolute;
      width: 170px;
      background: #fff;
      padding: 10px 10px 14px;
      border-radius: 10px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.45);
      transform: translate3d(-50%, calc(-100% - 50px), 0) rotate(-2deg);
      transform-origin: bottom center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      z-index: 30;
      will-change: transform;
      backface-visibility: hidden;
    }

    .polaroid.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .polaroid img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
      backface-visibility: hidden;
      transform: translateZ(0);
      image-rendering: auto;
      pointer-events: none;
    }

    .polaroid .caption {
      margin-top: 8px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: #222;
    }

    .polaroid::after {
      content: "";
      position: absolute;
      bottom: -8px;
      left: 50%;
      width: 14px;
      height: 14px;
      background: white;
      transform: translateX(-50%) rotate(45deg);
    }
  </style>
</head>

<body>
  <div class="mapa" id="mapa">
    <div class="mapa-inner" id="mapaInner">
      <img id="mapImg" src="img/corea.png" alt="Mapa de Corea del Sur" class="mapa-base" />

      <!-- PIN SEÚL -->
      <img src="img/pin-pais.png"
           class="pin"
           style="top:43%; left:53%;"
           data-thumb="img/seul-skyline.jpg"
           data-title="Seúl"
           data-link="seul.html">

      <!-- PIN BUSAN -->
      <img src="img/pin-pais.png"
           class="pin"
           style="top:75%; left:72%;"
           data-thumb="img/busan-skyline.jpg"
           data-title="Busan"
           data-link="busan.html">

      <!-- PIN GYEONGJU -->
      <img src="img/pin-pais.png"
           class="pin"
           style="top:56%; left:75%;"
           data-thumb="img/gyeongju-skyline.jpg"
           data-title="Gyeongju"
           data-link="gyeongju.html">

      <!-- POLAROID -->
      <div id="polaroid" class="polaroid" aria-hidden="true">
        <img id="polaroidImg" alt="">
        <div id="polaroidCap" class="caption"></div>
      </div>
    </div>
  </div>

  <script>
    let scale = 1, tx = 0, ty = 0;
    let SCALE_MIN = 1;
    const SCALE_MAX = 4;

    const mapa = document.getElementById("mapa");
    const mapaInner = document.getElementById("mapaInner");
    const mapImg = document.getElementById("mapImg");
    const pins = document.querySelectorAll(".pin");

    const polaroid = document.getElementById("polaroid");
    const polaroidImg = document.getElementById("polaroidImg");
    const polaroidCap = document.getElementById("polaroidCap");

    let activePin = null;
    let lastTouchPin = null;
    let movedDuringTouch = false;

    let mapW = 0, mapH = 0;

    function clamp(v, min, max) {
      return Math.min(Math.max(v, min), max);
    }

    function clampPan() {
      const vw = mapa.clientWidth;
      const vh = mapa.clientHeight;

      const scaledW = mapW * scale;
      const scaledH = mapH * scale;

      const minX = Math.min(0, vw - scaledW);
      const minY = Math.min(0, vh - scaledH);

      tx = clamp(tx, minX, 0);
      ty = clamp(ty, minY, 0);
    }

    function aplicarTransform() {
      clampPan();
      mapaInner.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;

      if (polaroid.classList.contains("visible") && activePin) {
        positionPolaroid(activePin);
      }
    }

    function getPointInViewport(clientX, clientY) {
      const rect = mapa.getBoundingClientRect();
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function zoomAt(clientX, clientY, newScale) {
      newScale = clamp(newScale, SCALE_MIN, SCALE_MAX);

      const p = getPointInViewport(clientX, clientY);
      const worldX = (p.x - tx) / scale;
      const worldY = (p.y - ty) / scale;

      scale = newScale;
      tx = p.x - worldX * scale;
      ty = p.y - worldY * scale;

      aplicarTransform();
      rerasterizePolaroid();
    }

    function positionPolaroid(pin) {
      const pinRect = pin.getBoundingClientRect();
      const mapaRect = mapa.getBoundingClientRect();

      const tipX = (pinRect.left + pinRect.width / 2) - mapaRect.left;
      const tipY = (pinRect.top + pinRect.height) - mapaRect.top;

      const worldX = (tipX - tx) / scale;
      const worldY = (tipY - ty) / scale;

      polaroid.style.left = worldX + "px";
      polaroid.style.top = worldY + "px";
    }

    function showPolaroid(pin) {
      polaroidImg.src = pin.dataset.thumb;
      polaroidCap.textContent = pin.dataset.title || "";
      positionPolaroid(pin);

      polaroid.dataset.link = pin.dataset.link;

      polaroid.classList.add("visible");
      pin.classList.add("activo");

      if (activePin && activePin !== pin) activePin.classList.remove("activo");
      activePin = pin;
    }

    function hidePolaroid() {
      polaroid.classList.remove("visible");
      if (activePin) activePin.classList.remove("activo");
      activePin = null;
      lastTouchPin = null;
      delete polaroid.dataset.link;
    }

    function rerasterizePolaroid() {
      if (!polaroid.classList.contains("visible")) return;
      polaroid.style.display = "none";
      void polaroid.offsetHeight;
      polaroid.style.display = "";
    }

    // En móvil: tocar la polaroid abre la ciudad
    polaroid.addEventListener("click", (e) => {
      e.stopPropagation();
      const isTouch = matchMedia("(hover: none)").matches;
      if (!isTouch) return;
      if (polaroid.classList.contains("visible") && polaroid.dataset.link) {
        location.href = polaroid.dataset.link;
      }
    });

    pins.forEach(pin => {
      pin.addEventListener("mouseenter", () => showPolaroid(pin));
      pin.addEventListener("mouseleave", () => {
        if (matchMedia("(hover: hover)").matches) hidePolaroid();
      });

      pin.addEventListener("touchstart", () => movedDuringTouch = false, { passive: true });
      pin.addEventListener("touchmove", () => movedDuringTouch = true, { passive: true });

      pin.addEventListener("click", (e) => {
        const isTouch = matchMedia("(hover: none)").matches;

        // ✅ CAMBIO 1: en desktop, click = navegar SIEMPRE (sin “primer click polaroid”)
        if (!isTouch) {
          location.href = pin.dataset.link;
          return;
        }

        // móvil: evita activar si venías arrastrando
        if (movedDuringTouch) return;

        // móvil: primer tap -> mostrar polaroid; segundo tap -> navegar
        if (lastTouchPin !== pin) {
          e.preventDefault();
          showPolaroid(pin);
          lastTouchPin = pin;
        } else {
          location.href = pin.dataset.link;
        }
      });
    });

    mapa.addEventListener("click", (e) => {
      if (e.target.classList && e.target.classList.contains("pin")) return;
      if (e.target.closest && e.target.closest("#polaroid")) return;
      hidePolaroid();
    });

    /* ===== PAN + PINCH con Pointer Events ===== */
    const pointers = new Map();
    let lastPan = { x: 0, y: 0 };
    let startDist = 0;
    let startScale = 1;
    let pinchCenter = { x: 0, y: 0 };

    function dist(a, b) {
      const dx = a.x - b.x, dy = a.y - b.y;
      return Math.hypot(dx, dy);
    }

    mapa.addEventListener("pointerdown", (e) => {
      mapa.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 1) {
        lastPan = { x: e.clientX, y: e.clientY };
      } else if (pointers.size === 2) {
        const pts = [...pointers.values()];
        startDist = dist(pts[0], pts[1]);
        startScale = scale;
        pinchCenter = {
          x: (pts[0].x + pts[1].x) / 2,
          y: (pts[0].y + pts[1].y) / 2
        };
      }
    });

    mapa.addEventListener("pointermove", (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 1) {
        const dx = e.clientX - lastPan.x;
        const dy = e.clientY - lastPan.y;
        tx += dx;
        ty += dy;
        lastPan = { x: e.clientX, y: e.clientY };
        aplicarTransform();
      } else if (pointers.size === 2) {
        const pts = [...pointers.values()];
        const d = dist(pts[0], pts[1]);
        if (startDist <= 0) return;
        const factor = d / startDist;
        zoomAt(pinchCenter.x, pinchCenter.y, startScale * factor);
      }
    });

    function endPointer(e) {
      pointers.delete(e.pointerId);
      if (pointers.size === 1) {
        const remaining = [...pointers.values()][0];
        lastPan = { x: remaining.x, y: remaining.y };
      }
    }

    mapa.addEventListener("pointerup", endPointer);
    mapa.addEventListener("pointercancel", endPointer);

    /* Trackpad / rueda */
    mapa.addEventListener("wheel", (e) => {
      e.preventDefault();
      if (e.ctrlKey) {
        const factor = Math.exp(-e.deltaY * 0.002);
        zoomAt(e.clientX, e.clientY, scale * factor);
      } else {
        tx -= e.deltaX;
        ty -= e.deltaY;
        aplicarTransform();
      }
    }, { passive:false });

    function initView() {
      const vw = mapa.clientWidth;
      const vh = mapa.clientHeight;

      const cover = Math.max(vw / mapW, vh / mapH);

      const isMobile = matchMedia("(max-width: 768px)").matches;
      scale = isMobile ? cover * 1.08 : cover;
      SCALE_MIN = cover;

      tx = (vw - mapW * scale) / 2;
      ty = (vh - mapH * scale) / 2;

      aplicarTransform();
    }

    mapImg.addEventListener("load", () => {
      mapW = mapImg.naturalWidth;
      mapH = mapImg.naturalHeight;

      mapaInner.style.width = mapW + "px";
      mapaInner.style.height = mapH + "px";

      initView();
    });

    window.addEventListener("resize", () => {
      if (!mapW || !mapH) return;
      initView();
    });
  </script>
</body>
</html>
