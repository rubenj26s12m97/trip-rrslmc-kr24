<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gyeongju</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .back {
      position: fixed;
      top: 12px;
      left: 12px;
      background: rgba(255,255,255,0.95);
      padding: 12px 14px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      user-select: none;
      z-index: 9999;
      transform: translateZ(0);
      line-height: 1;
    }

    .tooltip {
      position: fixed;
      left: 12px;
      top: 54px;
      z-index: 9999;
      background: rgba(0,0,0,0.72);
      color: rgba(255,255,255,0.97);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 14px;
      max-width: calc(100vw - 24px);
      display: none;
      user-select: none;
      transform: translateZ(0);
    }

    .mapa {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      background: #000;
    }

    .mapa-inner {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
      will-change: transform;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    /* Imagen llena el mundo (mundo = tamaño natural) */
    .mapa img.mapa-base {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .pin {
      position: absolute;
      width: 30px; /* desktop */
      height: auto;
      z-index: 10;
      cursor: pointer;
      transform: translate(-50%, -50%) translateZ(0);
      user-select: none;
      -webkit-user-drag: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      backface-visibility: hidden;
      will-change: transform, filter;
      transition: transform 0.15s ease;
    }

    @media (hover: hover) {
      .pin:hover,
      .pin.activo {
        transform: translate(-50%, -50%) scale(1.08) translateZ(0);
        z-index: 20;
      }
    }

    @media (hover: none) {
      .pin.activo {
        transform: translate(-50%, -50%) scale(1.05) translateZ(0);
        z-index: 20;
      }
    }

    /* Móvil: un poco más pequeño */
    @media (max-width: 768px) {
      .pin { width: 26px; }
      .back { padding: 10px 12px; font-size: 14px; border-radius: 12px; }
      .tooltip { top: 50px; font-size: 13px; }
    }

    .day-granate { filter: hue-rotate(350deg) saturate(95%) brightness(95%); }
    .day-dorado  { filter: hue-rotate(50deg)  saturate(110%) brightness(108%); }

    .legend {
      position: fixed;
      bottom: 12px;
      left: 12px;
      background: rgba(0,0,0,0.60);
      color: rgba(255,255,255,0.95);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      display: flex;
      gap: 12px;
      align-items: center;
      user-select: none;
      z-index: 9999;
      flex-wrap: wrap;
      max-width: calc(100vw - 24px);
      transform: translateZ(0);
    }

    .key { display: inline-flex; gap: 8px; align-items: center; white-space: nowrap; }
    .dot { width: 10px; height: 10px; border-radius: 999px; display: inline-block; }
    .c-granate { background: #8b1d2c; }
    .c-dorado  { background: #e0b83f; }

    .pin-label {
      position: absolute;
      z-index: 99999;
      background: rgba(0,0,0,0.78);
      color: #fff;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -14px);
      transition: opacity 0.12s ease, transform 0.12s ease;
    }

    .pin-label.show {
      opacity: 1;
      transform: translate(-50%, -18px);
    }
  </style>
</head>

<body>
  <div class="back" onclick="location.href='index.html'">← Corea</div>
  <div id="tooltip" class="tooltip"></div>

  <div class="mapa" id="mapa">
    <div class="mapa-inner" id="mapaInner">
      <img id="mapImg" src="img/gyeongju.webp" alt="Mapa de Gyeongju" class="mapa-base">

      <!-- ===== DÍA 5 ===== -->
      <a href="lugares/gyeongju/daereungwon-tomb-complex.html">
        <img src="img/pin-lugar.png"
             class="pin day-granate"
             style="top:49.5%; left:42.5%;"
             data-day="5"
             data-name="Daereungwon Tomb Complex">
      </a>

      <a href="lugares/gyeongju/lotus-garden.html">
        <img src="img/pin-lugar.png"
             class="pin day-granate"
             style="top:52%; left:44%;"
             data-day="5"
             data-name="Lotus Garden">
      </a>

      <a href="lugares/gyeongju/anapji.html">
        <img src="img/pin-lugar.png"
             class="pin day-granate"
             style="top:51%; left:45.5%;"
             data-day="5"
             data-name="Anapji">
      </a>

      <a href="lugares/gyeongju/hwangnidan-gil-street.html">
        <img src="img/pin-lugar.png"
             class="pin day-granate"
             style="top:52%; left:41%;"
             data-day="5"
             data-name="Hwangnidan-gil Street">
      </a>

      <!-- ===== DÍA 6 ===== -->
      <a href="lugares/gyeongju/bulguksa.html">
        <img src="img/pin-lugar.png"
             class="pin day-dorado"
             style="top:59%; left:67%;"
             data-day="6"
             data-name="Bulguksa">
      </a>

      <a href="lugares/gyeongju/gyochon-traditional-village.html">
        <img src="img/pin-lugar.png"
             class="pin day-dorado"
             style="top:54%; left:41%;"
             data-day="6"
             data-name="Gyochon Traditional Village">
      </a>

      <a href="lugares/gyeongju/woljeonggyo-bridge.html">
        <img src="img/pin-lugar.png"
             class="pin day-dorado"
             style="top:55%; left:43%;"
             data-day="6"
             data-name="Woljeonggyo Bridge">
      </a>

      <div id="pinLabel" class="pin-label"></div>
    </div>
  </div>

  <div class="legend">
    <span class="key"><span class="dot c-granate"></span>Día 5</span>
    <span class="key"><span class="dot c-dorado"></span>Día 6</span>
  </div>

  <script>
    const tip = document.getElementById('tooltip');
    const label = document.getElementById('pinLabel');

    function showTip(text) {
      tip.textContent = text;
      tip.style.display = 'block';
      clearTimeout(showTip._t);
      showTip._t = setTimeout(() => tip.style.display = 'none', 2000);
    }

    // Etiqueta por % (evita offsets que cambian con padding/margin, etc.)
    function showPinLabelFor(pin) {
      const name = pin.dataset.name ?? '';
      if (!name) return;

      label.textContent = name;
      label.style.left = pin.style.left;
      label.style.top  = pin.style.top;
      label.classList.add('show');

      clearTimeout(showPinLabelFor._t);
      showPinLabelFor._t = setTimeout(() => label.classList.remove('show'), 1800);
    }

    document.querySelectorAll('.pin').forEach(pin => {
      pin.addEventListener('mouseenter', () => showPinLabelFor(pin));
      pin.addEventListener('click', () => {
        if (matchMedia("(hover: none)").matches) showPinLabelFor(pin);
      });
    });

    // ===== Motor pan + zoom (robusto) =====
    let scale = 1, tx = 0, ty = 0;
    let SCALE_MIN = 1;
    const SCALE_MAX = 4;

    const mapa = document.getElementById("mapa");
    const mapaInner = document.getElementById("mapaInner");
    const mapImg = document.getElementById("mapImg");

    let mapW = 0, mapH = 0;

    function clamp(v, min, max) { return Math.min(Math.max(v, min), max); }

    function clampPan() {
      const vw = mapa.clientWidth;
      const vh = mapa.clientHeight;

      const scaledW = mapW * scale;
      const scaledH = mapH * scale;

      const minX = Math.min(0, vw - scaledW);
      const minY = Math.min(0, vh - scaledH);

      tx = clamp(tx, minX, 0);
      ty = clamp(ty, minY, 0);
    }

    function aplicarTransform() {
      clampPan();
      mapaInner.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    }

    function getPointInViewport(clientX, clientY) {
      const rect = mapa.getBoundingClientRect();
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function zoomAt(clientX, clientY, newScale) {
      newScale = clamp(newScale, SCALE_MIN, SCALE_MAX);

      const p = getPointInViewport(clientX, clientY);
      const worldX = (p.x - tx) / scale;
      const worldY = (p.y - ty) / scale;

      scale = newScale;
      tx = p.x - worldX * scale;
      ty = p.y - worldY * scale;

      aplicarTransform();
    }

    function initView() {
      const vw = mapa.clientWidth;
      const vh = mapa.clientHeight;

      // cover: llena pantalla sin negro
      const cover = Math.max(vw / mapW, vh / mapH);

      const isMobile = matchMedia("(max-width: 768px)").matches;
      scale = isMobile ? cover * 1.08 : cover;
      SCALE_MIN = cover;

      tx = (vw - mapW * scale) / 2;
      ty = (vh - mapH * scale) / 2;

      aplicarTransform();
    }

    // ===== Pointer Events: pan 1 dedo + pinch 2 dedos =====
    const pointers = new Map();
    let lastPan = { x: 0, y: 0 };
    let startDist = 0;
    let startScale = 1;
    let pinchCenter = { x: 0, y: 0 };

    function dist(a, b) {
      const dx = a.x - b.x, dy = a.y - b.y;
      return Math.hypot(dx, dy);
    }

    mapa.addEventListener("pointerdown", (e) => {
      mapa.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 1) {
        lastPan = { x: e.clientX, y: e.clientY };
      } else if (pointers.size === 2) {
        const pts = [...pointers.values()];
        startDist = dist(pts[0], pts[1]);
        startScale = scale;
        pinchCenter = {
          x: (pts[0].x + pts[1].x) / 2,
          y: (pts[0].y + pts[1].y) / 2
        };
      }
    });

    mapa.addEventListener("pointermove", (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 1) {
        const dx = e.clientX - lastPan.x;
        const dy = e.clientY - lastPan.y;
        tx += dx;
        ty += dy;
        lastPan = { x: e.clientX, y: e.clientY };
        aplicarTransform();
      } else if (pointers.size === 2) {
        const pts = [...pointers.values()];
        const d = dist(pts[0], pts[1]);
        if (startDist <= 0) return;
        const factor = d / startDist;
        zoomAt(pinchCenter.x, pinchCenter.y, startScale * factor);
      }
    });

    function endPointer(e) {
      pointers.delete(e.pointerId);
      if (pointers.size === 1) {
        const remaining = [...pointers.values()][0];
        lastPan = { x: remaining.x, y: remaining.y };
      }
    }

    mapa.addEventListener("pointerup", endPointer);
    mapa.addEventListener("pointercancel", endPointer);

    // Trackpad/rueda
    mapa.addEventListener("wheel", (e) => {
      e.preventDefault();
      if (e.ctrlKey) {
        const factor = Math.exp(-e.deltaY * 0.002);
        zoomAt(e.clientX, e.clientY, scale * factor);
      } else {
        tx -= e.deltaX;
        ty -= e.deltaY;
        aplicarTransform();
      }
    }, { passive: false });

    mapImg.addEventListener("load", () => {
      mapW = mapImg.naturalWidth;
      mapH = mapImg.naturalHeight;

      // mundo fijo al tamaño real del mapa
      mapaInner.style.width = mapW + "px";
      mapaInner.style.height = mapH + "px";

      initView();
    });

    window.addEventListener("resize", () => {
      if (!mapW || !mapH) return;
      initView();
    });
  </script>
</body>
</html>
