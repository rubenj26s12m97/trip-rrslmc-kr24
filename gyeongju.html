<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gyeongju</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    /* ================= BOTÓN VOLVER ================= */
    .back {
      position: fixed;
      top: 12px;
      left: 12px;
      background: rgba(255,255,255,0.95);
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      user-select: none;
      z-index: 9999;
    }

    /* ================= TOOLTIP SUPERIOR ================= */
    .tooltip {
      position: fixed;
      left: 12px;
      top: 56px;
      z-index: 9999;
      background: rgba(0,0,0,0.72);
      color: rgba(255,255,255,0.97);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      max-width: calc(100vw - 24px);
      display: none;
      user-select: none;
    }

    /* ================= MAPA ================= */
    .mapa {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }

    .mapa-inner {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
      will-change: transform;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .mapa img.mapa-base {
      width: 100vw;
      height: auto;
      display: block;
      pointer-events: none;
      user-select: none;
      transform: translateZ(0);
    }

    /* ================= PINS ================= */
    .pin {
      position: absolute;
      width: 30px;
      height: auto;
      z-index: 10;
      cursor: pointer;
      transform: translate(-50%, -50%) translateZ(0);
      user-select: none;
      -webkit-user-drag: none;
      touch-action: none;
      backface-visibility: hidden;
      will-change: transform, filter;
      transition: transform 0.15s ease;
    }

    .pin:hover,
    .pin.activo {
      transform: translate(-50%, -50%) scale(1.08) translateZ(0);
      z-index: 20;
    }

    /* ================= COLORES ================= */
    .day-granate { filter: hue-rotate(350deg) saturate(95%) brightness(95%); }
    .day-dorado  { filter: hue-rotate(50deg)  saturate(110%) brightness(108%); }

    /* ================= LEYENDA ================= */
    .legend {
      position: fixed;
      bottom: 12px;
      left: 12px;
      background: rgba(0,0,0,0.60);
      color: rgba(255,255,255,0.95);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      user-select: none;
      z-index: 9999;
      flex-wrap: wrap;
      max-width: calc(100vw - 24px);
    }

    .key { display: inline-flex; gap: 8px; align-items: center; }
    .dot { width: 12px; height: 12px; border-radius: 999px; display: inline-block; }

    .c-granate { background: #8b1d2c; }
    .c-dorado  { background: #e0b83f; }

    /* ================= ETIQUETA JUNTO AL PIN ================= */
    .pin-label {
      position: absolute;
      z-index: 99999;
      background: rgba(0,0,0,0.78);
      color: #fff;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -10px);
      transition: opacity 0.12s ease, transform 0.12s ease;
    }

    .pin-label.show {
      opacity: 1;
      transform: translate(-50%, -14px);
    }
  </style>
</head>

<body>
  <div class="back" onclick="location.href='index.html'">← Corea</div>
  <div id="tooltip" class="tooltip"></div>

  <div class="mapa" id="mapa">
    <div class="mapa-inner" id="mapaInner">
      <img src="img/gyeongju.webp" alt="Mapa de Gyeongju" class="mapa-base">

      <!-- ===== DÍA 5 ===== -->
<a href="lugares/gyeongju/daereungwon-tomb-complex.html">
  <img src="img/pin-lugar.png"
       class="pin day-granate"
       style="top:49.5%; left:42.5%;"
       data-day="3"
       data-name="Daereungwon Tomb Complex">
</a>

<a href="lugares/gyeongju/lotus-garden.html">
  <img src="img/pin-lugar.png" class="pin day-granate"
       style="top:52%; left:44%;"
       data-day="5" data-name="Lotus Garden">
</a>

<a href="lugares/gyeongju/anapji.html">
  <img src="img/pin-lugar.png"
       class="pin day-granate"
       style="top:51%; left:45.5%;"
       data-day="5"
       data-name="Anapji">
</a>

<a href="lugares/gyeongju/hwangnidan-gil-street.html">
  <img src="img/pin-lugar.png" class="pin day-granate"
       style="top:52%; left:41%;"
       data-day="5" data-name="Hwangnidan-gil Street">
</a>

      <!-- ===== DÍA 6 ===== -->
      <a href="lugares/gyeongju/bulguksa.html">
  <img src="img/pin-lugar.png"
       class="pin day-dorado"
       style="top:59%; left:67%;"
       data-day="6"
       data-name="Bulguksa">
</a>

      <a href="lugares/gyeongju/gyochon-traditional-village.html">
  <img src="img/pin-lugar.png"
       class="pin day-dorado"
       style="top:54%; left:41%;"
       data-day="6"
       data-name="Gyochon Traditional Village">
</a>

<a href="./lugares/gyeongju/woljeonggyo-bridge.html">
  <img src="img/pin-lugar.png"
       class="pin day-dorado"
       style="top:55%; left:43%;"
       data-day="6"
       data-name="Woljeonggyo Bridge">
</a>

      <!-- etiqueta flotante reutilizable -->
      <div id="pinLabel" class="pin-label"></div>
    </div>
  </div>

  <div class="legend">
    <span class="key"><span class="dot c-granate"></span>Día 5</span>
    <span class="key"><span class="dot c-dorado"></span>Día 6</span>
  </div>

<script>
  const tip = document.getElementById('tooltip');
  const label = document.getElementById('pinLabel');

  function showTip(text) {
    tip.textContent = text;
    tip.style.display = 'block';
    clearTimeout(showTip._t);
    showTip._t = setTimeout(() => tip.style.display = 'none', 2000);
  }

  function showPinLabelFor(el) {
    const name = el.dataset.name;
    if (!name) return;

    label.textContent = name;
    label.style.left = el.offsetLeft + 'px';
    label.style.top  = el.offsetTop  + 'px';
    label.classList.add('show');

    clearTimeout(showPinLabelFor._t);
    showPinLabelFor._t = setTimeout(() => label.classList.remove('show'), 1800);
  }

  function openPin(el, url) {
    const day = el.dataset.day ?? '';
    const name = el.dataset.name ?? '';
    showTip(`Día ${day} – ${name}`);

    document.querySelectorAll('.pin').forEach(p => p.classList.remove('activo'));
    el.classList.add('activo');

    showPinLabelFor(el);
    window.open(url, '_blank');
  }

  document.querySelectorAll('.pin').forEach(pin => {
    pin.addEventListener('mouseenter', () => showPinLabelFor(pin));
  });

  // ===== Motor pan + zoom con límites (anti-zona negra) =====
  let scale = 1;
  let tx = 0;
  let ty = 0;

  const SCALE_MIN = 1;
  const SCALE_MAX = 3;

  const mapa = document.getElementById("mapa");
  const mapaInner = document.getElementById("mapaInner");

  function clamp(v, min, max) {
    return Math.min(Math.max(v, min), max);
  }

  function aplicarTransform() {
    mapaInner.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  }

  function clampPan() {
    const viewportW = mapa.clientWidth;
    const viewportH = mapa.clientHeight;

    // tamaño del contenido sin escala
    const baseW = mapaInner.scrollWidth;
    const baseH = mapaInner.scrollHeight;

    const contentW = baseW * scale;
    const contentH = baseH * scale;

    const minTx = Math.min(0, viewportW - contentW);
    const maxTx = 0;
    tx = clamp(tx, minTx, maxTx);

    const minTy = Math.min(0, viewportH - contentH);
    const maxTy = 0;
    ty = clamp(ty, minTy, maxTy);
  }

  function getPointInViewport(clientX, clientY) {
    const rect = mapa.getBoundingClientRect();
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function zoomAt(clientX, clientY, newScale) {
    newScale = clamp(newScale, SCALE_MIN, SCALE_MAX);
    const p = getPointInViewport(clientX, clientY);

    const worldX = (p.x - tx) / scale;
    const worldY = (p.y - ty) / scale;

    scale = newScale;

    tx = p.x - worldX * scale;
    ty = p.y - worldY * scale;

    clampPan();
    aplicarTransform();
  }

  // Drag ratón
  let isDraggingMouse = false;
  let lastMouse = { x: 0, y: 0 };

  mapa.addEventListener("mousedown", (e) => {
    isDraggingMouse = true;
    lastMouse = { x: e.clientX, y: e.clientY };
  });

  window.addEventListener("mousemove", (e) => {
    if (!isDraggingMouse) return;
    const dx = e.clientX - lastMouse.x;
    const dy = e.clientY - lastMouse.y;
    lastMouse = { x: e.clientX, y: e.clientY };

    tx += dx;
    ty += dy;
    clampPan();
    aplicarTransform();
  });

  window.addEventListener("mouseup", () => {
    isDraggingMouse = false;
  });

  // Trackpad/rue­da: PAN por defecto, ZOOM si ctrlKey
  mapa.addEventListener("wheel", (e) => {
    e.preventDefault();
    if (e.ctrlKey) {
      const factor = Math.exp(-e.deltaY * 0.002);
      zoomAt(e.clientX, e.clientY, scale * factor);
    } else {
      tx -= e.deltaX;
      ty -= e.deltaY;
      clampPan();
      aplicarTransform();
    }
  }, { passive: false });

  // Táctil: pan 1 dedo + pinch 2 dedos
  let touchMode = null;
  let lastTouch = null;
  let pinchStartDist = null;
  let pinchStartScale = null;

  function distTouches(t1, t2) {
    const dx = t1.clientX - t2.clientX;
    const dy = t1.clientY - t2.clientY;
    return Math.hypot(dx, dy);
  }
  function centerTouches(t1, t2) {
    return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
  }

  mapa.addEventListener("touchstart", (e) => {
    if (e.touches.length === 1) {
      touchMode = "pan";
      lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    } else if (e.touches.length === 2) {
      touchMode = "pinch";
      pinchStartDist = distTouches(e.touches[0], e.touches[1]);
      pinchStartScale = scale;
    }
  }, { passive: false });

  mapa.addEventListener("touchmove", (e) => {
    if (touchMode === "pan" && e.touches.length === 1 && lastTouch) {
      e.preventDefault();
      const t = e.touches[0];
      const dx = t.clientX - lastTouch.x;
      const dy = t.clientY - lastTouch.y;
      lastTouch = { x: t.clientX, y: t.clientY };

      tx += dx;
      ty += dy;
      clampPan();
      aplicarTransform();
    } else if (touchMode === "pinch" && e.touches.length === 2 && pinchStartDist) {
      e.preventDefault();
      const d = distTouches(e.touches[0], e.touches[1]);
      const c = centerTouches(e.touches[0], e.touches[1]);
      const newScale = pinchStartScale * (d / pinchStartDist);
      zoomAt(c.x, c.y, newScale);
    }
  }, { passive: false });

  mapa.addEventListener("touchend", () => {
    touchMode = null;
    lastTouch = null;
    pinchStartDist = null;
    pinchStartScale = null;
  });

  // Importante: al cargar/resize, clampa para evitar negros iniciales
  window.addEventListener("load", () => {
    clampPan();
    aplicarTransform();
  });
  window.addEventListener("resize", () => {
    clampPan();
    aplicarTransform();
  });
</script>

</body>
</html>
