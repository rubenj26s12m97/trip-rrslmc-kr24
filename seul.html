<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Seúl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    /* Botón volver (ANTES: gigante) */
    .back {
      position: fixed;
      top: 12px;
      left: 12px;
      background: rgba(255,255,255,0.95);
      padding: 12px 14px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      user-select: none;
      z-index: 9999;
      transform: translateZ(0);
      line-height: 1;
    }

    /* Tooltip superior (ANTES: grande) */
    .tooltip {
      position: fixed;
      left: 12px;
      top: 54px;
      z-index: 9999;
      background: rgba(0,0,0,0.72);
      color: rgba(255,255,255,0.97);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 14px;
      max-width: calc(100vw - 24px);
      display: none;
      user-select: none;
      transform: translateZ(0);
    }

    /* Viewport */
    .mapa {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      background: #000;
    }

    /* Capa transformable (mapa + pins) */
    .mapa-inner {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
      will-change: transform;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .mapa img.mapa-base {
      width: 100vw;
      height: auto;
      display: block;
      pointer-events: none;
      user-select: none;
      transform: translateZ(0);
    }

    /* Pins (ANTES: grandes) */
    .pin {
      position: absolute;
      width: 54px;              /* desktop más pequeño */
      height: auto;
      z-index: 10;
      cursor: pointer;
      transform: translate(-50%, -50%) translateZ(0);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-drag: none;
      touch-action: manipulation;
      backface-visibility: hidden;
      will-change: transform, filter;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    /* Hover solo en dispositivos con hover real */
    @media (hover: hover) {
      .pin:hover,
      .pin.activo {
        transform: translate(-50%, -50%) scale(1.08) translateZ(0);
        z-index: 20;
      }
    }

    /* En táctil, nada de hover fantasma; activo más suave */
    @media (hover: none) {
      .pin.activo {
        transform: translate(-50%, -50%) scale(1.05) translateZ(0);
        z-index: 20;
      }
    }

    /* Móvil: pin más pequeño + área de toque más grande (sin agrandar icono) */
    @media (max-width: 768px) {
      .pin { width: 34px; }
    }
    @media (hover: none) {
      .pin {
        padding: 14px;         /* aumenta “tap target” */
        margin: -14px;         /* compensa para no mover el centro visual */
      }
    }

    /* Colores (ajustados) */
    .day-granate { filter: hue-rotate(350deg) saturate(95%) brightness(95%); }
    .day-dorado  { filter: hue-rotate(50deg)  saturate(110%) brightness(108%); }
    .day-azul    { filter: hue-rotate(200deg) saturate(95%) brightness(95%); }
    .day-verde   { filter: hue-rotate(110deg) saturate(95%) brightness(95%); }

    /* Leyenda (ANTES: gigante) */
    .legend {
      position: fixed;
      bottom: 12px;
      left: 12px;
      background: rgba(0,0,0,0.60);
      color: rgba(255,255,255,0.95);
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 14px;
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 9999;
      flex-wrap: wrap;
      max-width: calc(100vw - 24px);
      transform: translateZ(0);
    }

    .key { display: inline-flex; gap: 8px; align-items: center; white-space: nowrap; }
    .dot { width: 10px; height: 10px; border-radius: 999px; display: inline-block; }

    .c-granate { background: #8b1d2c; }
    .c-dorado  { background: #e0b83f; }
    .c-azul    { background: #1f6fa6; }
    .c-verde   { background: #2f8f4e; }

    /* Etiqueta flotante junto al pin (ANTES: gigante) */
    .pin-label {
      position: absolute;
      z-index: 99999;
      background: rgba(0,0,0,0.78);
      color: #fff;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -12px);
      transition: opacity 0.12s ease, transform 0.12s ease;
    }

    .pin-label.show {
      opacity: 1;
      transform: translate(-50%, -16px);
    }

    /* Ajustes extra en móvil para UI */
    @media (max-width: 768px) {
      .back {
        padding: 10px 12px;
        border-radius: 12px;
        font-size: 14px;
      }
      .tooltip {
        top: 50px;
        font-size: 13px;
      }
      .legend {
        font-size: 13px;
        padding: 10px 12px;
        border-radius: 12px;
        gap: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="legend">
    <span class="key"><span class="dot c-granate"></span>Día 0–1</span>
    <span class="key"><span class="dot c-dorado"></span>Día 2</span>
    <span class="key"><span class="dot c-azul"></span>Día 3</span>
    <span class="key"><span class="dot c-verde"></span>Día 4</span>
  </div>

  <script>
    const tip = document.getElementById('tooltip');
    const label = document.getElementById('pinLabel');

    function showTip(text) {
      tip.textContent = text;
      tip.style.display = 'block';
      clearTimeout(showTip._t);
      showTip._t = setTimeout(() => { tip.style.display = 'none'; }, 2200);
    }

    function showPinLabelFor(el) {
      const name = el.dataset.name ?? '';
      if (!name) return;

      label.textContent = name;

      // label y pin comparten el mismo padre (.mapa-inner)
      const x = el.offsetLeft;
      const y = el.offsetTop;

      label.style.left = `${x}px`;
      label.style.top  = `${y}px`;
      label.classList.add('show');

      clearTimeout(showPinLabelFor._t);
      showPinLabelFor._t = setTimeout(() => label.classList.remove('show'), 2000);
    }

    // Mostrar etiqueta también al hover en escritorio
    document.querySelectorAll('.pin').forEach(pin => {
      pin.addEventListener('mouseenter', () => showPinLabelFor(pin));
    });

    // ===== Motor pan + zoom =====
    let scale = 1;
    let tx = 0;
    let ty = 0;

    const SCALE_MIN = 1;
    const SCALE_MAX = 3;

    const mapa = document.getElementById("mapa");
    const mapaInner = document.getElementById("mapaInner");

    function clamp(v, min, max) { return Math.min(Math.max(v, min), max); }
    function aplicarTransform() { mapaInner.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; }

    function getPointInViewport(clientX, clientY) {
      const rect = mapa.getBoundingClientRect();
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    // ✅ CLAVE: si el contenido es menor que el viewport, lo centramos (evita mapa arriba + negro abajo)
    function clampPan() {
      const viewportW = mapa.clientWidth;
      const viewportH = mapa.clientHeight;

      const baseW = mapaInner.scrollWidth;
      const baseH = mapaInner.scrollHeight;

      const contentW = baseW * scale;
      const contentH = baseH * scale;

      if (contentW <= viewportW) {
        tx = (viewportW - contentW) / 2;
      } else {
        tx = clamp(tx, viewportW - contentW, 0);
      }

      if (contentH <= viewportH) {
        ty = (viewportH - contentH) / 2;
      } else {
        ty = clamp(ty, viewportH - contentH, 0);
      }
    }

    function zoomAt(clientX, clientY, newScale) {
      newScale = clamp(newScale, SCALE_MIN, SCALE_MAX);
      const p = getPointInViewport(clientX, clientY);

      const worldX = (p.x - tx) / scale;
      const worldY = (p.y - ty) / scale;

      scale = newScale;

      tx = p.x - worldX * scale;
      ty = p.y - worldY * scale;

      clampPan();
      aplicarTransform();
    }

    // Drag ratón
    let isDraggingMouse = false;
    let lastMouse = { x: 0, y: 0 };

    mapa.addEventListener("mousedown", (e) => {
      isDraggingMouse = true;
      lastMouse = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDraggingMouse) return;
      const dx = e.clientX - lastMouse.x;
      const dy = e.clientY - lastMouse.y;
      lastMouse = { x: e.clientX, y: e.clientY };
      tx += dx; ty += dy;
      clampPan(); aplicarTransform();
    });

    window.addEventListener("mouseup", () => { isDraggingMouse = false; });

    // Trackpad/rueda: PAN por defecto, ZOOM si ctrlKey
    mapa.addEventListener("wheel", (e) => {
      e.preventDefault();
      if (e.ctrlKey) {
        const factor = Math.exp(-e.deltaY * 0.002);
        zoomAt(e.clientX, e.clientY, scale * factor);
      } else {
        tx -= e.deltaX;
        ty -= e.deltaY;
        clampPan(); aplicarTransform();
      }
    }, { passive: false });

    // Táctil: pan 1 dedo + pinch 2 dedos
    let touchMode = null;
    let lastTouch = null;
    let pinchStartDist = null;
    let pinchStartScale = null;

    function distTouches(t1, t2) {
      const dx = t1.clientX - t2.clientX;
      const dy = t1.clientY - t2.clientY;
      return Math.hypot(dx, dy);
    }
    function centerTouches(t1, t2) {
      return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
    }

    mapa.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        touchMode = "pan";
        lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2) {
        touchMode = "pinch";
        pinchStartDist = distTouches(e.touches[0], e.touches[1]);
        pinchStartScale = scale;
      }
    }, { passive: false });

    mapa.addEventListener("touchmove", (e) => {
      if (touchMode === "pan" && e.touches.length === 1 && lastTouch) {
        e.preventDefault();
        const t = e.touches[0];
        const dx = t.clientX - lastTouch.x;
        const dy = t.clientY - lastTouch.y;
        lastTouch = { x: t.clientX, y: t.clientY };
        tx += dx; ty += dy;
        clampPan(); aplicarTransform();
      } else if (touchMode === "pinch" && e.touches.length === 2 && pinchStartDist) {
        e.preventDefault();
        const d = distTouches(e.touches[0], e.touches[1]);
        const c = centerTouches(e.touches[0], e.touches[1]);
        const newScale = pinchStartScale * (d / pinchStartDist);
        zoomAt(c.x, c.y, newScale);
      }
    }, { passive: false });

    mapa.addEventListener("touchend", () => {
      touchMode = null;
      lastTouch = null;
      pinchStartDist = null;
      pinchStartScale = null;
    });

    window.addEventListener("load", () => { clampPan(); aplicarTransform(); });
    window.addEventListener("resize", () => { clampPan(); aplicarTransform(); });
  </script>
</body>
