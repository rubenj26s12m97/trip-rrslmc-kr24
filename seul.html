<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Seúl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --pin-w-desktop: 54px;
      --pin-w-mobile: 32px;
    }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .back {
      position: fixed;
      top: 12px;
      left: 12px;
      background: rgba(255,255,255,0.95);
      padding: 12px 14px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      user-select: none;
      z-index: 9999;
      transform: translateZ(0);
      line-height: 1;
      -webkit-tap-highlight-color: transparent;
    }

    .tooltip {
      position: fixed;
      left: 12px;
      top: 54px;
      z-index: 9999;
      background: rgba(0,0,0,0.72);
      color: rgba(255,255,255,0.97);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 14px;
      max-width: calc(100vw - 24px);
      display: none;
      user-select: none;
      transform: translateZ(0);
    }

    /* Viewport */
    .mapa {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      touch-action: none; /* pan/zoom custom */
      background: #000;
    }

    /* Mundo (mapa + pins) */
    .mapa-inner {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
      will-change: transform;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .mapa img.mapa-base {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      transform: translateZ(0);
    }

    /* Pins */
    .pin {
      position: absolute;
      width: var(--pin-w-desktop);
      height: auto;
      z-index: 10;
      cursor: pointer;
      transform: translate(-50%, -50%) translateZ(0);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-drag: none;
      touch-action: manipulation;
      backface-visibility: hidden;
      will-change: transform, filter;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    @media (hover: hover) {
      .pin:hover,
      .pin.activo {
        transform: translate(-50%, -50%) scale(1.08) translateZ(0);
        z-index: 20;
      }
    }

    @media (hover: none) {
      .pin.activo {
        transform: translate(-50%, -50%) scale(1.05) translateZ(0);
        z-index: 20;
      }
    }

    @media (max-width: 768px) {
      .pin { width: var(--pin-w-mobile); }
    }

    /* Colores */
    .day-granate { filter: hue-rotate(350deg) saturate(95%) brightness(95%); }
    .day-dorado  { filter: hue-rotate(50deg)  saturate(110%) brightness(108%); }
    .day-azul    { filter: hue-rotate(200deg) saturate(95%) brightness(95%); }
    .day-verde   { filter: hue-rotate(110deg) saturate(95%) brightness(95%); }

    .legend {
      position: fixed;
      left: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      background: rgba(0,0,0,0.60);
      color: rgba(255,255,255,0.95);
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 14px;
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 9999;
      flex-wrap: wrap;
      max-width: calc(100vw - 24px);
      transform: translateZ(0);
      user-select: none;
    }

    .key { display: inline-flex; gap: 8px; align-items: center; white-space: nowrap; }
    .dot { width: 10px; height: 10px; border-radius: 999px; display: inline-block; }

    .c-granate { background: #8b1d2c; }
    .c-dorado  { background: #e0b83f; }
    .c-azul    { background: #1f6fa6; }
    .c-verde   { background: #2f8f4e; }

    /* Label */
    .pin-label {
      position: absolute;
      z-index: 99999;
      background: rgba(0,0,0,0.82);
      color: #fff;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 650;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -18px);
      transition: opacity 0.12s ease, transform 0.12s ease;
    }

    .pin-label.show {
      opacity: 1;
      transform: translate(-50%, -22px);
    }

    @media (max-width: 768px) {
      .back {
        padding: 10px 12px;
        border-radius: 12px;
        font-size: 14px;
      }
      .tooltip { top: 50px; font-size: 13px; }
      .legend {
        font-size: 13px;
        padding: 10px 12px;
        border-radius: 12px;
        gap: 10px;
      }
      .pin-label{
        font-size: 16px;          /* ✅ más grande en móvil (cambio 4) */
        padding: 10px 14px;
        border-radius: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="back" onclick="location.href='index.html'">← Corea</div>
  <div id="tooltip" class="tooltip"></div>

  <div class="mapa" id="mapa">
    <div class="mapa-inner" id="mapaInner">
      <img id="mapImg" src="img/seul.png" alt="Mapa de Seúl" class="mapa-base">

      <a href="lugares/seul/artist-bakery.html">

      <div id="pinLabel" class="pin-label"></div>
    </div>
  </div>

  <div class="legend" id="legend">
    <span class="key"><span class="dot c-granate"></span>Día 0–1</span>
    <span class="key"><span class="dot c-dorado"></span>Día 2</span>
    <span class="key"><span class="dot c-azul"></span>Día 3</span>
    <span class="key"><span class="dot c-verde"></span>Día 4</span>
  </div>

  <script>
    const label = document.getElementById('pinLabel');
    const legend = document.getElementById('legend');

    function getLegendH() {
      if (!legend) return 0;
      const r = legend.getBoundingClientRect();
      const safe = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-bot')) || 0;
      return Math.ceil(r.height + 16 + safe);
    }

    function showPinLabelFor(pin) {
      const name = pin.dataset.name ?? '';
      if (!name) return;
      label.textContent = name;
      label.style.left = pin.style.left;
      label.style.top  = pin.style.top;
      label.classList.add('show');
      clearTimeout(showPinLabelFor._t);
      showPinLabelFor._t = setTimeout(() => label.classList.remove('show'), 1800);
    }

    // Hover: etiqueta
    document.querySelectorAll('.pin').forEach(pin => {
      pin.addEventListener('mouseenter', () => showPinLabelFor(pin));
    });

    // (4) Móvil: doble tap => 1º etiqueta, 2º navegar
    let lastTouchPin = null;
    document.querySelectorAll('.mapa-inner a').forEach(a => {
      const pin = a.querySelector('.pin');
      if (!pin) return;

      a.addEventListener('click', (e) => {
        const isTouch = matchMedia("(hover: none)").matches;

        // Desktop: navega directo
        if (!isTouch) return;

        // Touch:
        if (lastTouchPin !== pin) {
          e.preventDefault();
          showPinLabelFor(pin);
          lastTouchPin = pin;
        } else {
          // segundo tap: dejar navegar
          lastTouchPin = null;
        }
      });
    });

    // ===== Pan + Zoom (con “alto visible” restando la leyenda) =====
    let scale = 1, tx = 0, ty = 0;
    let SCALE_MIN = 1;
    const SCALE_MAX = 4;

    const mapa = document.getElementById("mapa");
    const mapaInner = document.getElementById("mapaInner");
    const mapImg = document.getElementById("mapImg");

    let mapW = 0, mapH = 0;

    function clamp(v, min, max) { return Math.min(Math.max(v, min), max); }

    function visibleH() {
      return Math.max(0, mapa.clientHeight - getLegendH());
    }

    function clampPan() {
      const vw = mapa.clientWidth;
      const vh = visibleH();

      const scaledW = mapW * scale;
      const scaledH = mapH * scale;

      const minX = Math.min(0, vw - scaledW);
      const minY = Math.min(0, vh - scaledH);

      tx = clamp(tx, minX, 0);
      ty = clamp(ty, minY, 0);
    }

    function aplicarTransform() {
      clampPan();
      mapaInner.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    }

    function getPointInViewport(clientX, clientY) {
      const rect = mapa.getBoundingClientRect();
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function zoomAt(clientX, clientY, newScale) {
      newScale = clamp(newScale, SCALE_MIN, SCALE_MAX);

      const p = getPointInViewport(clientX, clientY);
      const worldX = (p.x - tx) / scale;
      const worldY = (p.y - ty) / scale;

      scale = newScale;
      tx = p.x - worldX * scale;
      ty = p.y - worldY * scale;

      aplicarTransform();
    }

    function initView() {
      const vw = mapa.clientWidth;
      const vh = visibleH();

      const cover = Math.max(vw / mapW, vh / mapH);

      const isMobile = matchMedia("(max-width: 768px)").matches;
      scale = isMobile ? cover * 1.08 : cover;
      SCALE_MIN = cover;

      tx = (vw - mapW * scale) / 2;
      ty = (vh - mapH * scale) / 2;

      aplicarTransform();
    }

    // Pointer events
    const pointers = new Map();
    let lastPan = { x: 0, y: 0 };
    let startDist = 0;
    let startScale = 1;
    let pinchCenter = { x: 0, y: 0 };

    function dist(a, b) {
      const dx = a.x - b.x, dy = a.y - b.y;
      return Math.hypot(dx, dy);
    }

    mapa.addEventListener("pointerdown", (e) => {
      mapa.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 1) {
        lastPan = { x: e.clientX, y: e.clientY };
      } else if (pointers.size === 2) {
        const pts = [...pointers.values()];
        startDist = dist(pts[0], pts[1]);
        startScale = scale;
        pinchCenter = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
      }
    });

    mapa.addEventListener("pointermove", (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 1) {
        const dx = e.clientX - lastPan.x;
        const dy = e.clientY - lastPan.y;
        tx += dx; ty += dy;
        lastPan = { x: e.clientX, y: e.clientY };
        aplicarTransform();
      } else if (pointers.size === 2) {
        const pts = [...pointers.values()];
        const d = dist(pts[0], pts[1]);
        if (startDist <= 0) return;
        zoomAt(pinchCenter.x, pinchCenter.y, startScale * (d / startDist));
      }
    });

    function endPointer(e) {
      pointers.delete(e.pointerId);
      if (pointers.size === 1) {
        const remaining = [...pointers.values()][0];
        lastPan = { x: remaining.x, y: remaining.y };
      }
    }

    mapa.addEventListener("pointerup", endPointer);
    mapa.addEventListener("pointercancel", endPointer);

    // Wheel
    mapa.addEventListener("wheel", (e) => {
      e.preventDefault();
      if (e.ctrlKey) {
        const factor = Math.exp(-e.deltaY * 0.002);
        zoomAt(e.clientX, e.clientY, scale * factor);
      } else {
        tx -= e.deltaX;
        ty -= e.deltaY;
        aplicarTransform();
      }
    }, { passive: false });

    mapImg.addEventListener("load", () => {
      mapW = mapImg.naturalWidth;
      mapH = mapImg.naturalHeight;

      mapaInner.style.width = mapW + "px";
      mapaInner.style.height = mapH + "px";

      initView();
    });

    window.addEventListener("resize", () => {
      if (!mapW || !mapH) return;
      initView();
    });
  </script>
</body>
</html>
