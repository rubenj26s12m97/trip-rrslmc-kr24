<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Woljeonggyo Bridge – Gyeongju</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 210px;
      --photo-h: 155px;
      --gap-x: 58px;
      --gap-y: 38px;
    }

    html, body{
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;

      /* ✅ patrón C */
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    /* Fondo */
    .bg{
      position: fixed;
      inset: 0;
      background: url("../../img/gyeongju/woljeonggyo-bridge/01.jpg") center / cover no-repeat;
      z-index: 0;
    }

    .shade{
      position: fixed;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        rgba(0,0,0,0.14),
        rgba(0,0,0,0.62)
      );
      z-index: 1;
      pointer-events: none;
    }

    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
    }

    /* Contenedor general */
    .board{
      position: relative;
      min-height: 100vh;
      z-index: 5;
      display: grid;
      place-items: start center;
      padding: 88px 0 60px;
      box-sizing: border-box;
    }

    /* Layout 3 filas (3-3-3) */
    .layout{
      display: grid;
      grid-template-rows: auto auto auto;
      row-gap: var(--gap-y);
      justify-items: center;
      width: 100%;
    }

    .row{
      display: grid;
      grid-template-columns: repeat(3, var(--polaroid-w));
      column-gap: var(--gap-x);
      justify-content: center;
      align-items: start;
    }

    /* Polaroid base */
    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.95);
      border-radius: 12px;
      padding: 12px 12px 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.35);
      cursor: pointer;
      position: relative;
      user-select: none;
      transition: transform .16s ease, box-shadow .16s ease;
      transform: rotate(var(--r, 0deg)) translate(var(--tx, 0px), var(--ty, 0px));
    }

    @media (hover: hover){
      .polaroid:hover{
        transform: rotate(var(--r, 0deg)) translate(var(--tx, 0px), calc(var(--ty, 0px) - 2px)) scale(1.03);
        box-shadow: 0 18px 38px rgba(0,0,0,0.45);
        z-index: 20;
      }
    }

    /* Chincheta */
    .polaroid::before{
      content: "";
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .photo{
      margin-top: 10px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 8px;
      overflow: hidden;
      background: #eee;

      /* 🔑 des-rotada para nitidez */
      transform: rotate(calc(var(--r, 0deg) * -1));
      transform-origin: center;
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* “Desorden controlado”: rotación + micro desplazamientos */
    .p1 { --r:-3deg; --tx:-10px; --ty:-10px; }
    .p2 { --r: 2deg; --tx:  6px; --ty:  4px; }
    .p3 { --r:-1deg; --tx: 12px; --ty:-6px; }

    .p4 { --r: 2deg; --tx:-14px; --ty: 10px; }
    .p5 { --r:-2deg; --tx:  8px; --ty: -4px; }
    .p6 { --r: 3deg; --tx: 10px; --ty: 12px; }

    .p7 { --r:-2deg; --tx:-6px;  --ty:  6px; }
    .p8 { --r: 1deg; --tx: 14px; --ty: -2px; }
    .p9 { --r:-3deg; --tx:  2px; --ty: 10px; }

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
    }

    .modal.open{ display:flex; }

    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 14px;
    }

    /* ✅ móvil: mantener 3 columnas y permitir scroll horizontal por fila */
    @media (max-width: 980px){
      :root{
        --polaroid-w: 190px;
        --photo-h: 140px;
        --gap-x: 22px;
        --gap-y: 34px;
      }

      .row{
        grid-template-columns: repeat(3, var(--polaroid-w));
        column-gap: var(--gap-x);
        justify-content: start;

        overflow-x: auto;
        overflow-y: visible;
        -webkit-overflow-scrolling: touch;
        padding: 0 10px 10px;
        scroll-snap-type: x mandatory;
      }

      .polaroid{
        scroll-snap-align: center;
        --tx: 0px;
        --ty: 0px;
        --r: 0deg;
      }
      .photo{ transform:none; }
    }

    @media (max-width: 520px){
      :root{
        --polaroid-w: 165px;
        --photo-h: 120px;
        --gap-x: 18px;
        --gap-y: 28px;
      }
      .board{ padding-top: 78px; }
    }
  </style>
</head>

<body>
  <div class="bg"></div>
  <div class="shade"></div>

  <a class="back" href="../../gyeongju.html">← Volver a Gyeongju</a>

  <main class="board">
    <section class="layout">

      <div class="row">
        <div class="polaroid p1" data-src="../../img/gyeongju/woljeonggyo-bridge/01.jpg">
          <div class="photo"><img src="../../img/gyeongju/woljeonggyo-bridge/01.jpg" alt=""></div>
        </div>

        <div class="polaroid p2" data-src="../../img/gyeongju/woljeonggyo-bridge/02.jpg">
          <div class="photo"><img src="../../img/gyeongju/woljeonggyo-bridge/02.jpg" alt=""></div>
        </div>

        <div class="polaroid p3" data-src="../../img/gyeongju/woljeonggyo-bridge/03.jpg">
          <div class="photo"><img src="../../img/gyeongju/woljeonggyo-bridge/03.jpg" alt=""></div>
        </div>
      </div>

      <div class="row">
        <div class="polaroid p4" data-src="../../img/gyeongju/woljeonggyo-bridge/04.jpg">
          <div class="photo"><img src="../../img/gyeongju/woljeonggyo-bridge/04.jpg" alt=""></div>
        </div>

        <div class="polaroid p5" data-src="../../img/gyeongju/woljeonggyo-bridge/05.jpg">
          <div class="photo"><img src="../../img/gyeongju/woljeonggyo-bridge/05.jpg" alt=""></div>
        </div>

        <div class="polaroid p6" data-src="../../img/gyeongju/woljeonggyo-bridge/06.jpg">
          <div class="photo"><img src="../../img/gyeongju/woljeonggyo-bridge/06.jpg" alt=""></div>
        </div>
      </div>

      <div class="row">
        <div class="polaroid p7" data-src="../../img/gyeongju/woljeonggyo-bridge/07.jpg">
          <div class="photo"><img src="../../img/gyeongju/woljeonggyo-bridge/07.jpg" alt=""></div>
        </div>

        <div class="polaroid p8" data-src="../../img/gyeongju/woljeonggyo-bridge/08.jpg">
          <div class="photo"><img src="../../img/gyeongju/woljeonggyo-bridge/08.jpg" alt=""></div>
        </div>

        <div class="polaroid p9" data-src="../../img/gyeongju/woljeonggyo-bridge/09.jpg">
          <div class="photo"><img src="../../img/gyeongju/woljeonggyo-bridge/09.jpg" alt=""></div>
        </div>
      </div>

    </section>
  </main>

  <div class="modal" id="modal">
    <img id="modalImg" alt="">
  </div>

  <script>
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    document.querySelectorAll(".polaroid").forEach(p => {
      p.addEventListener("click", () => {
        modalImg.src = p.dataset.src;
        modal.classList.add("open");
      });
    });

    modal.addEventListener("click", () => {
      modal.classList.remove("open");
      modalImg.src = "";
    });

    window.addEventListener("keydown", e => {
      if(e.key === "Escape") {
        modal.classList.remove("open");
        modalImg.src = "";
      }
    });
  </script>
</body>
</html>
