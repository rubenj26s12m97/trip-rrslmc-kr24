<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Woljeonggyo Bridge – Gyeongju</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 210px;
      --photo-h: 155px;
      --gap-x: 58px;
      --gap-y: 38px;
      --center-y: 0px;
    }

    html, body{
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;
      overflow: hidden;
    }

    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 20;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
      -webkit-tap-highlight-color: transparent;
    }

    .viewport{
      position: fixed;
      inset: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      background: #000;
      overflow-anchor: none;
      scroll-behavior: auto;
    }

    .stage{
      position: relative;
      width: 1400px;
      height: 900px;
      background:
        radial-gradient(
          ellipse at center,
          rgba(0,0,0,0.14),
          rgba(0,0,0,0.62)
        ),
        url("../../img/gyeongju/woljeonggyo-bridge/01.jpg") center / cover no-repeat;
    }

    /* Layout 3 filas (3-3-3) */
    .layout{
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, calc(-50% + var(--center-y)));

      display: grid;
      grid-template-rows: auto auto auto;
      row-gap: var(--gap-y);
      justify-items: center;
      width: max-content;
    }

    .row{
      display: grid;
      grid-template-columns: repeat(3, var(--polaroid-w));
      column-gap: var(--gap-x);
      justify-content: center;
      align-items: start;
      width: max-content;
    }

    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.95);
      border-radius: 12px;
      padding: 12px 12px 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.35);
      cursor: pointer;
      position: relative;
      user-select: none;
      -webkit-tap-highlight-color: transparent;

      transition: transform .16s ease, box-shadow .16s ease;

      /* ✅ corcho: primero desplaza, luego rota */
      transform:
        translateX(var(--tx, 0px))
        translateY(var(--ty, 0px))
        rotate(var(--r, 0deg));

      transform-origin: center;
      will-change: transform;
    }

    @media (hover: hover){
      .polaroid:hover{
        transform:
          translateX(var(--tx, 0px))
          translateY(calc(var(--ty, 0px) - 4px))
          rotate(var(--r, 0deg))
          scale(1.03);

        box-shadow: 0 18px 38px rgba(0,0,0,0.45);
        z-index: 20;
      }
    }

    .polaroid::before{
      content:"";
      position:absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .photo{
      margin-top: 10px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 8px;
      overflow: hidden;
      background: #eee;

      /* ✅ des-rotada para nitidez (solo desktop) */
      transform: rotate(calc(var(--r, 0deg) * -1));
      transform-origin: center;
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* Desktop: “desorden controlado” */
    .p1 { --r:-3deg; --tx:-10px; --ty:-10px; }
    .p2 { --r: 2deg; --tx:  6px; --ty:  4px; }
    .p3 { --r:-1deg; --tx: 12px; --ty: -6px; }

    .p4 { --r: 2deg; --tx:-14px; --ty: 10px; }
    .p5 { --r:-2deg; --tx:  8px; --ty: -4px; }
    .p6 { --r: 3deg; --tx: 10px; --ty: 12px; }

    .p7 { --r:-2deg; --tx:-6px;  --ty:  6px; }
    .p8 { --r: 1deg; --tx: 14px; --ty: -2px; }
    .p9 { --r:-3deg; --tx:  2px; --ty: 10px; }

    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
      box-sizing: border-box;
    }
    .modal.open{ display:flex; }
    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 14px;
    }

    /* ✅ móvil: mantener 3x3x3 pero corcho suave (NO a cero) */
    @media (max-width: 980px){
      :root{
        --polaroid-w: 190px;
        --photo-h: 140px;
        --gap-x: 22px;
        --gap-y: 34px;
        --center-y: 0px;
      }

      .stage{
        width: 1200px;
        height: 900px;
      }

      /* corcho suave móvil */
      .p1 { --r:-0.9deg; --tx:-3px; --ty:-8px; }
      .p2 { --r: 0.7deg; --tx: 2px; --ty:  4px; }
      .p3 { --r:-0.6deg; --tx: 3px; --ty: -6px; }

      .p4 { --r: 0.8deg; --tx:-4px; --ty:  8px; }
      .p5 { --r:-0.7deg; --tx: 2px; --ty: -4px; }
      .p6 { --r: 1.0deg; --tx: 3px; --ty: 10px; }

      .p7 { --r:-0.8deg; --tx:-2px; --ty:  6px; }
      .p8 { --r: 0.6deg; --tx: 4px; --ty: -2px; }
      .p9 { --r:-1.0deg; --tx: 1px; --ty:  8px; }

      /* móvil: foto recta para nitidez */
      .photo{ transform:none; }
    }

    @media (max-width: 520px){
      :root{
        --polaroid-w: 165px;
        --photo-h: 120px;
        --gap-x: 18px;
        --gap-y: 28px;
      }
    }
  </style>
</head>

<body>
  <a class="back" href="../../gyeongju.html">← Volver a Gyeongju</a>

  <div class="viewport" id="viewport">
    <div class="stage" id="stage">

      <section class="layout" id="layout">
        <div class="row">
          <div class="polaroid p1" data-src="../../img/gyeongju/woljeonggyo-bridge/01.jpg">
            <div class="photo"><img src="../../img/gyeongju/woljeonggyo-bridge/01.jpg" alt=""></div>
          </div>

          <div class="polaroid p2" data-src="../../img/gyeongju/woljeonggyo-bridge/02.jpg">
            <div class="photo"><img src="../../img/gyeongju/woljeonggyo-bridge/02.jpg" alt=""></div>
          </div>

          <div class="polaroid p3" data-src="../../img/gyeongju/woljeonggyo-bridge/03.jpg">
            <div class="photo"><img src="../../img/gyeongju/woljeonggyo-bridge/03.jpg" alt=""></div>
          </div>
        </div>

        <div class="row">
          <div class="polaroid p4" data-src="../../img/gyeongju/woljeonggyo-bridge/04.jpg">
            <div class="photo"><img src="../../img/gyeongju/woljeonggyo-bridge/04.jpg" alt=""></div>
          </div>

          <div class="polaroid p5" data-src="../../img/gyeongju/woljeonggyo-bridge/05.jpg">
            <div class="photo"><img src="../../img/gyeongju/woljeonggyo-bridge/05.jpg" alt=""></div>
          </div>

          <div class="polaroid p6" data-src="../../img/gyeongju/woljeonggyo-bridge/06.jpg">
            <div class="photo"><img src="../../img/gyeongju/woljeonggyo-bridge/06.jpg" alt=""></div>
          </div>
        </div>

        <div class="row">
          <div class="polaroid p7" data-src="../../img/gyeongju/woljeonggyo-bridge/07.jpg">
            <div class="photo"><img src="../../img/gyeongju/woljeonggyo-bridge/07.jpg" alt=""></div>
          </div>

          <div class="polaroid p8" data-src="../../img/gyeongju/woljeonggyo-bridge/08.jpg">
            <div class="photo"><img src="../../img/gyeongju/woljeonggyo-bridge/08.jpg" alt=""></div>
          </div>

          <div class="polaroid p9" data-src="../../img/gyeongju/woljeonggyo-bridge/09.jpg">
            <div class="photo"><img src="../../img/gyeongju/woljeonggyo-bridge/09.jpg" alt=""></div>
          </div>
        </div>
      </section>

    </div>
  </div>

  <div class="modal" id="modal">
    <img id="modalImg" alt="">
  </div>

  <script>
    // ---------- Modal ----------
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    document.querySelectorAll(".polaroid").forEach(p => {
      p.addEventListener("click", () => {
        modalImg.src = p.dataset.src;
        modal.classList.add("open");
      });
    });

    function closeModal(){
      modal.classList.remove("open");
      modalImg.src = "";
    }

    modal.addEventListener("click", closeModal);
    window.addEventListener("keydown", e => {
      if(e.key === "Escape") closeModal();
    });

    // ---------- Center ----------
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    function clamp(v, min, max){ return Math.min(Math.max(v, min), max); }

    function centerOnLayout(){
      const vp = document.getElementById("viewport");
      const stage = document.getElementById("stage");
      const layout = document.getElementById("layout");
      if (!vp || !stage || !layout) return;

      const cx = layout.offsetLeft + layout.offsetWidth / 2;
      const cy = layout.offsetTop  + layout.offsetHeight / 2;

      const targetX = cx - vp.clientWidth / 2;
      const targetY = cy - vp.clientHeight / 2;

      const maxX = stage.offsetWidth  - vp.clientWidth;
      const maxY = stage.offsetHeight - vp.clientHeight;

      vp.scrollLeft = clamp(targetX, 0, Math.max(0, maxX));
      vp.scrollTop  = clamp(targetY, 0, Math.max(0, maxY));
    }

    function hardResetScroll(){
      const vp = document.getElementById("viewport");
      if (!vp) return;

      vp.scrollTo({ left: 0, top: 0, behavior: "auto" });
      vp.scrollLeft = 1; vp.scrollTop = 1;
      vp.scrollLeft = 0; vp.scrollTop = 0;
    }

    function forceCenter(){
      hardResetScroll();
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          centerOnLayout();
          setTimeout(centerOnLayout, 60);
          setTimeout(centerOnLayout, 180);
          setTimeout(centerOnLayout, 420);
        });
      });
    }

    document.addEventListener("DOMContentLoaded", hardResetScroll);
    window.addEventListener("load", forceCenter);
    window.addEventListener("pageshow", () => forceCenter());
    window.addEventListener("orientationchange", () => setTimeout(forceCenter, 250));
    window.addEventListener("resize", () => setTimeout(forceCenter, 120));
  </script>
</body>
</html>
