<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Lotus Garden – Gyeongju</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 220px;
      --photo-h: 160px;

      /* ✅ más “aire” para que no se vea simétrico */
      --gap-x: 86px;
      --gap-y: 72px;

      --center-y: 0px;
    }

    html, body{
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;
      overflow: hidden;
    }

    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 20;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
      -webkit-tap-highlight-color: transparent;
    }

    .viewport{
      position: fixed;
      inset: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      background: #000;
      overflow-anchor: none;
      scroll-behavior: auto;
    }

    .stage{
      position: relative;
      width: 1500px;
      height: 980px;
      background:
        radial-gradient(
          ellipse at center,
          rgba(0,0,0,0.10),
          rgba(0,0,0,0.55)
        ),
        url("../../img/gyeongju/lotus-garden/01.jpg") center / cover no-repeat;
    }

    .grid{
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, calc(-50% + var(--center-y)));

      display: grid;
      grid-template-columns: repeat(3, var(--polaroid-w));
      column-gap: var(--gap-x);
      row-gap: var(--gap-y);
      align-items: start;
      justify-items: center;
      width: max-content;
      overflow: visible;
    }

    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.95);
      border-radius: 12px;
      padding: 12px 12px 18px;
      box-sizing: border-box;
      box-shadow: 0 14px 30px rgba(0,0,0,0.35);
      cursor: pointer;
      position: relative;
      user-select: none;
      -webkit-tap-highlight-color: transparent;

      /* ✅ corcho: X/Y + rotación */
      transform:
        translateX(var(--tx,0))
        translateY(var(--ty,0))
        rotate(var(--r,0deg));
      transform-origin: center;
      transition: transform .16s ease, box-shadow .16s ease;
      will-change: transform;
    }

    @media (hover: hover){
      .polaroid:hover{
        transform:
          translateX(var(--tx,0))
          translateY(calc(var(--ty,0) - 4px))
          rotate(var(--r,0deg))
          scale(1.04);
        box-shadow: 0 18px 38px rgba(0,0,0,0.45);
        z-index: 20;
      }
    }

    .polaroid::before{
      content:"";
      position:absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .photo{
      margin-top: 10px;
      width: 100%;
      height: var(--photo-h);
      background: rgba(240,240,240,0.9);
      border-radius: 8px;
      overflow: hidden;

      /* ✅ “des-rotada” para nitidez */
      transform: rotate(calc(var(--r,0deg) * -1));
      transform-origin: center;
    }

    .polaroid img{
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* ===== Desktop: corcho un poco más marcado ===== */
    .p1{ --r:-3.2deg; --tx:-10px; --ty: 12px; }
    .p2{ --r: 2.4deg; --tx:  8px; --ty:-10px; }
    .p3{ --r: 1.6deg; --tx: 10px; --ty: 16px; }
    .p4{ --r:-2.2deg; --tx:-12px; --ty: -8px; }
    .p5{ --r: 3.0deg; --tx:  6px; --ty: 14px; }
    .p6{ --r:-1.4deg; --tx:-6px;  --ty:-12px; }

    /* Recortes controlados (tuyos) */
    .p1 img{ object-position: 50% 42%; }
    .p2 img{ object-position: 50% 35%; }
    .p3 img{ object-position: 50% 45%; }
    .p4 img{ object-position: 55% 50%; }
    .p5 img{ object-position: 50% 65%; }
    .p6 img{ object-position: 50% 70%; }

    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
      box-sizing: border-box;
    }
    .modal.open{ display:flex; }

    .modal img{
      max-width: min(1100px, 96vw);
      max-height: 92vh;
      object-fit: contain;
      border-radius: 14px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.55);
      background: rgba(255,255,255,0.04);
    }

    /* ✅ móvil: scroll SOLO global; corcho suave (no “todo recto”) */
    @media (max-width: 980px){
      :root{
        --polaroid-w: 190px;
        --photo-h: 138px;

        --gap-x: 54px;
        --gap-y: 48px;

        --center-y: 0px;
      }

      .stage{
        width: 1200px;
        height: 900px;
      }

      /* corcho suave en móvil */
      .p1{ --r:-0.9deg; --tx:-3px; --ty:  8px; }
      .p2{ --r: 0.8deg; --tx:  2px; --ty: -6px; }
      .p3{ --r: 0.6deg; --tx:  4px; --ty: 10px; }
      .p4{ --r:-0.7deg; --tx:-4px; --ty: -6px; }
      .p5{ --r: 1.0deg; --tx:  2px; --ty:  8px; }
      .p6{ --r:-0.6deg; --tx:-2px; --ty:-10px; }

      /* móvil: foto recta */
      .photo{ transform:none; }
    }

    @media (max-width: 520px){
      :root{
        --polaroid-w: 170px;
        --photo-h: 120px;
        --gap-x: 32px;
        --gap-y: 26px;
      }
    }
  </style>
</head>

<body>
  <a class="back" href="../../gyeongju.html">← Volver a Gyeongju</a>

  <div class="viewport" id="viewport">
    <div class="stage" id="stage">

      <section class="grid" id="grid" aria-label="Fotos Lotus Garden">
        <div class="polaroid p1" data-src="../../img/gyeongju/lotus-garden/01.jpg">
          <div class="photo"><img src="../../img/gyeongju/lotus-garden/01.jpg" alt="Lotus Garden 01"></div>
        </div>

        <div class="polaroid p2" data-src="../../img/gyeongju/lotus-garden/02.jpg">
          <div class="photo"><img src="../../img/gyeongju/lotus-garden/02.jpg" alt="Lotus Garden 02"></div>
        </div>

        <div class="polaroid p3" data-src="../../img/gyeongju/lotus-garden/03.jpg">
          <div class="photo"><img src="../../img/gyeongju/lotus-garden/03.jpg" alt="Lotus Garden 03"></div>
        </div>

        <div class="polaroid p4" data-src="../../img/gyeongju/lotus-garden/04.jpg">
          <div class="photo"><img src="../../img/gyeongju/lotus-garden/04.jpg" alt="Lotus Garden 04"></div>
        </div>

        <div class="polaroid p5" data-src="../../img/gyeongju/lotus-garden/05.jpg">
          <div class="photo"><img src="../../img/gyeongju/lotus-garden/05.jpg" alt="Lotus Garden 05"></div>
        </div>

        <div class="polaroid p6" data-src="../../img/gyeongju/lotus-garden/06.jpg">
          <div class="photo"><img src="../../img/gyeongju/lotus-garden/06.jpg" alt="Lotus Garden 06"></div>
        </div>
      </section>

    </div>
  </div>

  <div class="modal" id="modal" aria-hidden="true">
    <img id="modalImg" alt="Foto ampliada">
  </div>

  <script>
    // ---------- Modal ----------
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    function openModal(src){
      modalImg.src = src;
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeModal(){
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      modalImg.src = "";
    }

    document.querySelectorAll(".polaroid").forEach(card => {
      card.addEventListener("click", () => openModal(card.dataset.src));
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    // ---------- Center on grid ----------
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    function clamp(v, min, max){ return Math.min(Math.max(v, min), max); }

    function centerOnGrid(){
      const vp = document.getElementById("viewport");
      const stage = document.getElementById("stage");
      const grid = document.getElementById("grid");
      if (!vp || !stage || !grid) return;

      const cx = grid.offsetLeft + grid.offsetWidth / 2;
      const cy = grid.offsetTop  + grid.offsetHeight / 2;

      const targetX = cx - vp.clientWidth / 2;
      const targetY = cy - vp.clientHeight / 2;

      const maxX = stage.offsetWidth  - vp.clientWidth;
      const maxY = stage.offsetHeight - vp.clientHeight;

      vp.scrollLeft = clamp(targetX, 0, Math.max(0, maxX));
      vp.scrollTop  = clamp(targetY, 0, Math.max(0, maxY));
    }

    function hardResetScroll(){
      const vp = document.getElementById("viewport");
      if (!vp) return;

      vp.scrollTo({ left: 0, top: 0, behavior: "auto" });
      // “nudge” Safari/iOS
      vp.scrollLeft = 1; vp.scrollTop = 1;
      vp.scrollLeft = 0; vp.scrollTop = 0;
    }

    function forceCenter(){
      hardResetScroll();
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          centerOnGrid();
          setTimeout(centerOnGrid, 60);
          setTimeout(centerOnGrid, 180);
          setTimeout(centerOnGrid, 420);
        });
      });
    }

    document.addEventListener("DOMContentLoaded", hardResetScroll);
    window.addEventListener("load", forceCenter);
    window.addEventListener("pageshow", () => forceCenter());
    window.addEventListener("orientationchange", () => setTimeout(forceCenter, 250));
    window.addEventListener("resize", () => setTimeout(forceCenter, 120));
  </script>
</body>
</html>
