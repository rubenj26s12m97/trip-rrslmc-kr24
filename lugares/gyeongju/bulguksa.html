<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Bulguksa – Gyeongju</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 170px;
      --photo-h: 124px;

      --gap-x-3: 58px;
      --gap-x-4: 46px;
      --gap-y: 56px;
    }

    html, body {
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;

      /* ✅ patrón C: permitir scroll */
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    /* Fondo */
    .bg {
      position: fixed;
      inset: 0;
      background: url("../../img/gyeongju/bulguksa/06.jpg") center / cover no-repeat;
      z-index: 0;
    }

    .shade {
      position: fixed;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        rgba(0,0,0,0.12),
        rgba(0,0,0,0.60)
      );
      z-index: 1;
      pointer-events: none;
    }

    .back {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
    }

    /* Contenedor scrolleable */
    .board {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: 70px 24px 70px;
      box-sizing: border-box;
    }

    .layout{
      display: grid;
      grid-template-rows: auto auto auto;
      row-gap: var(--gap-y);
      justify-items: center;
      transform: translateY(-10px);
      width: 100%;
    }

    .row-3{
      display: grid;
      grid-template-columns: repeat(3, var(--polaroid-w));
      column-gap: var(--gap-x-3);
      justify-content: center;
      align-items: start;
    }

    .row-4{
      display: grid;
      grid-template-columns: repeat(4, var(--polaroid-w));
      column-gap: var(--gap-x-4);
      justify-content: center;
      align-items: start;
    }

    /* Polaroid */
    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.95);
      border-radius: 12px;
      padding: 12px 12px 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.35);
      cursor: pointer;
      position: relative;
      user-select: none;

      transform: translateY(var(--lift, 0px)) rotate(var(--r, 0deg));
      transition: transform .16s ease, box-shadow .16s ease;
    }

    @media (hover: hover){
      .polaroid:hover{
        transform: translateY(calc(var(--lift, 0px) - 2px)) rotate(var(--r, 0deg)) scale(1.03);
        box-shadow: 0 18px 38px rgba(0,0,0,0.45);
        z-index: 20;
      }
    }

    .polaroid::before{
      content:"";
      position:absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .photo{
      margin-top: 10px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 8px;
      overflow: hidden;
      background:#eee;
      transform: rotate(calc(var(--r, 0deg) * -1));
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
    }

    /* Offsets corcho (3 / 4 / 3) */
    .p1 { --lift:  10px; --r: -2deg; }
    .p2 { --lift:  -6px; --r:  2deg; }
    .p3 { --lift:  14px; --r: -1deg; }

    .p4 { --lift:  -8px; --r:  2deg; }
    .p5 { --lift:  12px; --r: -2deg; }
    .p6 { --lift:  -4px; --r:  1deg; }
    .p7 { --lift:  16px; --r: -1deg; }

    .p8  { --lift: -6px; --r:  2deg; }
    .p9  { --lift: 10px; --r: -2deg; }
    .p10 { --lift: -4px; --r:  1deg; }

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
    }
    .modal.open{ display:flex; }
    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 14px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.55);
    }

    /* ✅ móvil: NO reflow a 3 columnas forzado.
       Mantener 3/4/3 y permitir scroll horizontal por fila */
    @media (max-width: 1100px){
      :root{
        --polaroid-w: 160px;
        --photo-h: 118px;
        --gap-x-3: 22px;
        --gap-x-4: 18px;
        --gap-y: 42px;
      }

      .row-3{
        grid-template-columns: repeat(3, var(--polaroid-w));
        column-gap: var(--gap-x-3);
        justify-content: start;

        overflow-x: auto;
        overflow-y: visible;
        -webkit-overflow-scrolling: touch;
        padding: 0 10px 10px;
        scroll-snap-type: x mandatory;
      }

      .row-4{
        grid-template-columns: repeat(4, var(--polaroid-w));
        column-gap: var(--gap-x-4);
        justify-content: start;

        overflow-x: auto;
        overflow-y: visible;
        -webkit-overflow-scrolling: touch;
        padding: 0 10px 10px;
        scroll-snap-type: x mandatory;
      }

      .polaroid{ scroll-snap-align: center; --lift: 0px; --r: 0deg; }
      .photo{ transform:none; }
    }
  </style>
</head>

<body>
  <div class="bg"></div>
  <div class="shade"></div>

  <a class="back" href="../../gyeongju.html">← Volver a Gyeongju</a>

  <main class="board">
    <section class="layout">

      <!-- Fila 1: 3 -->
      <div class="row-3">
        <div class="polaroid p1" data-src="../../img/gyeongju/bulguksa/01.jpg"><div class="photo"><img src="../../img/gyeongju/bulguksa/01.jpg" alt=""></div></div>
        <div class="polaroid p2" data-src="../../img/gyeongju/bulguksa/02.jpg"><div class="photo"><img src="../../img/gyeongju/bulguksa/02.jpg" alt=""></div></div>
        <div class="polaroid p3" data-src="../../img/gyeongju/bulguksa/03.jpg"><div class="photo"><img src="../../img/gyeongju/bulguksa/03.jpg" alt=""></div></div>
      </div>

      <!-- Fila 2: 4 -->
      <div class="row-4">
        <div class="polaroid p4" data-src="../../img/gyeongju/bulguksa/04.jpg"><div class="photo"><img src="../../img/gyeongju/bulguksa/04.jpg" alt=""></div></div>
        <div class="polaroid p5" data-src="../../img/gyeongju/bulguksa/05.jpg"><div class="photo"><img src="../../img/gyeongju/bulguksa/05.jpg" alt=""></div></div>
        <div class="polaroid p6" data-src="../../img/gyeongju/bulguksa/06.jpg"><div class="photo"><img src="../../img/gyeongju/bulguksa/06.jpg" alt=""></div></div>
        <div class="polaroid p7" data-src="../../img/gyeongju/bulguksa/07.jpg"><div class="photo"><img src="../../img/gyeongju/bulguksa/07.jpg" alt=""></div></div>
      </div>

      <!-- Fila 3: 3 -->
      <div class="row-3">
        <div class="polaroid p8"  data-src="../../img/gyeongju/bulguksa/08.jpg"><div class="photo"><img src="../../img/gyeongju/bulguksa/08.jpg" alt=""></div></div>
        <div class="polaroid p9"  data-src="../../img/gyeongju/bulguksa/09.jpg"><div class="photo"><img src="../../img/gyeongju/bulguksa/09.jpg" alt=""></div></div>
        <div class="polaroid p10" data-src="../../img/gyeongju/bulguksa/10.jpg"><div class="photo"><img src="../../img/gyeongju/bulguksa/10.jpg" alt=""></div></div>
      </div>

    </section>
  </main>

  <div class="modal" id="modal">
    <img id="modalImg" alt="">
  </div>

  <script>
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    document.querySelectorAll(".polaroid").forEach(p => {
      p.addEventListener("click", () => {
        modalImg.src = p.dataset.src;
        modal.classList.add("open");
      });
    });

    modal.addEventListener("click", () => {
      modal.classList.remove("open");
      modalImg.src = "";
    });

    window.addEventListener("keydown", e => {
      if(e.key === "Escape"){
        modal.classList.remove("open");
        modalImg.src = "";
      }
    });
  </script>
</body>
</html>
