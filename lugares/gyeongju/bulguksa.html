<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Bulguksa – Gyeongju</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 170px;
      --photo-h: 124px;

      /* ✅ más aire (sin scroll por fila) */
      --gap-x-3: 70px;
      --gap-x-4: 56px;
      --gap-y: 70px;

      --center-y: -10px;
    }

    html, body{
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;
      overflow: hidden;
    }

    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 20;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
      -webkit-tap-highlight-color: transparent;
    }

    .viewport{
      position: fixed;
      inset: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      background: #000;
      overflow-anchor: none;
      scroll-behavior: auto;
    }

    .stage{
      position: relative;
      width: 1400px;
      height: 900px;
      overflow: visible;
      background:
        radial-gradient(
          ellipse at center,
          rgba(0,0,0,0.12),
          rgba(0,0,0,0.60)
        ),
        url("../../img/gyeongju/bulguksa/06.jpg") center / cover no-repeat;
    }

    .layout{
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, calc(-50% + var(--center-y)));

      display: grid;
      grid-template-rows: auto auto auto;
      row-gap: var(--gap-y);
      justify-items: center;
      width: max-content;
    }

    .row-3{
      display: grid;
      grid-template-columns: repeat(3, var(--polaroid-w));
      column-gap: var(--gap-x-3);
      justify-content: center;
      align-items: start;
      width: max-content;
      overflow: visible; /* ✅ no scroll interno */
    }

    .row-4{
      display: grid;
      grid-template-columns: repeat(4, var(--polaroid-w));
      column-gap: var(--gap-x-4);
      justify-content: center;
      align-items: start;
      width: max-content;
      overflow: visible; /* ✅ no scroll interno */
    }

    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.95);
      border-radius: 12px;
      padding: 12px 12px 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.35);
      cursor: pointer;
      position: relative;
      user-select: none;
      -webkit-tap-highlight-color: transparent;

      /* ✅ corcho */
      transform:
        translateX(var(--tx,0))
        translateY(var(--ty,0))
        rotate(var(--r,0deg));

      transition: transform .16s ease, box-shadow .16s ease;
    }

    @media (hover: hover){
      .polaroid:hover{
        transform:
          translateX(var(--tx,0))
          translateY(calc(var(--ty,0) - 4px))
          rotate(var(--r,0deg))
          scale(1.04);
        box-shadow: 0 18px 38px rgba(0,0,0,0.45);
        z-index: 20;
      }
    }

    .polaroid::before{
      content:"";
      position:absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .photo{
      margin-top: 10px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 8px;
      overflow: hidden;
      background:#eee;

      /* desktop: foto recta respecto al marco */
      transform: rotate(calc(var(--r, 0deg) * -1));
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* ===== Desktop: un poco más marcado ===== */
    .p1 { --r:-3.0deg; --tx:-8px;  --ty: 12px; }
    .p2 { --r: 2.6deg; --tx: 6px;  --ty: -8px; }
    .p3 { --r:-2.0deg; --tx:10px;  --ty: 16px; }

    .p4 { --r: 2.2deg; --tx:-10px; --ty:-10px; }
    .p5 { --r:-3.2deg; --tx: 8px;  --ty: 10px; }
    .p6 { --r: 2.0deg; --tx: 4px;  --ty: -8px; }
    .p7 { --r:-2.4deg; --tx:-6px;  --ty: 14px; }

    .p8  { --r: 2.6deg; --tx:-8px; --ty:-12px; }
    .p9  { --r:-3.0deg; --tx: 6px; --ty:  8px; }
    .p10 { --r: 2.0deg; --tx:10px; --ty:-10px; }

    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
      box-sizing: border-box;
    }
    .modal.open{ display:flex; }
    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 14px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.55);
    }

    /* ✅ móvil PRIORIDAD: scroll global + corcho suave */
    @media (max-width: 1100px){
      :root{
        --polaroid-w: 160px;
        --photo-h: 118px;

        --gap-x-3: 30px;
        --gap-x-4: 24px;
        --gap-y: 44px;

        --center-y: -10px;
      }

      .stage{
        width: 1200px;
        height: 900px;
      }

      /* suave en móvil: rotación pequeña + alturas distintas */
      .p1 { --r:-1.1deg; --tx:-3px; --ty:  8px; }
      .p2 { --r: 0.9deg; --tx: 2px; --ty: -6px; }
      .p3 { --r:-0.8deg; --tx: 4px; --ty: 10px; }

      .p4 { --r: 1.0deg; --tx:-4px; --ty: -6px; }
      .p5 { --r:-1.2deg; --tx: 3px; --ty:  6px; }
      .p6 { --r: 0.8deg; --tx: 1px; --ty: -4px; }
      .p7 { --r:-0.9deg; --tx:-2px; --ty:  8px; }

      .p8  { --r: 1.1deg; --tx:-3px; --ty: -8px; }
      .p9  { --r:-1.0deg; --tx: 2px; --ty:  6px; }
      .p10 { --r: 0.9deg; --tx: 3px; --ty: -6px; }

      /* móvil: foto recta */
      .photo{ transform:none; }
    }
  </style>
</head>

<body>
  <a class="back" href="../../gyeongju.html">← Volver a Gyeongju</a>

  <div class="viewport" id="viewport">
    <div class="stage" id="stage">
      <section class="layout" id="layout">

        <!-- Fila 1: 3 -->
        <div class="row-3">
          <div class="polaroid p1" data-src="../../img/gyeongju/bulguksa/01.jpg"><div class="photo"><img src="../../img/gyeongju/bulguksa/01.jpg" alt=""></div></div>
          <div class="polaroid p2" data-src="../../img/gyeongju/bulguksa/02.jpg"><div class="photo"><img src="../../img/gyeongju/bulguksa/02.jpg" alt=""></div></div>
          <div class="polaroid p3" data-src="../../img/gyeongju/bulguksa/03.jpg"><div class="photo"><img src="../../img/gyeongju/bulguksa/03.jpg" alt=""></div></div>
        </div>

        <!-- Fila 2: 4 -->
        <div class="row-4">
          <div class="polaroid p4" data-src="../../img/gyeongju/bulguksa/04.jpg"><div class="photo"><img src="../../img/gyeongju/bulguksa/04.jpg" alt=""></div></div>
          <div class="polaroid p5" data-src="../../img/gyeongju/bulguksa/05.jpg"><div class="photo"><img src="../../img/gyeongju/bulguksa/05.jpg" alt=""></div></div>
          <div class="polaroid p6" data-src="../../img/gyeongju/bulguksa/06.jpg"><div class="photo"><img src="../../img/gyeongju/bulguksa/06.jpg" alt=""></div></div>
          <div class="polaroid p7" data-src="../../img/gyeongju/bulguksa/07.jpg"><div class="photo"><img src="../../img/gyeongju/bulguksa/07.jpg" alt=""></div></div>
        </div>

        <!-- Fila 3: 3 -->
        <div class="row-3">
          <div class="polaroid p8"  data-src="../../img/gyeongju/bulguksa/08.jpg"><div class="photo"><img src="../../img/gyeongju/bulguksa/08.jpg" alt=""></div></div>
          <div class="polaroid p9"  data-src="../../img/gyeongju/bulguksa/09.jpg"><div class="photo"><img src="../../img/gyeongju/bulguksa/09.jpg" alt=""></div></div>
          <div class="polaroid p10" data-src="../../img/gyeongju/bulguksa/10.jpg"><div class="photo"><img src="../../img/gyeongju/bulguksa/10.jpg" alt=""></div></div>
        </div>

      </section>
    </div>
  </div>

  <div class="modal" id="modal">
    <img id="modalImg" alt="">
  </div>

  <script>
    // ---------- Modal ----------
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    document.querySelectorAll(".polaroid").forEach(p => {
      p.addEventListener("click", () => {
        modalImg.src = p.dataset.src || p.querySelector("img").src;
        modal.classList.add("open");
      });
    });

    function closeModal(){
      modal.classList.remove("open");
      modalImg.src = "";
    }

    modal.addEventListener("click", closeModal);
    window.addEventListener("keydown", e => {
      if (e.key === "Escape") closeModal();
    });

    // ---------- Center on layout ----------
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";

    function clamp(v, min, max){ return Math.min(Math.max(v, min), max); }

    function centerOnLayout(){
      const vp = document.getElementById("viewport");
      const stage = document.getElementById("stage");
      const layout = document.getElementById("layout");
      if (!vp || !stage || !layout) return;

      const vpRect = vp.getBoundingClientRect();
      const layoutRect = layout.getBoundingClientRect();

      const layoutCx = layoutRect.left + layoutRect.width / 2;
      const layoutCy = layoutRect.top  + layoutRect.height / 2;

      const vpCx = vpRect.left + vpRect.width / 2;
      const vpCy = vpRect.top  + vpRect.height / 2;

      const dx = layoutCx - vpCx;
      const dy = layoutCy - vpCy;

      let targetX = vp.scrollLeft + dx;
      let targetY = vp.scrollTop  + dy;

      const maxX = Math.max(0, stage.scrollWidth  - vp.clientWidth);
      const maxY = Math.max(0, stage.scrollHeight - vp.clientHeight);

      vp.scrollLeft = clamp(targetX, 0, maxX);
      vp.scrollTop  = clamp(targetY, 0, maxY);
    }

    function hardResetScroll(){
      const vp = document.getElementById("viewport");
      if (!vp) return;

      vp.scrollTo({ left: 0, top: 0, behavior: "auto" });
      vp.scrollLeft = 1; vp.scrollTop = 1;
      vp.scrollLeft = 0; vp.scrollTop = 0;
    }

    function forceCenter(){
      hardResetScroll();
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          centerOnLayout();
          setTimeout(centerOnLayout, 80);
          setTimeout(centerOnLayout, 220);
          setTimeout(centerOnLayout, 520);
        });
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      hardResetScroll();
      requestAnimationFrame(centerOnLayout);
    });

    window.addEventListener("load", forceCenter);
    window.addEventListener("pageshow", () => forceCenter());

    window.addEventListener("orientationchange", () => setTimeout(forceCenter, 250));
    window.addEventListener("resize", () => setTimeout(forceCenter, 140));
  </script>
</body>
</html>
