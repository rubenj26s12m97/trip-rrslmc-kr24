<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Daereungwon Tomb Complex – Gyeongju</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 215px;
      --photo-h: 155px;
      --gap-x: 64px;
      --gap-y: 46px;
    }

    html, body {
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;

      /* ✅ patrón C: permitir scroll */
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Fondo */
    .bg {
      position: fixed;
      inset: 0;
      background: url("../../img/gyeongju/daereungwon-tomb-complex/01.jpg") center / cover no-repeat;
      z-index: 0;
    }

    .shade {
      position: fixed;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        rgba(0,0,0,0.15),
        rgba(0,0,0,0.6)
      );
      z-index: 1;
      pointer-events: none;
    }

    .back {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
    }

    /* ✅ Contenedor general: ya no fixed */
    .board {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 90px 18px 60px;
      box-sizing: border-box;
    }

    /* Layout 2 arriba / 3 abajo */
    .layout {
      display: grid;
      grid-template-rows: auto auto;
      row-gap: var(--gap-y);
      justify-items: center;
      width: 100%;
    }

    .row-top {
      display: grid;
      grid-template-columns: repeat(2, var(--polaroid-w));
      column-gap: var(--gap-x);
      justify-content: center;
      align-items: start;
    }

    .row-bottom {
      display: grid;
      grid-template-columns: repeat(3, var(--polaroid-w));
      column-gap: var(--gap-x);
      justify-content: center;
      align-items: start;
    }

    /* Polaroid base */
    .polaroid {
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.95);
      border-radius: 12px;
      padding: 12px 12px 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.35);
      cursor: pointer;
      position: relative;
      user-select: none;
      transition: transform .16s ease, box-shadow .16s ease;
      transform: rotate(var(--r, 0deg));
    }

    @media (hover: hover){
      .polaroid:hover {
        transform: rotate(var(--r, 0deg)) translateY(-2px) scale(1.03);
        box-shadow: 0 18px 38px rgba(0,0,0,0.45);
        z-index: 20;
      }
    }

    .polaroid::before{
      content: "";
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .photo {
      margin-top: 10px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 8px;
      overflow: hidden;
      background: #eee;
      transform: rotate(calc(var(--r, 0deg) * -1));
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Rotaciones suaves */
    .p1 { --r: -2deg; }
    .p2 { --r:  2deg; }
    .p3 { --r: -1deg; }
    .p4 { --r:  2deg; }
    .p5 { --r: -2deg; }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
    }

    .modal.open { display: flex; }

    .modal img {
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 14px;
    }

    /* ✅ móvil: mantener columnas (2 arriba / 3 abajo) y permitir scroll horizontal por fila */
    @media (max-width: 980px){
      :root{
        --polaroid-w: 185px;
        --photo-h: 135px;
        --gap-x: 20px;
        --gap-y: 36px;
      }

      .row-top{
        grid-template-columns: repeat(2, var(--polaroid-w));
        column-gap: var(--gap-x);
        justify-content: start;

        overflow-x: auto;
        overflow-y: visible;
        -webkit-overflow-scrolling: touch;
        padding: 0 10px 10px;
        scroll-snap-type: x mandatory;
      }

      .row-bottom{
        grid-template-columns: repeat(3, var(--polaroid-w));
        column-gap: var(--gap-x);
        justify-content: start;

        overflow-x: auto;
        overflow-y: visible;
        -webkit-overflow-scrolling: touch;
        padding: 0 10px 10px;
        scroll-snap-type: x mandatory;
      }

      .polaroid{ scroll-snap-align: center; --r: 0deg; }
      .photo{ transform:none; }
    }
  </style>
</head>

<body>
  <div class="bg"></div>
  <div class="shade"></div>

  <a class="back" href="../../gyeongju.html">← Volver a Gyeongju</a>

  <main class="board">
    <section class="layout">
      <!-- Arriba: 2 -->
      <div class="row-top">
        <div class="polaroid p1" data-src="../../img/gyeongju/daereungwon-tomb-complex/01.jpg">
          <div class="photo"><img src="../../img/gyeongju/daereungwon-tomb-complex/01.jpg" alt=""></div>
        </div>

        <div class="polaroid p2" data-src="../../img/gyeongju/daereungwon-tomb-complex/02.jpg">
          <div class="photo"><img src="../../img/gyeongju/daereungwon-tomb-complex/02.jpg" alt=""></div>
        </div>
      </div>

      <!-- Abajo: 3 -->
      <div class="row-bottom">
        <div class="polaroid p3" data-src="../../img/gyeongju/daereungwon-tomb-complex/03.jpg">
          <div class="photo"><img src="../../img/gyeongju/daereungwon-tomb-complex/03.jpg" alt=""></div>
        </div>

        <div class="polaroid p4" data-src="../../img/gyeongju/daereungwon-tomb-complex/04.jpg">
          <div class="photo"><img src="../../img/gyeongju/daereungwon-tomb-complex/04.jpg" alt=""></div>
        </div>

        <div class="polaroid p5" data-src="../../img/gyeongju/daereungwon-tomb-complex/05.jpg">
          <div class="photo"><img src="../../img/gyeongju/daereungwon-tomb-complex/05.jpg" alt=""></div>
        </div>
      </div>
    </section>
  </main>

  <div class="modal" id="modal">
    <img id="modalImg" alt="">
  </div>

  <script>
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    document.querySelectorAll(".polaroid").forEach(p => {
      p.addEventListener("click", () => {
        modalImg.src = p.dataset.src;
        modal.classList.add("open");
      });
    });

    modal.addEventListener("click", () => {
      modal.classList.remove("open");
      modalImg.src = "";
    });

    window.addEventListener("keydown", e => {
      if(e.key === "Escape"){
        modal.classList.remove("open");
        modalImg.src = "";
      }
    });
  </script>
</body>
</html>
