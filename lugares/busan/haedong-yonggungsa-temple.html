<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Haedong Yonggungsa Temple – Busan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 225px;
      --photo-h: 158px;

      /* ✅ más aire real */
      --gap-x: 88px;
      --gap-y: 82px;

      --center-y: 18px;
    }

    html, body{
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;
      overflow: hidden;
    }

    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 20;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
      -webkit-tap-highlight-color: transparent;
    }

    .viewport{
      position: fixed;
      inset: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      background: #000;
      overflow-anchor: none;
      scroll-behavior: auto;
    }

    .stage{
      position: relative;
      width: 1500px;
      height: 980px;
      overflow: visible;
      background:
        radial-gradient(
          ellipse at center,
          rgba(0,0,0,0.18),
          rgba(0,0,0,0.72)
        ),
        url("../../img/busan/haedong-yonggungsa-temple/01.jpg") center 45% / cover no-repeat;
    }

    .layout{
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, calc(-50% + var(--center-y)));

      display: grid;
      grid-template-rows: auto auto;
      row-gap: var(--gap-y);
      justify-items: center;
      width: max-content;
    }

    .row.top{
      display: grid;
      grid-template-columns: repeat(2, var(--polaroid-w));
      column-gap: var(--gap-x);
      justify-content: center;
      align-items: start;
      width: max-content;
      overflow: visible;
    }

    .row.bottom{
      display: grid;
      grid-template-columns: repeat(3, var(--polaroid-w));
      column-gap: var(--gap-x);
      justify-content: center;
      align-items: start;
      width: max-content;
      overflow: visible;
    }

    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.96);
      border-radius: 12px;
      padding: 12px 12px 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.35);
      cursor: pointer;
      position: relative;
      user-select: none;
      -webkit-tap-highlight-color: transparent;

      /* ✅ “corcho”: no misma altura + más rotación (sin superposición) */
      transform:
        translateX(var(--tx,0))
        translateY(var(--ty,0))
        rotate(var(--r,0deg));

      transition: transform .16s ease, box-shadow .16s ease;
    }

    @media (hover: hover){
      .polaroid:hover{
        transform:
          translateX(var(--tx,0))
          translateY(calc(var(--ty,0) - 4px))
          rotate(var(--r,0deg))
          scale(1.04);
        box-shadow: 0 18px 38px rgba(0,0,0,0.45);
        z-index: 20;
      }
    }

    .polaroid::before{
      content:"";
      position:absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .photo{
      margin-top: 10px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 8px;
      overflow: hidden;
      background:#eee;

      /* contrarrotación para que la foto quede “recta” respecto al marco */
      transform: rotate(calc(var(--r,0deg) * -1));
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* ✅ offsets: más rotación y alturas distintas (sin taparse) */
    .p1{ --r:-3.8deg; --tx:-10px; --ty: 14px; }
    .p2{ --r: 3.1deg; --tx:  8px; --ty:-10px; }

    .p3{ --r:-2.6deg; --tx: -6px; --ty: 12px; }
    .p4{ --r: 4.2deg; --tx: 10px; --ty:-14px; }
    .p5{ --r:-3.2deg; --tx:  4px; --ty:  6px; }

    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
    }
    .modal.open{ display:flex; }
    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 14px;
    }

    /* ✅ móvil: mismo patrón (solo scroll global) + calmado */
    @media (max-width: 980px){
      :root{
        --polaroid-w: 190px;
        --photo-h: 135px;
        --gap-x: 60px;
        --gap-y: 52px;
        --center-y: 12px;
      }

      .stage{
        width: 1200px;
        height: 900px;
      }

      /* sin carruseles internos */
      .row.top,
      .row.bottom{
        justify-content: center;
      }

      /* calmamos “corcho” en móvil */
      .polaroid{ --tx:0; --ty:0; --r:0deg; }
      .photo{ transform:none; }
    }
  </style>
</head>

<body>
  <a class="back" href="../../busan.html">← Volver a Busan</a>

  <div class="viewport" id="viewport">
    <div class="stage" id="stage">
      <section class="layout" id="layout">

        <div class="row top">
          <div class="polaroid p1" data-src="../../img/busan/haedong-yonggungsa-temple/01.jpg">
            <div class="photo"><img src="../../img/busan/haedong-yonggungsa-temple/01.jpg" alt=""></div>
          </div>
          <div class="polaroid p2" data-src="../../img/busan/haedong-yonggungsa-temple/02.jpg">
            <div class="photo"><img src="../../img/busan/haedong-yonggungsa-temple/02.jpg" alt=""></div>
          </div>
        </div>

        <div class="row bottom">
          <div class="polaroid p3" data-src="../../img/busan/haedong-yonggungsa-temple/03.jpg">
            <div class="photo"><img src="../../img/busan/haedong-yonggungsa-temple/03.jpg" alt=""></div>
          </div>
          <div class="polaroid p4" data-src="../../img/busan/haedong-yonggungsa-temple/04.jpg">
            <div class="photo"><img src="../../img/busan/haedong-yonggungsa-temple/04.jpg" alt=""></div>
          </div>
          <div class="polaroid p5" data-src="../../img/busan/haedong-yonggungsa-temple/05.jpg">
            <div class="photo"><img src="../../img/busan/haedong-yonggungsa-temple/05.jpg" alt=""></div>
          </div>
        </div>

      </section>
    </div>
  </div>

  <div class="modal" id="modal">
    <img id="modalImg" alt="">
  </div>

  <script>
    // ---------- Modal ----------
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    document.querySelectorAll(".polaroid").forEach(p => {
      p.addEventListener("click", () => {
        modalImg.src = p.dataset.src || p.querySelector("img").src;
        modal.classList.add("open");
      });
    });

    function closeModal(){
      modal.classList.remove("open");
      modalImg.src = "";
    }

    modal.addEventListener("click", closeModal);
    window.addEventListener("keydown", e => {
      if (e.key === "Escape") closeModal();
    });

    // ---------- FIX: entrar centrado (robusto con transforms) ----------
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";

    function clamp(v, min, max){ return Math.min(Math.max(v, min), max); }

    function centerOnLayout(){
      const vp = document.getElementById("viewport");
      const stage = document.getElementById("stage");
      const layout = document.getElementById("layout");
      if (!vp || !stage || !layout) return;

      const vpRect = vp.getBoundingClientRect();
      const layoutRect = layout.getBoundingClientRect();

      const layoutCx = layoutRect.left + layoutRect.width / 2;
      const layoutCy = layoutRect.top  + layoutRect.height / 2;

      const vpCx = vpRect.left + vpRect.width / 2;
      const vpCy = vpRect.top  + vpRect.height / 2;

      const dx = layoutCx - vpCx;
      const dy = layoutCy - vpCy;

      let targetX = vp.scrollLeft + dx;
      let targetY = vp.scrollTop  + dy;

      const maxX = Math.max(0, stage.scrollWidth  - vp.clientWidth);
      const maxY = Math.max(0, stage.scrollHeight - vp.clientHeight);

      vp.scrollLeft = clamp(targetX, 0, maxX);
      vp.scrollTop  = clamp(targetY, 0, maxY);
    }

    function hardResetScroll(){
      const vp = document.getElementById("viewport");
      if (!vp) return;
      vp.scrollTo({ left: 0, top: 0, behavior: "auto" });
    }

    function forceCenter(){
      hardResetScroll();
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          centerOnLayout();
          setTimeout(centerOnLayout, 80);
          setTimeout(centerOnLayout, 220);
          setTimeout(centerOnLayout, 520);
        });
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      hardResetScroll();
      requestAnimationFrame(centerOnLayout);
    });

    window.addEventListener("load", forceCenter);
    window.addEventListener("pageshow", () => forceCenter());

    window.addEventListener("orientationchange", () => setTimeout(forceCenter, 250));
    window.addEventListener("resize", () => setTimeout(forceCenter, 140));
  </script>
</body>
</html>
