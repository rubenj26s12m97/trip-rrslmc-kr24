<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Beomeosa Temple – Busan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 260px;
      --photo-h: 180px;
      --gap-x: 72px; /* ✅ más gap */
    }

    html, body{
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;
      overflow: hidden; /* el scroll lo hace .viewport */
    }

    /* Botón volver */
    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 20;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
      -webkit-tap-highlight-color: transparent;
    }

    /* Scroll 2D nativo */
    .viewport{
      position: fixed;
      inset: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      background: #000;
    }

    /* “Mundo” */
    .stage{
      position: relative;
      width: 1500px;
      height: 1000px;

      /* Fondo continuo */
      background:
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
        url("../../img/busan/beomeosa-temple/01.jpg") center 20% / cover no-repeat;
    }

    /* ✅ fila centrada (sobre el fondo), no “a mano” */
    .row{
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      display: flex;
      gap: var(--gap-x);
      align-items: flex-start;
      width: max-content;
    }

    /* Polaroids */
    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.95);
      border-radius: 12px;
      padding: 12px 12px 18px;
      box-shadow: 0 16px 34px rgba(0,0,0,0.4);
      cursor: pointer;
      position: relative;
      user-select: none;
      transform: translateY(var(--lift,0)) rotate(var(--r,0deg));
      transition: transform .16s ease, box-shadow .16s ease;
      -webkit-tap-highlight-color: transparent;
    }

    @media (hover: hover){
      .polaroid:hover{
        transform: translateY(calc(var(--lift,0) - 2px))
                   rotate(var(--r,0deg))
                   scale(1.03);
        box-shadow: 0 20px 44px rgba(0,0,0,0.55);
        z-index: 20;
      }
    }

    /* Chincheta */
    .polaroid::before{
      content:"";
      position:absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .photo{
      margin-top: 10px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 8px;
      overflow: hidden;
      background:#eee;
      transform: rotate(calc(var(--r,0deg) * -1));
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* Offsets (3 fotos) */
    .p1{ --lift:  10px; --r:-2deg; }
    .p2{ --lift:  -6px; --r: 2deg; }
    .p3{ --lift:  14px; --r:-1deg; }

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
    }
    .modal.open{ display:flex; }
    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 14px;
    }

    /* Móvil */
    @media (max-width: 768px){
      :root{
        --polaroid-w: 220px;
        --photo-h: 160px;
        --gap-x: 54px; /* ✅ más gap también en móvil */
      }
      .stage{
        width: 1300px;
        height: 980px;
      }
      .photo{ transform: none; }
      .polaroid{ --lift: 0; }
    }
  </style>
</head>

<body>
  <a class="back" href="../../busan.html">← Volver a Busan</a>

  <div class="viewport" id="viewport">
    <div class="stage" id="stage">
      <div class="row" id="row">
        <div class="polaroid p1" data-src="../../img/busan/beomeosa-temple/03.jpg">
          <div class="photo"><img src="../../img/busan/beomeosa-temple/03.jpg" alt=""></div>
        </div>

        <div class="polaroid p2" data-src="../../img/busan/beomeosa-temple/04.jpg">
          <div class="photo"><img src="../../img/busan/beomeosa-temple/04.jpg" alt=""></div>
        </div>

        <div class="polaroid p3" data-src="../../img/busan/beomeosa-temple/05.jpg">
          <div class="photo"><img src="../../img/busan/beomeosa-temple/05.jpg" alt=""></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="modal">
    <img id="modalImg" alt="">
  </div>

  <script>
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    document.querySelectorAll(".polaroid").forEach(p=>{
      p.addEventListener("click", ()=>{
        modalImg.src = p.dataset.src;
        modal.classList.add("open");
      });
    });

    function closeModal(){
      modal.classList.remove("open");
      modalImg.src = "";
    }

    modal.addEventListener("click", closeModal);

    window.addEventListener("keydown", e=>{
      if(e.key === "Escape") closeModal();
    });

    // ✅ Centrado inicial REAL: centra el bloque de polaroids en el viewport
    window.addEventListener("load", () => {
      const vp = document.getElementById("viewport");
      const stage = document.getElementById("stage");
      const row = document.getElementById("row");

      const rowLeft = row.offsetLeft;
      const rowTop  = row.offsetTop;

      const targetX = rowLeft + row.offsetWidth  / 2 - vp.clientWidth  / 2;
      const targetY = rowTop  + row.offsetHeight / 2 - vp.clientHeight / 2;

      vp.scrollLeft = Math.max(0, Math.min(stage.offsetWidth  - vp.clientWidth,  targetX));
      vp.scrollTop  = Math.max(0, Math.min(stage.offsetHeight - vp.clientHeight, targetY));
    });
  </script>
</body>
</html>
