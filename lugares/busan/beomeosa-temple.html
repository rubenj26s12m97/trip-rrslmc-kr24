<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Beomeosa Temple – Busan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 260px;
      --photo-h: 180px;
      --gap-x: 52px;
    }

    html, body{
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;

      /* ✅ permitir scroll */
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Fondos laterales */
    .bg-left,
    .bg-right{
      position: fixed;
      top: 0;
      bottom: 0;
      width: 50%;
      z-index: 0;
      background-size: cover;
      background-position: center;
      filter: saturate(0.95);
    }

    .bg-left{
      left: 0;
      background-image: url("../../img/busan/beomeosa-temple/01.jpg");
      background-position: center 18%;
    }

    .bg-right{
      right: 0;
      background-image: url("../../img/busan/beomeosa-temple/02.jpg");
      background-position: center 20%;
    }

    /* Velo unificador */
    .shade{
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to right,
        rgba(0,0,0,0.55),
        rgba(0,0,0,0.25) 50%,
        rgba(0,0,0,0.55)
      );
      z-index: 1;
      pointer-events: none;
    }

    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
    }

    /* ✅ ya no fixed: permite crecer y hacer scroll */
    .board{
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 90px 18px 60px;
      box-sizing: border-box;
    }

    .row{
      display: grid;
      grid-template-columns: repeat(3, var(--polaroid-w));
      column-gap: var(--gap-x);
      justify-content: center;
      align-items: start;
    }

    /* Polaroids */
    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.95);
      border-radius: 12px;
      padding: 12px 12px 18px;
      box-shadow: 0 16px 34px rgba(0,0,0,0.4);
      cursor: pointer;
      position: relative;
      user-select: none;
      transform: translateY(var(--lift,0)) rotate(var(--r,0deg));
      transition: transform .16s ease, box-shadow .16s ease;
    }

    @media (hover: hover){
      .polaroid:hover{
        transform: translateY(calc(var(--lift,0) - 2px))
                   rotate(var(--r,0deg))
                   scale(1.03);
        box-shadow: 0 20px 44px rgba(0,0,0,0.55);
        z-index: 20;
      }
    }

    /* Chincheta */
    .polaroid::before{
      content:"";
      position:absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .photo{
      margin-top: 10px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 8px;
      overflow: hidden;
      background:#eee;
      transform: rotate(calc(var(--r,0deg) * -1));
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
    }

    /* Offsets (3 fotos) */
    .p1{ --lift:  10px; --r:-2deg; }
    .p2{ --lift:  -6px; --r: 2deg; }
    .p3{ --lift:  14px; --r:-1deg; }

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
    }
    .modal.open{ display:flex; }
    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 14px;
    }

    /* ✅ móvil: mantener 3 columnas y permitir scroll horizontal */
    @media (max-width: 980px){
      :root{
        --polaroid-w: 220px;
        --photo-h: 160px;
        --gap-x: 22px;
      }

      .row{
        grid-template-columns: repeat(3, var(--polaroid-w));
        column-gap: var(--gap-x);
        justify-content: start;

        overflow-x: auto;
        overflow-y: visible;
        -webkit-overflow-scrolling: touch;
        padding: 0 10px 10px;
        scroll-snap-type: x mandatory;
      }
      .polaroid{ scroll-snap-align: center; --lift:0; }
      .photo{ transform:none; }

      .bg-left,
      .bg-right{
        width: 100%;
        left: 0;
        right: 0;
        opacity: 0.35;
      }
    }
  </style>
</head>

<body>
  <div class="bg-left"></div>
  <div class="bg-right"></div>
  <div class="shade"></div>

  <a class="back" href="../../busan.html">← Volver a Busan</a>

  <main class="board">
    <div class="row">
      <div class="polaroid p1" data-src="../../img/busan/beomeosa-temple/03.jpg">
        <div class="photo"><img src="../../img/busan/beomeosa-temple/03.jpg" alt=""></div>
      </div>

      <div class="polaroid p2" data-src="../../img/busan/beomeosa-temple/04.jpg">
        <div class="photo"><img src="../../img/busan/beomeosa-temple/04.jpg" alt=""></div>
      </div>

      <div class="polaroid p3" data-src="../../img/busan/beomeosa-temple/05.jpg">
        <div class="photo"><img src="../../img/busan/beomeosa-temple/05.jpg" alt=""></div>
      </div>
    </div>
  </main>

  <div class="modal" id="modal">
    <img id="modalImg" alt="">
  </div>

  <script>
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    document.querySelectorAll(".polaroid").forEach(p=>{
      p.addEventListener("click", ()=>{
        modalImg.src = p.dataset.src;
        modal.classList.add("open");
      });
    });

    modal.addEventListener("click", ()=>{
      modal.classList.remove("open");
      modalImg.src = "";
    });

    window.addEventListener("keydown", e=>{
      if(e.key==="Escape"){
        modal.classList.remove("open");
        modalImg.src="";
      }
    });
  </script>
</body>
</html>
