<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Dongbaekseom – Busan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 235px;
      --photo-h: 165px;
      --gap-x: 96px;  /* ✅ más gap entre las 2 de abajo */
      --gap-y: 52px;
    }

    html, body{
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;
      overflow: hidden; /* el scroll lo hace .viewport */
    }

    /* Botón volver */
    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 20;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
      -webkit-tap-highlight-color: transparent;
    }

    /* Scroll 2D nativo */
    .viewport{
      position: fixed;
      inset: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      background: #000;
    }

    /* Mundo más grande que la pantalla */
    .stage{
      position: relative;
      width: 1400px;
      height: 900px;
      background:
        radial-gradient(
          ellipse at center,
          rgba(0,0,0,0.12),
          rgba(0,0,0,0.55)
        ),
        url("../../img/busan/dongbaekseom/01.jpg") center 45% / cover no-repeat;
    }

    /* ✅ Layout centrado REAL sobre el fondo */
    .layout{
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      display: grid;
      grid-template-rows: auto auto;
      row-gap: var(--gap-y);
      justify-items: center;
      width: max-content;
    }

    .row.top{
      display: grid;
      grid-template-columns: var(--polaroid-w);
      justify-content: center;
    }

    .row.bottom{
      display: grid;
      grid-template-columns: repeat(2, var(--polaroid-w));
      column-gap: var(--gap-x);
      justify-content: center;
    }

    /* Polaroids */
    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.96);
      border-radius: 12px;
      padding: 12px 12px 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.35);
      cursor: pointer;
      position: relative;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transform: translateY(var(--lift,0)) rotate(var(--r,0deg));
      transition: transform .16s ease, box-shadow .16s ease;
    }

    @media (hover: hover){
      .polaroid:hover{
        transform: translateY(calc(var(--lift,0) - 2px))
                   rotate(var(--r,0deg))
                   scale(1.03);
        box-shadow: 0 18px 38px rgba(0,0,0,0.45);
        z-index: 20;
      }
    }

    .polaroid::before{
      content:"";
      position:absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .photo{
      margin-top: 10px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 8px;
      overflow: hidden;
      background:#eee;
      transform: rotate(calc(var(--r,0deg) * -1));
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* Offsets */
    .p1{ --lift:  8px;  --r:-2deg; }
    .p2{ --lift: -6px;  --r: 2deg; }
    .p3{ --lift: 10px;  --r:-1deg; }

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
    }
    .modal.open{ display:flex; }
    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 14px;
    }

    /* Móvil */
    @media (max-width: 768px){
      :root{
        --polaroid-w: 200px;
        --photo-h: 145px;
        --gap-x: 72px;
        --gap-y: 34px;
      }
      .stage{
        width: 1200px;
        height: 900px;
      }

      /* ✅ mantener centrado también en móvil (sin top/left fijos) */
      .layout{
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      .photo{ transform: none; }
      .polaroid{ --lift: 0; }
    }
  </style>
</head>

<body>
  <a class="back" href="../../busan.html">← Volver a Busan</a>

  <div class="viewport" id="viewport">
    <div class="stage" id="stage">
      <section class="layout" id="layout">

        <div class="row top">
          <div class="polaroid p1">
            <div class="photo">
              <img src="../../img/busan/dongbaekseom/01.jpg" alt="">
            </div>
          </div>
        </div>

        <div class="row bottom">
          <div class="polaroid p2">
            <div class="photo">
              <img src="../../img/busan/dongbaekseom/02.jpg" alt="">
            </div>
          </div>

          <div class="polaroid p3">
            <div class="photo">
              <img src="../../img/busan/dongbaekseom/03.jpg" alt="">
            </div>
          </div>
        </div>

      </section>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <img id="modalImg" alt="">
  </div>

  <script>
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";

    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    document.querySelectorAll(".polaroid").forEach(p => {
      p.addEventListener("click", () => {
        const img = p.querySelector("img");
        modalImg.src = img.src;
        modal.classList.add("open");
      });
    });

    function closeModal(){
      modal.classList.remove("open");
      modalImg.src = "";
    }

    modal.addEventListener("click", closeModal);

    window.addEventListener("keydown", e => {
      if (e.key === "Escape") closeModal();
    });

    function clamp(v, min, max){ return Math.min(Math.max(v, min), max); }

    function centerOnLayout(){
      const vp = document.getElementById("viewport");
      const stage = document.getElementById("stage");
      const layout = document.getElementById("layout");

      vp.scrollTo(0, 0);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const layoutCenterX = layout.offsetLeft + layout.offsetWidth / 2;
          const layoutCenterY = layout.offsetTop  + layout.offsetHeight / 2;

          const targetX = layoutCenterX - vp.clientWidth / 2;
          const targetY = layoutCenterY - vp.clientHeight / 2;

          const maxX = stage.offsetWidth  - vp.clientWidth;
          const maxY = stage.offsetHeight - vp.clientHeight;

          vp.scrollLeft = clamp(targetX, 0, Math.max(0, maxX));
          vp.scrollTop  = clamp(targetY, 0, Math.max(0, maxY));
        });
      });
    }

    window.addEventListener("load", centerOnLayout);
  </script>
</body>
</html>
