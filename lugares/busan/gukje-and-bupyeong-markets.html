<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Gukje & Bupyeong Markets – Busan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 210px;
      --photo-h: 150px;

      /* ✅ más aire real */
      --gap-x: 78px;
      --center-y: 18px;
    }

    html, body{
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;
      overflow: hidden;
    }

    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 20;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
      -webkit-tap-highlight-color: transparent;
    }

    .viewport{
      position: fixed;
      inset: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      background: #000;
      overflow-anchor: none;
      scroll-behavior: auto;
    }

    .stage{
      position: relative;
      width: 1500px;
      height: 950px;
      overflow: visible;
      background:
        radial-gradient(
          ellipse at center,
          rgba(0,0,0,0.15),
          rgba(0,0,0,0.70)
        ),
        url("../../img/busan/gukje-and-bupyeong-markets/01.jpg") center / cover no-repeat;
    }

    .row{
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, calc(-50% + var(--center-y)));

      display: grid;
      grid-template-columns: repeat(4, var(--polaroid-w));
      column-gap: var(--gap-x);
      justify-content: center;
      align-items: start;
      width: max-content;

      /* ✅ CLAVE: nunca scroll aquí */
      overflow: visible;
    }

    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.95);
      border-radius: 12px;
      padding: 12px 12px 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.35);
      cursor: pointer;
      position: relative;
      user-select: none;
      -webkit-tap-highlight-color: transparent;

      /* ✅ desorden controlado */
      transform:
        translateX(var(--tx,0))
        translateY(var(--ty,0))
        rotate(var(--r,0deg));

      transition: transform .16s ease, box-shadow .16s ease;
    }

    @media (hover: hover){
      .polaroid:hover{
        transform:
          translateX(var(--tx,0))
          translateY(calc(var(--ty,0) - 4px))
          rotate(var(--r,0deg))
          scale(1.04);
        box-shadow: 0 18px 38px rgba(0,0,0,0.45);
        z-index: 20;
      }
    }

    .polaroid::before{
      content:"";
      position:absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .photo{
      margin-top: 10px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 8px;
      overflow: hidden;
      background:#eee;
      transform: rotate(calc(var(--r,0deg) * -1));
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* offsets suaves (sin caos) */
    .p1{ --r:-2.2deg; --tx:-8px;  --ty: 10px; }
    .p2{ --r: 1.6deg; --tx: 6px;  --ty:-8px; }
    .p3{ --r:-1.2deg; --tx: 10px; --ty: 14px; }
    .p4{ --r: 2.0deg; --tx:-6px;  --ty:-6px; }

    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
    }
    .modal.open{ display:flex; }
    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 14px;
    }

    /* ✅ móvil: MISMO PATRÓN (solo scroll global) */
    @media (max-width: 980px){
      :root{
        --polaroid-w: 175px;
        --photo-h: 132px;
        --gap-x: 52px;
        --center-y: 14px;
      }

      .stage{
        width: 1200px;
        height: 900px;
      }

      /* calmamos el collage en móvil */
      .polaroid{ --tx:0; --ty:0; --r:0deg; }
      .photo{ transform:none; }
    }
  </style>
</head>

<body>
  <a class="back" href="../../busan.html">← Volver a Busan</a>

  <div class="viewport" id="viewport">
    <div class="stage" id="stage">
      <div class="row" id="row">
        <div class="polaroid p1" data-src="../../img/busan/gukje-and-bupyeong-markets/01.jpg">
          <div class="photo"><img src="../../img/busan/gukje-and-bupyeong-markets/01.jpg" alt=""></div>
        </div>

        <div class="polaroid p2" data-src="../../img/busan/gukje-and-bupyeong-markets/02.jpg">
          <div class="photo"><img src="../../img/busan/gukje-and-bupyeong-markets/02.jpg" alt=""></div>
        </div>

        <div class="polaroid p3" data-src="../../img/busan/gukje-and-bupyeong-markets/03.jpg">
          <div class="photo"><img src="../../img/busan/gukje-and-bupyeong-markets/03.jpg" alt=""></div>
        </div>

        <div class="polaroid p4" data-src="../../img/busan/gukje-and-bupyeong-markets/04.jpg">
          <div class="photo"><img src="../../img/busan/gukje-and-bupyeong-markets/04.jpg" alt=""></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="modal">
    <img id="modalImg" alt="">
  </div>

  <script>
    // ---------- Modal ----------
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    document.querySelectorAll(".polaroid").forEach(p=>{
      p.addEventListener("click", ()=>{
        modalImg.src = p.dataset.src;
        modal.classList.add("open");
      });
    });

    function closeModal(){
      modal.classList.remove("open");
      modalImg.src = "";
    }

    modal.addEventListener("click", closeModal);
    window.addEventListener("keydown", e=>{
      if(e.key === "Escape") closeModal();
    });

    // ---------- FIX: entrar centrado ----------
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";

    function clamp(v, min, max){ return Math.min(Math.max(v, min), max); }

    function centerOnRow(){
      const vp = document.getElementById("viewport");
      const stage = document.getElementById("stage");
      const row = document.getElementById("row");
      if (!vp || !stage || !row) return;

      const vpRect = vp.getBoundingClientRect();
      const rowRect = row.getBoundingClientRect();

      const rowCx = rowRect.left + rowRect.width / 2;
      const rowCy = rowRect.top  + rowRect.height / 2;

      const vpCx = vpRect.left + vpRect.width / 2;
      const vpCy = vpRect.top  + vpRect.height / 2;

      const dx = rowCx - vpCx;
      const dy = rowCy - vpCy;

      let targetX = vp.scrollLeft + dx;
      let targetY = vp.scrollTop  + dy;

      const maxX = Math.max(0, stage.scrollWidth  - vp.clientWidth);
      const maxY = Math.max(0, stage.scrollHeight - vp.clientHeight);

      vp.scrollLeft = clamp(targetX, 0, maxX);
      vp.scrollTop  = clamp(targetY, 0, maxY);
    }

    function hardResetScroll(){
      const vp = document.getElementById("viewport");
      if (!vp) return;
      vp.scrollTo({ left: 0, top: 0, behavior: "auto" });
    }

    function forceCenter(){
      hardResetScroll();
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          centerOnRow();
          setTimeout(centerOnRow, 80);
          setTimeout(centerOnRow, 220);
          setTimeout(centerOnRow, 520);
        });
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      hardResetScroll();
      requestAnimationFrame(centerOnRow);
    });

    window.addEventListener("load", forceCenter);
    window.addEventListener("pageshow", () => forceCenter());

    window.addEventListener("orientationchange", () => setTimeout(forceCenter, 250));
    window.addEventListener("resize", () => setTimeout(forceCenter, 140));
  </script>
</body>
</html>
