<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Gamcheon Culture Village – Busan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 220px;
      --photo-h: 155px;

      /* ✅ más aire real */
      --gap-x: 82px;
      --gap-y: 78px;

      --center-y: 20px;
    }

    html, body{
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;
      overflow: hidden;
    }

    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 20;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
    }

    .viewport{
      position: fixed;
      inset: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      overflow-anchor: none;
    }

    .stage{
      position: relative;
      width: 1500px;
      height: 980px;
      overflow: visible;
      background:
        radial-gradient(
          ellipse at center,
          rgba(0,0,0,0.15),
          rgba(0,0,0,0.72)
        ),
        url("../../img/busan/gamcheon-culture-village/01.jpg")
        center 45% / cover no-repeat;
    }

    .layout{
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, calc(-50% + var(--center-y)));

      display: grid;
      grid-template-rows: auto auto;
      row-gap: var(--gap-y);
      justify-items: center;
      width: max-content;
    }

    .row{
      display: grid;
      grid-template-columns: repeat(3, var(--polaroid-w));
      column-gap: var(--gap-x);
      width: max-content;
    }

    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.95);
      border-radius: 12px;
      padding: 12px 12px 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.35);
      cursor: pointer;
      position: relative;
      user-select: none;

      /* ✅ desorden controlado */
      transform:
        translateX(var(--tx,0))
        translateY(var(--ty,0))
        rotate(var(--r,0deg));

      transition: transform .18s ease, box-shadow .18s ease;
    }

    @media (hover:hover){
      .polaroid:hover{
        transform:
          translateX(var(--tx,0))
          translateY(calc(var(--ty,0) - 4px))
          rotate(var(--r,0deg))
          scale(1.04);
        box-shadow: 0 20px 42px rgba(0,0,0,0.45);
        z-index: 20;
      }
    }

    .polaroid::before{
      content:"";
      position:absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .photo{
      margin-top: 10px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 8px;
      overflow: hidden;
      background:#eee;
      transform: rotate(calc(var(--r,0deg) * -1));
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
      pointer-events: none;
    }

    /* ---------- offsets individuales ---------- */
    .p1{ --r:-2.5deg; --tx:-6px;  --ty: 10px; }
    .p2{ --r: 1.8deg; --tx: 4px;  --ty:-6px; }
    .p3{ --r:-1.2deg; --tx: 8px;  --ty: 14px; }

    .p4{ --r: 2.2deg; --tx:-10px; --ty:-4px; }
    .p5{ --r:-1.6deg; --tx: 6px;  --ty: 8px; }
    .p6{ --r: 1.4deg; --tx:-4px;  --ty:-10px; }

    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
    }
    .modal.open{ display:flex; }
    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      border-radius: 14px;
    }

    /* ---------- móvil: mismo patrón, menos ruido ---------- */
    @media (max-width: 980px){
      :root{
        --polaroid-w: 185px;
        --photo-h: 135px;
        --gap-x: 56px;
        --gap-y: 48px;
        --center-y: 10px;
      }

      .stage{
        width: 1200px;
        height: 900px;
      }

      .polaroid{
        --tx: 0;
        --ty: 0;
        --r: 0deg;
      }
      .photo{ transform:none; }
    }
  </style>
</head>

<body>
<a class="back" href="../../busan.html">← Volver a Busan</a>

<div class="viewport" id="viewport">
  <div class="stage" id="stage">
    <section class="layout" id="layout">

      <div class="row">
        <div class="polaroid p1" data-src="../../img/busan/gamcheon-culture-village/02.jpg">
          <div class="photo"><img src="../../img/busan/gamcheon-culture-village/02.jpg"></div>
        </div>
        <div class="polaroid p2" data-src="../../img/busan/gamcheon-culture-village/03.jpg">
          <div class="photo"><img src="../../img/busan/gamcheon-culture-village/03.jpg"></div>
        </div>
        <div class="polaroid p3" data-src="../../img/busan/gamcheon-culture-village/04.jpg">
          <div class="photo"><img src="../../img/busan/gamcheon-culture-village/04.jpg"></div>
        </div>
      </div>

      <div class="row">
        <div class="polaroid p4" data-src="../../img/busan/gamcheon-culture-village/05.jpg">
          <div class="photo"><img src="../../img/busan/gamcheon-culture-village/05.jpg"></div>
        </div>
        <div class="polaroid p5" data-src="../../img/busan/gamcheon-culture-village/06.jpg">
          <div class="photo"><img src="../../img/busan/gamcheon-culture-village/06.jpg"></div>
        </div>
        <div class="polaroid p6" data-src="../../img/busan/gamcheon-culture-village/07.jpg">
          <div class="photo"><img src="../../img/busan/gamcheon-culture-village/07.jpg"></div>
        </div>
      </div>

    </section>
  </div>
</div>

<div class="modal" id="modal">
  <img id="modalImg">
</div>

<script>
  const modal = document.getElementById("modal");
  const modalImg = document.getElementById("modalImg");

  document.querySelectorAll(".polaroid").forEach(p=>{
    p.addEventListener("click", ()=>{
      modalImg.src = p.dataset.src;
      modal.classList.add("open");
    });
  });

  modal.addEventListener("click", ()=>{
    modal.classList.remove("open");
    modalImg.src = "";
  });

  if ("scrollRestoration" in history) history.scrollRestoration = "manual";

  function clamp(v,min,max){ return Math.min(Math.max(v,min),max); }

  function centerOnLayout(){
    const vp = viewport;
    const stage = document.getElementById("stage");
    const layout = document.getElementById("layout");

    const vpR = vp.getBoundingClientRect();
    const lR  = layout.getBoundingClientRect();

    const dx = (lR.left + lR.width/2)  - (vpR.left + vpR.width/2);
    const dy = (lR.top  + lR.height/2) - (vpR.top  + vpR.height/2);

    vp.scrollLeft = clamp(vp.scrollLeft + dx, 0, stage.scrollWidth  - vp.clientWidth);
    vp.scrollTop  = clamp(vp.scrollTop  + dy, 0, stage.scrollHeight - vp.clientHeight);
  }

  function forceCenter(){
    viewport.scrollTo({left:0, top:0, behavior:"auto"});
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        centerOnLayout();
        setTimeout(centerOnLayout,80);
        setTimeout(centerOnLayout,220);
        setTimeout(centerOnLayout,520);
      });
    });
  }

  window.addEventListener("load", forceCenter);
  window.addEventListener("resize", ()=>setTimeout(forceCenter,140));
  window.addEventListener("orientationchange", ()=>setTimeout(forceCenter,250));
</script>
</body>
</html>
