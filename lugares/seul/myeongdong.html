<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Myeongdong – Seúl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 250px;
      --photo-h: 175px;

      /* ✅ más aire entre polaroids (antes 56) */
      --gap-x: 70px;

      /* ✅ ajuste fino arriba/abajo del bloque */
      --center-y: 0px;
    }

    html, body{
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;

      /* ✅ patrón C: fondo fijo + contenido centrado */
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;

      overflow-anchor: none;
      scroll-behavior: auto;
    }

    /* ✅ Fondo fijo (NO se mueve) */
    .bg{
      position: fixed;
      inset: 0;
      background: url("../../img/seul/myeongdong/01.webp") center 78% / cover no-repeat;
      z-index: 0;
    }

    /* Velo */
    .shade{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.34);
      z-index: 1;
      pointer-events: none;
    }

    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
      -webkit-tap-highlight-color: transparent;
    }

    /* ✅ Contenido centrado (sin entrar por esquina) */
    .board{
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 95px 18px 70px;
      box-sizing: border-box;
    }

    .row{
      display: grid;
      grid-template-columns: repeat(2, var(--polaroid-w));
      column-gap: var(--gap-x);
      justify-content: center;
      align-items: start;
      width: max-content;

      transform: translateY(var(--center-y));
    }

    /* Polaroids */
    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.95);
      border-radius: 14px;
      padding: 14px 14px 20px;
      box-shadow: 0 18px 36px rgba(0,0,0,0.45);
      cursor: pointer;
      position: relative;
      user-select: none;
      -webkit-tap-highlight-color: transparent;

      transform: translateY(var(--lift,0)) rotate(var(--r, 0deg));
      transition: transform .16s ease, box-shadow .16s ease;
      will-change: transform;
    }

    @media (hover: hover){
      .polaroid:hover{
        transform: translateY(calc(var(--lift,0) - 2px))
                   rotate(var(--r,0deg))
                   scale(1.03);
        box-shadow: 0 24px 48px rgba(0,0,0,0.6);
        z-index: 20;
      }
    }

    .polaroid::before{
      content:"";
      position:absolute;
      top: 9px;
      left: 50%;
      transform: translateX(-50%);
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    /* 🔑 Foto des-rotada para evitar blur */
    .photo{
      margin-top: 12px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 10px;
      overflow: hidden;
      background:#eee;
      transform: rotate(calc(var(--r,0deg) * -1));
      transform-origin: center;
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* Rotaciones + micro lift (2) */
    .p1{ --r:-2deg; --lift: 8px; }
    .p2{ --r: 2deg; --lift:-6px; }

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.90);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
      box-sizing: border-box;
      isolation: isolate;
    }
    .modal.open{ display:flex; }
    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 16px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.55);
      filter: none !important;
      mix-blend-mode: normal !important;
    }

    /* ✅ móvil: mantener 2 columnas y permitir scroll horizontal SOLO de la fila */
    @media (max-width: 980px){
      :root{
        --polaroid-w: 210px;
        --photo-h: 150px;

        /* un pelín menos en móvil para que no se haga eterno el swipe */
        --gap-x: 26px;
        --center-y: 0px;
      }

      .board{ padding-top: 78px; }

      .row{
        justify-content: start;

        overflow-x: auto;
        overflow-y: visible;
        -webkit-overflow-scrolling: touch;
        padding: 0 10px 10px;
        scroll-snap-type: x mandatory;

        width: min(100%, 96vw);
        box-sizing: border-box;
      }

      .polaroid{ scroll-snap-align: center; --lift:0; --r:0deg; }
      .photo{ transform:none; }
    }

    @media (max-width: 520px){
      :root{
        --polaroid-w: 190px;
        --photo-h: 135px;
        --gap-x: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="bg"></div>
  <div class="shade"></div>

  <a class="back" href="../../seul.html">← Volver a Seúl</a>

  <main class="board">
    <div class="row" aria-label="Fotos Myeongdong">
      <div class="polaroid p1" data-src="../../img/seul/myeongdong/01.webp">
        <div class="photo">
          <img src="../../img/seul/myeongdong/01.webp" alt="Myeongdong 01">
        </div>
      </div>

      <div class="polaroid p2" data-src="../../img/seul/myeongdong/02.jpg">
        <div class="photo">
          <img src="../../img/seul/myeongdong/02.jpg" alt="Myeongdong 02">
        </div>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal" id="modal" aria-hidden="true">
    <img id="modalImg" alt="">
  </div>

  <script>
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    function openModal(src){
      modalImg.src = src;
      modal.classList.add("open");
      modal.setAttribute("aria-hidden","false");
    }
    function closeModal(){
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden","true");
      modalImg.src = "";
    }

    document.querySelectorAll(".polaroid").forEach(card => {
      card.addEventListener("click", () => {
        const src = card.dataset.src || card.querySelector("img")?.src;
        if (src) openModal(src);
      });
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    window.addEventListener("keydown", e => {
      if (e.key === "Escape") closeModal();
    });
  </script>
</body>
</html>
