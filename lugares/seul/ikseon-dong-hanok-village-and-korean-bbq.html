<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ikseon-dong Hanok Village & Korean BBQ – Seúl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 255px;
      --photo-h: 175px;

      --gap-x: 70px;
      --gap-y: 54px;
      --center-y: 0px;
    }

    html, body{
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;
      overflow: hidden; /* ✅ scroll en .viewport (X + Y) */
    }

    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 30;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
      -webkit-tap-highlight-color: transparent;
    }

    /* ✅ Scroll del lienzo completo (fondos + polaroids) */
    .viewport{
      position: fixed;
      inset: 0;
      overflow: auto;                 /* ✅ vertical + horizontal */
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      background: #000;

      overflow-anchor: none;
      scroll-behavior: auto;
    }

    /* ✅ Stage grande para poder “pasear” por el fondo en móvil */
    .stage{
      position: relative;
      width: 1400px;
      height: 900px;

      /* ✅ 2 fondos al 50% (se mantiene) */
      background:
        url("../../img/seul/ikseon-dong-hanok-village-and-korean-bbq/01.jpg"),
        url("../../img/seul/ikseon-dong-hanok-village-and-korean-bbq/02.jpg");
      background-repeat: no-repeat, no-repeat;
      background-size: 50% 100%, 50% 100%;
      background-position: left center, right center;
    }

    /* ✅ Velo encima de ambos fondos */
    .shade{
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to right,
        rgba(0,0,0,0.64),
        rgba(0,0,0,0.28) 50%,
        rgba(0,0,0,0.64)
      );
      pointer-events: none;
      z-index: 1;
    }

    /* ✅ Bloque centrado dentro del stage */
    .grid{
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, calc(-50% + var(--center-y)));

      display: grid;
      grid-template-columns: auto auto;
      column-gap: var(--gap-x);
      align-items: center;
      width: max-content;
      box-sizing: border-box;
      z-index: 2;
    }

    .col{
      display: grid;
      justify-items: center;
      width: max-content;
    }

    .col.right{
      grid-auto-rows: auto;
      row-gap: var(--gap-y);
    }

    /* Polaroid */
    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.95);
      border-radius: 14px;
      padding: 14px 14px 20px;
      box-shadow: 0 18px 36px rgba(0,0,0,0.45);
      cursor: pointer;
      position: relative;
      user-select: none;
      -webkit-tap-highlight-color: transparent;

      transform: translateY(var(--lift,0)) rotate(var(--r,0deg));
      transition: transform .16s ease, box-shadow .16s ease;
      will-change: transform;
    }

    @media (hover:hover){
      .polaroid:hover{
        transform: translateY(calc(var(--lift,0) - 2px))
                   rotate(var(--r,0deg))
                   scale(1.03);
        box-shadow: 0 24px 48px rgba(0,0,0,0.60);
        z-index: 20;
      }
    }

    .polaroid::before{
      content:"";
      position:absolute;
      top: 9px;
      left: 50%;
      transform: translateX(-50%);
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .photo{
      margin-top: 12px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 10px;
      overflow: hidden;
      background:#eee;

      /* ✅ anti-blur: des-rotamos la foto */
      transform: rotate(calc(var(--r,0deg) * -1));
      transform-origin: center;
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* Offsets */
    .p3{ --lift: 10px; --r:-2deg; }  /* 03 (izq) */
    .p4{ --lift: -6px; --r:  2deg; } /* 04 (der arriba) */
    .p5{ --lift:  8px; --r: -1deg; } /* 05 (der abajo) */

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.90);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
      box-sizing: border-box;
      isolation: isolate;
    }
    .modal.open{ display:flex; }
    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 16px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.55);
      filter: none !important;
      mix-blend-mode: normal !important;
    }

    /* ✅ móvil: NO scroll interno / NO reflow obligatorio.
       Si quieres 1 columna en móvil, podemos hacerlo, pero entonces
       vuelves a necesitar scroll vertical; con este patrón ya lo tienes
       a nivel de viewport, que es lo que pedías. */
    @media (max-width: 980px){
      :root{
        --polaroid-w: 220px;
        --photo-h: 155px;
        --gap-x: 44px;
        --gap-y: 34px;
        --center-y: 0px;
      }

      .stage{
        width: 1200px;
        height: 900px;
      }

      /* en móvil quitamos inclinación */
      .polaroid{ --lift:0; --r:0deg; }
      .photo{ transform:none; }
    }

    @media (max-width: 520px){
      :root{
        --polaroid-w: 205px;
        --photo-h: 145px;
        --gap-x: 36px;
        --gap-y: 28px;
      }

      .stage{
        width: 1100px;
        height: 900px;
      }
    }
  </style>
</head>

<body>
  <a class="back" href="../../seul.html">← Volver a Seúl</a>

  <div class="viewport" id="viewport">
    <div class="stage" id="stage">
      <div class="shade"></div>

      <section class="grid" id="grid" aria-label="Fotos Ikseon-dong">
        <!-- Izquierda -->
        <div class="col left">
          <div class="polaroid p3" data-src="../../img/seul/ikseon-dong-hanok-village-and-korean-bbq/03.jpg">
            <div class="photo">
              <img src="../../img/seul/ikseon-dong-hanok-village-and-korean-bbq/03.jpg" alt="">
            </div>
          </div>
        </div>

        <!-- Derecha -->
        <div class="col right">
          <div class="polaroid p4" data-src="../../img/seul/ikseon-dong-hanok-village-and-korean-bbq/04.jpg">
            <div class="photo">
              <img src="../../img/seul/ikseon-dong-hanok-village-and-korean-bbq/04.jpg"
                   alt=""
                   style="object-position: center 20%;">
            </div>
          </div>

          <div class="polaroid p5" data-src="../../img/seul/ikseon-dong-hanok-village-and-korean-bbq/05.jpg">
            <div class="photo">
              <img src="../../img/seul/ikseon-dong-hanok-village-and-korean-bbq/05.jpg" alt="">
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal" id="modal" aria-hidden="true">
    <img id="modalImg" alt="">
  </div>

  <script>
    // ---------- Modal ----------
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    function openModal(src){
      modalImg.src = src;
      modal.classList.add("open");
      modal.setAttribute("aria-hidden","false");
    }
    function closeModal(){
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden","true");
      modalImg.src = "";
    }

    document.querySelectorAll(".polaroid").forEach(p => {
      p.addEventListener("click", () => {
        const src = p.dataset.src || p.querySelector("img")?.src;
        if (src) openModal(src);
      });
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    window.addEventListener("keydown", e => {
      if (e.key === "Escape") closeModal();
    });

    // ---------- FIX: entrar centrado ----------
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";

    function clamp(v, min, max){ return Math.min(Math.max(v, min), max); }

    function centerOnGrid(){
      const vp = document.getElementById("viewport");
      const stage = document.getElementById("stage");
      const grid = document.getElementById("grid");
      if (!vp || !stage || !grid) return;

      const vpRect = vp.getBoundingClientRect();
      const gridRect = grid.getBoundingClientRect();

      const gridCx = gridRect.left + gridRect.width / 2;
      const gridCy = gridRect.top  + gridRect.height / 2;

      const vpCx = vpRect.left + vpRect.width / 2;
      const vpCy = vpRect.top  + vpRect.height / 2;

      const dx = gridCx - vpCx;
      const dy = gridCy - vpCy;

      let targetX = vp.scrollLeft + dx;
      let targetY = vp.scrollTop  + dy;

      const maxX = Math.max(0, stage.scrollWidth  - vp.clientWidth);
      const maxY = Math.max(0, stage.scrollHeight - vp.clientHeight);

      vp.scrollLeft = clamp(targetX, 0, maxX);
      vp.scrollTop  = clamp(targetY, 0, maxY);
    }

    function hardResetScroll(){
      const vp = document.getElementById("viewport");
      if (!vp) return;
      vp.scrollTo({ left: 0, top: 0, behavior: "auto" });
    }

    function forceCenter(){
      hardResetScroll();
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          centerOnGrid();
          setTimeout(centerOnGrid, 80);
          setTimeout(centerOnGrid, 220);
          setTimeout(centerOnGrid, 520);
        });
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      hardResetScroll();
      requestAnimationFrame(centerOnGrid);
    });

    window.addEventListener("load", forceCenter);
    window.addEventListener("pageshow", () => forceCenter());
    window.addEventListener("orientationchange", () => setTimeout(forceCenter, 250));
    window.addEventListener("resize", () => setTimeout(forceCenter, 140));
  </script>
</body>
</html>
