<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ikseon-dong Hanok Village & Korean BBQ – Seúl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 255px;
      --photo-h: 175px;
      --gap-y: 44px;
    }

    html, body{
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;
      overflow: hidden;
    }

    /* Fondos laterales */
    .bg-left,
    .bg-right{
      position: fixed;
      top: 0;
      bottom: 0;
      width: 50%;
      z-index: 0;
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center 45%;
    }

    .bg-left{
      left: 0;
      background-image: url("../../img/seul/ikseon-dong-hanok-village-and-korean-bbq/01.jpg");
    }

    .bg-right{
      right: 0;
      background-image: url("../../img/seul/ikseon-dong-hanok-village-and-korean-bbq/02.jpg");
    }

    /* Velo */
    .shade{
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to right,
        rgba(0,0,0,0.62),
        rgba(0,0,0,0.30) 50%,
        rgba(0,0,0,0.62)
      );
      z-index: 1;
    }

    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
    }

    /* Contenedor principal */
    .board{
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: 50% 50%;
      align-items: center;
      padding-top: 90px;
      box-sizing: border-box;
    }

    /* Cada mitad ocupa SU fondo */
    .half{
      height: 100%;
      display: grid;
      place-items: center;
    }

    .right{
      grid-template-rows: auto auto;
      row-gap: var(--gap-y);
    }

    /* Polaroid */
    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.95);
      border-radius: 14px;
      padding: 14px 14px 20px;
      box-shadow: 0 18px 36px rgba(0,0,0,0.45);
      cursor: pointer;
      position: relative;
      user-select: none;
      transform: translateY(var(--lift,0)) rotate(var(--r,0deg));
      transition: transform .16s ease, box-shadow .16s ease;
    }

    .polaroid:hover{
      transform: translateY(calc(var(--lift,0) - 2px))
                 rotate(var(--r,0deg))
                 scale(1.03);
      box-shadow: 0 24px 48px rgba(0,0,0,0.6);
      z-index: 20;
    }

    .polaroid::before{
      content:"";
      position:absolute;
      top: 9px;
      left: 50%;
      transform: translateX(-50%);
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .photo{
      margin-top: 12px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 10px;
      overflow: hidden;
      background:#eee;
      transform: rotate(calc(var(--r,0deg) * -1));
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
    }

    /* Offsets */
    .p3{ --lift:  10px; --r:-2deg; }
    .p4{ --lift:  -6px; --r: 2deg; }
    .p5{ --lift:   8px; --r:-1deg; }

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
    }
    .modal.open{ display:flex; }
    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 16px;
    }

    /* Móvil */
    @media (max-width: 980px){
      html, body{ overflow-y: auto; }

      .board{
        position: relative;
        grid-template-columns: 1fr;
        row-gap: 36px;
        padding: 90px 18px 60px;
      }

      .half{
        height: auto;
      }

      :root{
        --polaroid-w: 220px;
        --photo-h: 155px;
        --gap-y: 28px;
      }

      .polaroid{ --lift:0; --r:0deg; }
      .photo{ transform:none; }

      .bg-left, .bg-right{
        width: 100%;
        left: 0;
        right: 0;
        opacity: 0.35;
      }
    }
  </style>
</head>

<body>
  <div class="bg-left"></div>
  <div class="bg-right"></div>
  <div class="shade"></div>

  <a class="back" href="../../seul.html">← Volver a Seúl</a>

  <main class="board">
    <!-- Mitad izquierda → fondo 01 -->
    <div class="half left">
      <div class="polaroid p3">
        <div class="photo">
          <img src="../../img/seul/ikseon-dong-hanok-village-and-korean-bbq/03.jpg">
        </div>
      </div>
    </div>

    <!-- Mitad derecha → fondo 02 -->
    <div class="half right">
      <div class="polaroid p4">
  <div class="photo">
    <img src="../../img/seul/ikseon-dong-hanok-village-and-korean-bbq/04.jpg"
         style="object-position: center 20%;">
  </div>
</div>

      <div class="polaroid p5">
        <div class="photo">
          <img src="../../img/seul/ikseon-dong-hanok-village-and-korean-bbq/05.jpg">
        </div>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal" id="modal">
    <img id="modalImg">
  </div>

  <script>
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    document.querySelectorAll(".polaroid").forEach(p => {
      p.addEventListener("click", () => {
        const img = p.querySelector("img");
        modalImg.src = img.src;
        modal.classList.add("open");
      });
    });

    modal.addEventListener("click", () => {
      modal.classList.remove("open");
      modalImg.src = "";
    });

    window.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        modal.classList.remove("open");
        modalImg.src = "";
      }
    });
  </script>
</body>
</html>
