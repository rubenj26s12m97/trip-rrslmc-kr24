<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ikseon-dong Hanok Village & Korean BBQ – Seúl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 255px;
      --photo-h: 175px;

      --gap-x: 70px;   /* separación entre columnas (izq/der) */
      --gap-y: 54px;   /* separación vertical en la columna derecha */
      --center-y: 0px; /* ajuste fino arriba/abajo del bloque */
    }

    html, body{
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;

      /* ✅ patrón C: fondos fijos + contenido centrado */
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;

      overflow-anchor: none;
      scroll-behavior: auto;
    }

    /* ✅ Fondos laterales fijos */
    .bg-left,
    .bg-right{
      position: fixed;
      top: 0;
      bottom: 0;
      width: 50%;
      z-index: 0;
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center 45%;
    }

    .bg-left{
      left: 0;
      background-image: url("../../img/seul/ikseon-dong-hanok-village-and-korean-bbq/01.jpg");
    }

    .bg-right{
      right: 0;
      background-image: url("../../img/seul/ikseon-dong-hanok-village-and-korean-bbq/02.jpg");
    }

    /* Velo */
    .shade{
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to right,
        rgba(0,0,0,0.64),
        rgba(0,0,0,0.28) 50%,
        rgba(0,0,0,0.64)
      );
      z-index: 1;
      pointer-events: none;
    }

    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
      -webkit-tap-highlight-color: transparent;
    }

    /* ✅ Contenido centrado (sin “entrar por esquina”) */
    .board{
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 95px 18px 70px;
      box-sizing: border-box;
    }

    /* Dos columnas */
    .grid{
      transform: translateY(var(--center-y));
      display: grid;
      grid-template-columns: auto auto;
      column-gap: var(--gap-x);
      align-items: center;
      width: max-content;
      max-width: 100%;
      box-sizing: border-box;
    }

    .col{
      display: grid;
      justify-items: center;
      width: max-content;
    }

    .col.right{
      grid-auto-rows: auto;
      row-gap: var(--gap-y);
    }

    /* Polaroid */
    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.95);
      border-radius: 14px;
      padding: 14px 14px 20px;
      box-shadow: 0 18px 36px rgba(0,0,0,0.45);
      cursor: pointer;
      position: relative;
      user-select: none;
      -webkit-tap-highlight-color: transparent;

      transform: translateY(var(--lift,0)) rotate(var(--r,0deg));
      transition: transform .16s ease, box-shadow .16s ease;
      will-change: transform;
    }

    @media (hover:hover){
      .polaroid:hover{
        transform: translateY(calc(var(--lift,0) - 2px))
                   rotate(var(--r,0deg))
                   scale(1.03);
        box-shadow: 0 24px 48px rgba(0,0,0,0.60);
        z-index: 20;
      }
    }

    .polaroid::before{
      content:"";
      position:absolute;
      top: 9px;
      left: 50%;
      transform: translateX(-50%);
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .photo{
      margin-top: 12px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 10px;
      overflow: hidden;
      background:#eee;

      /* ✅ anti-blur: des-rotamos la foto */
      transform: rotate(calc(var(--r,0deg) * -1));
      transform-origin: center;
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* Offsets (como el modelo, pero con un pelín de aire extra ya por gaps) */
    .p3{ --lift: 10px; --r:-2deg; } /* 03 (izq) */
    .p4{ --lift: -6px; --r:  2deg; } /* 04 (der arriba) */
    .p5{ --lift:  8px; --r: -1deg; } /* 05 (der abajo) */

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.90);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
      box-sizing: border-box;
      isolation: isolate;
    }
    .modal.open{ display:flex; }
    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 16px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.55);
      filter: none !important;
      mix-blend-mode: normal !important;
    }

    /* ✅ móvil: una columna, mantiene fondos fijos */
    @media (max-width: 980px){
      :root{
        --polaroid-w: 220px;
        --photo-h: 155px;
        --gap-x: 0px;
        --gap-y: 30px;
        --center-y: 0px;
      }

      .board{ padding-top: 86px; }

      .grid{
        grid-template-columns: 1fr;
        row-gap: 34px;
        width: 100%;
        justify-items: center;
      }

      .col{
        width: 100%;
        justify-items: center;
      }

      .polaroid{ --lift:0; --r:0deg; }
      .photo{ transform:none; }
    }

    @media (max-width: 520px){
      :root{
        --polaroid-w: 205px;
        --photo-h: 145px;
        --gap-y: 26px;
      }
      .board{ padding-top: 78px; }
    }
  </style>
</head>

<body>
  <div class="bg-left"></div>
  <div class="bg-right"></div>
  <div class="shade"></div>

  <a class="back" href="../../seul.html">← Volver a Seúl</a>

  <main class="board">
    <section class="grid" aria-label="Fotos Ikseon-dong">
      <!-- Izquierda -->
      <div class="col left">
        <div class="polaroid p3" data-src="../../img/seul/ikseon-dong-hanok-village-and-korean-bbq/03.jpg">
          <div class="photo">
            <img src="../../img/seul/ikseon-dong-hanok-village-and-korean-bbq/03.jpg" alt="">
          </div>
        </div>
      </div>

      <!-- Derecha -->
      <div class="col right">
        <div class="polaroid p4" data-src="../../img/seul/ikseon-dong-hanok-village-and-korean-bbq/04.jpg">
          <div class="photo">
            <img src="../../img/seul/ikseon-dong-hanok-village-and-korean-bbq/04.jpg"
                 alt=""
                 style="object-position: center 20%;">
          </div>
        </div>

        <div class="polaroid p5" data-src="../../img/seul/ikseon-dong-hanok-village-and-korean-bbq/05.jpg">
          <div class="photo">
            <img src="../../img/seul/ikseon-dong-hanok-village-and-korean-bbq/05.jpg" alt="">
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Modal -->
  <div class="modal" id="modal" aria-hidden="true">
    <img id="modalImg" alt="">
  </div>

  <script>
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    function openModal(src){
      modalImg.src = src;
      modal.classList.add("open");
      modal.setAttribute("aria-hidden","false");
    }
    function closeModal(){
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden","true");
      modalImg.src = "";
    }

    document.querySelectorAll(".polaroid").forEach(p => {
      p.addEventListener("click", () => {
        const src = p.dataset.src || p.querySelector("img")?.src;
        if (src) openModal(src);
      });
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    window.addEventListener("keydown", e => {
      if (e.key === "Escape") closeModal();
    });
  </script>
</body>
</html>
