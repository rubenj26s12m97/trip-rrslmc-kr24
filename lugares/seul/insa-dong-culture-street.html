<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Insa-dong Culture Street – Seúl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 280px;
      --photo-h: 190px;
      --center-y: 0px; /* ajuste fino: + baja, - sube */
    }

    html, body{
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;

      /* ✅ patrón C: fondo fijo + contenido centrado, con scroll si hiciera falta */
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;

      overflow-anchor: none;
      scroll-behavior: auto;
    }

    /* Fondo fijo */
    .bg{
      position: fixed;
      inset: 0;
      background: url("../../img/seul/insa-dong-culture-street/01.jpg") center 45% / cover no-repeat;
      z-index: 0;
    }

    /* Velo */
    .shade{
      position: fixed;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        rgba(0,0,0,0.12),
        rgba(0,0,0,0.65)
      );
      z-index: 1;
      pointer-events: none;
    }

    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
      -webkit-tap-highlight-color: transparent;
    }

    /* Contenedor centrado (scrolleable si hiciera falta) */
    .board{
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 95px 18px 70px;
      box-sizing: border-box;
      transform: translateY(var(--center-y));
    }

    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.96);
      border-radius: 12px;
      padding: 12px 12px 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.35);
      cursor: pointer;
      position: relative;
      user-select: none;
      -webkit-tap-highlight-color: transparent;

      transform: rotate(-1.5deg);
      transform-origin: center;
      transition: transform .16s ease, box-shadow .16s ease;
      will-change: transform;
    }

    @media (hover:hover){
      .polaroid:hover{
        transform: rotate(0deg) scale(1.04);
        box-shadow: 0 18px 38px rgba(0,0,0,0.45);
        z-index: 20;
      }
    }

    .polaroid::before{
      content:"";
      position:absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .photo{
      margin-top: 10px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 8px;
      overflow: hidden;
      background:#eee;
      /* Aquí NO hace falta “des-rotar” porque la foto no está dentro de un lienzo escalado;
         pero tampoco hace daño. Lo dejamos simple. */
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;

      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
      box-sizing: border-box;
    }
    .modal.open{ display:flex; }
    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 14px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.55);
      background: rgba(255,255,255,0.04);
    }

    @media (max-width: 980px){
      :root{
        --polaroid-w: 240px;
        --photo-h: 165px;
        --center-y: 0px;
      }
    }

    @media (max-width: 520px){
      :root{
        --polaroid-w: 220px;
        --photo-h: 155px;
      }
      .board{ padding-top: 78px; }
    }
  </style>
</head>

<body>
  <div class="bg"></div>
  <div class="shade"></div>

  <a class="back" href="../../seul.html">← Volver a Seúl</a>

  <main class="board">
    <div class="polaroid" data-src="../../img/seul/insa-dong-culture-street/01.jpg" aria-label="Foto Insa-dong Culture Street">
      <div class="photo">
        <img src="../../img/seul/insa-dong-culture-street/01.jpg" alt="Insa-dong Culture Street">
      </div>
    </div>
  </main>

  <div class="modal" id="modal" aria-hidden="true">
    <img id="modalImg" alt="Foto ampliada">
  </div>

  <script>
    // ---------- Modal ----------
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    function openModal(src){
      modalImg.src = src;
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeModal(){
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      modalImg.src = "";
    }

    document.querySelector(".polaroid").addEventListener("click", (e) => {
      const src = e.currentTarget.dataset.src;
      if (src) openModal(src);
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });
  </script>
</body>
</html>
