<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Insa-dong Culture Street – Seúl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 280px;
      --photo-h: 190px;
      --center-y: 0px;
    }

    html, body{
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;
      overflow: hidden; /* ✅ patrón BIFF */

      /* ✅ estabilidad */
      overflow-anchor: none;
      scroll-behavior: auto;
    }

    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 20;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
      -webkit-tap-highlight-color: transparent;
    }

    /* Viewport */
    .viewport{
      position: fixed;
      inset: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      overflow-anchor: none;
      scroll-behavior: auto;
      background: #000;
      touch-action: pan-x pan-y;
    }

    /* Stage (lienzo) */
    .stage{
      position: relative;
      width: 1400px;
      height: 950px;
      background:
        radial-gradient(ellipse at center, rgba(0,0,0,0.12), rgba(0,0,0,0.65)),
        url("../../img/seul/insa-dong-culture-street/01.jpg") center 45% / cover no-repeat;
    }

    /* Bloque centrado */
    .stack{
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, calc(-50% + var(--center-y)));
      width: max-content;
    }

    /* Polaroid */
    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.96);
      border-radius: 12px;
      padding: 12px 12px 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.35);
      cursor: pointer;
      user-select: none;
      position: relative;
      -webkit-tap-highlight-color: transparent;

      transform: rotate(-1.5deg);
      transform-origin: center;
      transition: transform .16s ease, box-shadow .16s ease;
      will-change: transform;
    }

    @media (hover:hover){
      .polaroid:hover{
        transform: rotate(0deg) scale(1.04);
        box-shadow: 0 18px 38px rgba(0,0,0,0.45);
      }
    }

    .polaroid::before{
      content:"";
      position:absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .photo{
      margin-top: 10px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 8px;
      overflow: hidden;
      background:#eee;
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;

      /* ✅ evita drag/selección/gestos raros */
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
      box-sizing: border-box;
    }
    .modal.open{ display:flex; }
    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 14px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.55);
      background: rgba(255,255,255,0.04);
    }

    @media (max-width: 980px){
      :root{
        --polaroid-w: 240px;
        --photo-h: 165px;
      }
      .stage{
        width: 1250px;
        height: 950px;
      }
    }
  </style>
</head>

<body>
  <a class="back" href="../../seul.html">← Volver a Seúl</a>

  <div class="viewport" id="viewport">
    <div class="stage" id="stage">

      <div class="stack" id="stack">
        <div class="polaroid" data-src="../../img/seul/insa-dong-culture-street/01.jpg">
          <div class="photo">
            <img src="../../img/seul/insa-dong-culture-street/01.jpg" alt="Insa-dong Culture Street">
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="modal" id="modal" aria-hidden="true">
    <img id="modalImg" alt="Foto ampliada">
  </div>

  <script>
    /* ---------- Modal ---------- */
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    function openModal(src){
      modalImg.src = src;
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    }
    function closeModal(){
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      modalImg.src = "";
    }

    document.querySelector(".polaroid").addEventListener("click", e => {
      const src = e.currentTarget.dataset.src;
      if (src) openModal(src);
    });

    modal.addEventListener("click", e => {
      if (e.target === modal) closeModal();
    });

    window.addEventListener("keydown", e => {
      if (e.key === "Escape") closeModal();
    });

    /* ---------- Centrando BIFF ---------- */
    if ("scrollRestoration" in history) {
      history.scrollRestoration = "manual";
    }

    function centerOnStack(){
      const vp = document.getElementById("viewport");
      const stage = document.getElementById("stage");
      const stack = document.getElementById("stack");
      if (!vp || !stage || !stack) return;

      const vpRect = vp.getBoundingClientRect();
      const stackRect = stack.getBoundingClientRect();

      const centerX = (stackRect.left - vpRect.left) + stackRect.width / 2;
      const centerY = (stackRect.top  - vpRect.top ) + stackRect.height / 2;

      const targetX = vp.scrollLeft + centerX - vp.clientWidth  / 2;
      const targetY = vp.scrollTop  + centerY - vp.clientHeight / 2;

      const maxX = stage.scrollWidth  - vp.clientWidth;
      const maxY = stage.scrollHeight - vp.clientHeight;

      vp.scrollLeft = Math.max(0, Math.min(targetX, Math.max(0, maxX)));
      vp.scrollTop  = Math.max(0, Math.min(targetY, Math.max(0, maxY)));
    }

    function hardResetScroll(){
      const vp = document.getElementById("viewport");
      if (!vp) return;
      vp.scrollTo({ left: 0, top: 0, behavior: "auto" });
      // nudge iOS/Safari
      vp.scrollLeft = 1; vp.scrollTop = 1;
      vp.scrollLeft = 0; vp.scrollTop = 0;
    }

    function forceCenter(){
      hardResetScroll();
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          centerOnStack();
          setTimeout(centerOnStack, 60);
          setTimeout(centerOnStack, 180);
          setTimeout(centerOnStack, 420);
        });
      });
    }

    document.addEventListener("DOMContentLoaded", hardResetScroll);
    window.addEventListener("load", forceCenter);
    window.addEventListener("pageshow", forceCenter);
    window.addEventListener("orientationchange", () => setTimeout(forceCenter, 250));
    window.addEventListener("resize", () => setTimeout(forceCenter, 120));
  </script>
</body>
</html>
