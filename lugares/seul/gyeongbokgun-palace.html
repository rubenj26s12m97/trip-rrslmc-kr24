<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Gyeongbokgung Palace – Seúl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 235px;
      --photo-h: 160px;
      --gap-x: 44px;
      --gap-y: 36px;
    }

    html, body{
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;

      /* ✅ patrón C: scroll */
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Fondo */
    .bg{
      position: fixed;
      inset: 0;
      background-image: url("../../img/seul/gyeongbokgun-palace/01.jpg");
      background-repeat: no-repeat;
      background-position: center 65%;
      background-size: 125% auto;
      z-index: 0;
    }

    .shade{
      position: fixed;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        rgba(0,0,0,0.10),
        rgba(0,0,0,0.65)
      );
      z-index: 1;
      pointer-events: none;
    }

    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
    }

    /* ✅ ya no fixed: permite crecer y hacer scroll */
    .board{
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: 95px 18px 110px;
      box-sizing: border-box;
    }

    .stack{
      display: grid;
      row-gap: var(--gap-y);
    }

    .row{
      display: grid;
      grid-template-columns: repeat(3, var(--polaroid-w));
      column-gap: var(--gap-x);
      justify-content: center;
      align-items: start;
    }

    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.96);
      border-radius: 12px;
      padding: 12px 12px 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.35);
      cursor: pointer;
      position: relative;
      user-select: none;

      /* ✅ marco torcido + lift (sin blur en la foto) */
      transform: translateY(var(--lift,0)) rotate(var(--r,0deg));
      transition: transform .16s ease, box-shadow .16s ease;
    }

    @media (hover:hover){
      .polaroid:hover{
        transform: translateY(calc(var(--lift,0) - 2px))
                   rotate(var(--r,0deg))
                   scale(1.04);
        box-shadow: 0 18px 38px rgba(0,0,0,0.45);
        z-index: 20;
      }
    }

    .polaroid::before{
      content:"";
      position:absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    /* ✅ foto des-rotada → nítida */
    .photo{
      margin-top: 10px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 8px;
      overflow: hidden;
      background:#eee;
      transform: rotate(calc(var(--r,0deg) * -1));
      transform-origin: center;
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
    }

    /* Variaciones suaves */
    .p1{ --lift:  4px; --r:-1.6deg; }
    .p2{ --lift: -3px; --r: 1.4deg; }
    .p3{ --lift:  2px; --r:-1deg; }
    .p4{ --lift: -4px; --r: 1.8deg; }
    .p5{ --lift:  3px; --r:-1.2deg; }
    .p6{ --lift: -2px; --r: 1deg; }

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
      box-sizing: border-box;
    }
    .modal.open{ display:flex; }
    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 14px;
    }

    /* ✅ móvil: mantener 3 columnas con scroll horizontal */
    @media (max-width: 980px){
      :root{
        --polaroid-w: 210px;
        --photo-h: 145px;
        --gap-x: 22px;
        --gap-y: 28px;
      }

      .row{
        grid-template-columns: repeat(3, var(--polaroid-w));
        column-gap: var(--gap-x);
        justify-content: start;

        overflow-x: auto;
        overflow-y: visible;
        -webkit-overflow-scrolling: touch;
        padding: 0 10px 10px;
        scroll-snap-type: x mandatory;
      }

      .polaroid{ scroll-snap-align: center; --lift:0; --r:0deg; }
      .photo{ transform:none; }
    }
  </style>
</head>

<body>
  <div class="bg"></div>
  <div class="shade"></div>

  <a class="back" href="../../seul.html">← Volver a Seúl</a>

  <main class="board">
    <div class="stack">

      <!-- Fila 1 -->
      <div class="row">
        <div class="polaroid p1" data-src="../../img/seul/gyeongbokgun-palace/01.jpg">
          <div class="photo"><img src="../../img/seul/gyeongbokgun-palace/01.jpg" alt=""></div>
        </div>
        <div class="polaroid p2" data-src="../../img/seul/gyeongbokgun-palace/02.jpg">
          <div class="photo"><img src="../../img/seul/gyeongbokgun-palace/02.jpg" alt=""></div>
        </div>
        <div class="polaroid p3" data-src="../../img/seul/gyeongbokgun-palace/03.jpg">
          <div class="photo"><img src="../../img/seul/gyeongbokgun-palace/03.jpg" alt=""></div>
        </div>
      </div>

      <!-- Fila 2 -->
      <div class="row">
        <div class="polaroid p4" data-src="../../img/seul/gyeongbokgun-palace/04.jpg">
          <div class="photo"><img src="../../img/seul/gyeongbokgun-palace/04.jpg" alt=""></div>
        </div>
        <div class="polaroid p5" data-src="../../img/seul/gyeongbokgun-palace/05.jpg">
          <div class="photo"><img src="../../img/seul/gyeongbokgun-palace/05.jpg" alt=""></div>
        </div>
        <div class="polaroid p6" data-src="../../img/seul/gyeongbokgun-palace/06.jpg">
          <div class="photo"><img src="../../img/seul/gyeongbokgun-palace/06.jpg" alt=""></div>
        </div>
      </div>

    </div>
  </main>

  <!-- Modal -->
  <div class="modal" id="modal">
    <img id="modalImg" alt="">
  </div>

  <script>
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    document.querySelectorAll(".polaroid").forEach(p => {
      p.addEventListener("click", () => {
        modalImg.src = p.dataset.src || p.querySelector("img").src;
        modal.classList.add("open");
      });
    });

    modal.addEventListener("click", () => {
      modal.classList.remove("open");
      modalImg.src = "";
    });

    window.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        modal.classList.remove("open");
        modalImg.src = "";
      }
    });
  </script>
</body>
</html>
