<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Gyeongbokgung Palace – Seúl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 235px;
      --photo-h: 160px;

      /* ✅ más aire (desktop) */
      --gap-x: 56px;
      --gap-y: 42px;

      --center-y: 0px; /* ajuste fino vertical del bloque */
    }

    html, body{
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;
      overflow: hidden;
    }

    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 20;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
      -webkit-tap-highlight-color: transparent;
    }

    .viewport{
      position: fixed;
      inset: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      background: #000;
      overflow-anchor: none;
      scroll-behavior: auto;
    }

    /* ✅ Fondo dentro del stage (NO fixed) */
    .stage{
      position: relative;
      width: 1500px;
      height: 980px;
      background:
        radial-gradient(ellipse at center, rgba(0,0,0,0.10), rgba(0,0,0,0.65)),
        url("../../img/seul/gyeongbokgun-palace/01.jpg") center 65% / 125% auto no-repeat;
    }

    /* bloque centrado */
    .stack{
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, calc(-50% + var(--center-y)));
      display: grid;
      row-gap: var(--gap-y);
      width: max-content;
      justify-items: center;
    }

    .row{
      display: grid;
      grid-template-columns: repeat(3, var(--polaroid-w));
      column-gap: var(--gap-x);
      justify-content: center;
      align-items: start;
      width: max-content;
      box-sizing: border-box;
    }

    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.96);
      border-radius: 12px;
      padding: 12px 12px 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.35);
      cursor: pointer;
      position: relative;
      user-select: none;
      -webkit-tap-highlight-color: transparent;

      /* ✅ corcho: rotación + micro desplazamiento */
      transform: rotate(var(--r,0deg)) translate(var(--tx,0px), var(--ty,0px));
      transition: transform .16s ease, box-shadow .16s ease;
      transform-origin: center;
      will-change: transform;
    }

    @media (hover:hover){
      .polaroid:hover{
        transform: rotate(var(--r,0deg))
                   translate(var(--tx,0px), calc(var(--ty,0px) - 2px))
                   scale(1.04);
        box-shadow: 0 18px 38px rgba(0,0,0,0.45);
        z-index: 20;
      }
    }

    .polaroid::before{
      content:"";
      position:absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    /* ✅ foto des-rotada → nítida */
    .photo{
      margin-top: 10px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 8px;
      overflow: hidden;
      background:#eee;
      transform: rotate(calc(var(--r,0deg) * -1));
      transform-origin: center;
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* ✅ “desorden controlado” (desktop) */
    .p1{ --r:-2.5deg; --tx:-10px; --ty:-8px; }
    .p2{ --r: 1.8deg; --tx:  6px; --ty:  4px; }
    .p3{ --r:-1.4deg; --tx: 10px; --ty: -6px; }

    .p4{ --r: 2.2deg; --tx:-12px; --ty: 10px; }
    .p5{ --r:-1.8deg; --tx:  8px; --ty: -4px; }
    .p6{ --r: 1.2deg; --tx: 12px; --ty:  8px; }

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
      box-sizing: border-box;
    }
    .modal.open{ display:flex; }
    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 14px;
    }

    /* ✅ móvil: mantener 3 columnas por fila (scroll horizontal por fila) + corcho suave */
    @media (max-width: 980px){
      :root{
        --polaroid-w: 210px;
        --photo-h: 145px;

        /* ✅ aire en móvil */
        --gap-x: 26px;
        --gap-y: 30px;

        --center-y: 0px;
      }

      .stage{
        width: 1300px;
        height: 980px;
      }

      .row{
        justify-content: start;
        overflow-x: auto;
        overflow-y: visible;
        -webkit-overflow-scrolling: touch;
        padding: 0 10px 10px;
        scroll-snap-type: x mandatory;
      }

      .polaroid{ scroll-snap-align: center; }

      /* ✅ corcho suave (no cero) */
      .p1{ --r:-1.8deg; --tx:-6px; --ty:-5px; }
      .p2{ --r: 1.2deg; --tx: 4px; --ty: 3px; }
      .p3{ --r:-1.0deg; --tx: 6px; --ty:-4px; }

      .p4{ --r: 1.4deg; --tx:-7px; --ty: 6px; }
      .p5{ --r:-1.2deg; --tx: 5px; --ty:-3px; }
      .p6{ --r: 0.9deg; --tx: 7px; --ty: 5px; }
    }
  </style>
</head>

<body>
  <a class="back" href="../../seul.html">← Volver a Seúl</a>

  <div class="viewport" id="viewport">
    <div class="stage" id="stage">

      <div class="stack" id="stack">
        <!-- Fila 1 -->
        <div class="row">
          <div class="polaroid p1" data-src="../../img/seul/gyeongbokgun-palace/01.jpg">
            <div class="photo"><img src="../../img/seul/gyeongbokgun-palace/01.jpg" alt=""></div>
          </div>
          <div class="polaroid p2" data-src="../../img/seul/gyeongbokgun-palace/02.jpg">
            <div class="photo"><img src="../../img/seul/gyeongbokgun-palace/02.jpg" alt=""></div>
          </div>
          <div class="polaroid p3" data-src="../../img/seul/gyeongbokgun-palace/03.jpg">
            <div class="photo"><img src="../../img/seul/gyeongbokgun-palace/03.jpg" alt=""></div>
          </div>
        </div>

        <!-- Fila 2 -->
        <div class="row">
          <div class="polaroid p4" data-src="../../img/seul/gyeongbokgun-palace/04.jpg">
            <div class="photo"><img src="../../img/seul/gyeongbokgun-palace/04.jpg" alt=""></div>
          </div>
          <div class="polaroid p5" data-src="../../img/seul/gyeongbokgun-palace/05.jpg">
            <div class="photo"><img src="../../img/seul/gyeongbokgun-palace/05.jpg" alt=""></div>
          </div>
          <div class="polaroid p6" data-src="../../img/seul/gyeongbokgun-palace/06.jpg">
            <div class="photo"><img src="../../img/seul/gyeongbokgun-palace/06.jpg" alt=""></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <img id="modalImg" alt="">
  </div>

  <script>
    // ---------- Modal ----------
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    document.querySelectorAll(".polaroid").forEach(p => {
      p.addEventListener("click", () => {
        modalImg.src = p.dataset.src || p.querySelector("img").src;
        modal.classList.add("open");
      });
    });

    function closeModal(){
      modal.classList.remove("open");
      modalImg.src = "";
    }
    modal.addEventListener("click", closeModal);
    window.addEventListener("keydown", e => {
      if (e.key === "Escape") closeModal();
    });

    // ---------- Entrada centrada ----------
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";

    function clamp(v, min, max){ return Math.min(Math.max(v, min), max); }

    function centerOnStack(){
      const vp = document.getElementById("viewport");
      const stage = document.getElementById("stage");
      const stack = document.getElementById("stack");
      if (!vp || !stage || !stack) return;

      const cx = stack.offsetLeft + stack.offsetWidth / 2;
      const cy = stack.offsetTop  + stack.offsetHeight / 2;

      const targetX = cx - vp.clientWidth / 2;
      const targetY = cy - vp.clientHeight / 2;

      const maxX = stage.offsetWidth  - vp.clientWidth;
      const maxY = stage.offsetHeight - vp.clientHeight;

      vp.scrollLeft = clamp(targetX, 0, Math.max(0, maxX));
      vp.scrollTop  = clamp(targetY, 0, Math.max(0, maxY));
    }

    function hardResetScroll(){
      const vp = document.getElementById("viewport");
      if (!vp) return;
      vp.scrollTo({ left: 0, top: 0, behavior: "auto" });
      vp.scrollLeft = 1; vp.scrollTop = 1;
      vp.scrollLeft = 0; vp.scrollTop = 0;
    }

    function forceCenter(){
      hardResetScroll();
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          centerOnStack();
          setTimeout(centerOnStack, 60);
          setTimeout(centerOnStack, 180);
          setTimeout(centerOnStack, 420);
        });
      });
    }

    document.addEventListener("DOMContentLoaded", hardResetScroll);
    window.addEventListener("load", forceCenter);
    window.addEventListener("pageshow", () => forceCenter());
    window.addEventListener("orientationchange", () => setTimeout(forceCenter, 250));
    window.addEventListener("resize", () => setTimeout(forceCenter, 120));
  </script>
</body>
</html>
