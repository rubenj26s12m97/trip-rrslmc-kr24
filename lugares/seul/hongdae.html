<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Hongdae – Seúl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 280px;
      --photo-h: 190px;
      --center-y: 0px; /* ajuste fino */
    }

    html, body{
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;

      /* ✅ patrón C: fondo fijo + contenido centrado (sin “entrar por esquina”) */
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;

      overflow-anchor: none;
      scroll-behavior: auto;
    }

    /* ✅ Fondo fijo */
    .bg{
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at center, rgba(0,0,0,0.12), rgba(0,0,0,0.65)),
        url("../../img/seul/hongdae/01.jpg") center 45% / cover no-repeat;
      z-index: 0;
    }

    .shade{
      position: fixed;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        rgba(0,0,0,0.08),
        rgba(0,0,0,0.30)
      );
      z-index: 1;
      pointer-events: none;
    }

    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
      -webkit-tap-highlight-color: transparent;
    }

    /* ✅ Contenido centrado */
    .board{
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 95px 18px 70px;
      box-sizing: border-box;
    }

    .stack{
      transform: translateY(var(--center-y));
      width: max-content;
      position: relative;
    }

    /* Polaroid */
    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.96);
      border-radius: 12px;
      padding: 12px 12px 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.35);
      cursor: pointer;
      user-select: none;
      position: relative;
      -webkit-tap-highlight-color: transparent;

      transform: rotate(-1.5deg);
      transition: transform .16s ease, box-shadow .16s ease;
      will-change: transform;
    }

    @media (hover:hover){
      .polaroid:hover{
        transform: rotate(0deg) scale(1.04);
        box-shadow: 0 18px 38px rgba(0,0,0,0.45);
        z-index: 20;
      }
    }

    .polaroid::before{
      content:"";
      position:absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .photo{
      margin-top: 10px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 8px;
      overflow: hidden;
      background:#eee;

      /* ✅ anti-blur: des-rotamos la foto */
      transform: rotate(1.5deg);
      transform-origin: center;
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
      pointer-events: none;
      -webkit-user-drag: none;
      user-select: none;
    }

    /* ✅ Easter egg ahora fijo también (antes “parte del lienzo”) */
    .easter{
      position: fixed;
      right: 24px;
      bottom: 22px;
      width: 45px;
      z-index: 12;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;

      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
      filter: saturate(0.9);
      border-radius: 10px;
    }

    @media (hover:hover){
      .easter:hover{
        transform: scale(1.12) rotate(-1deg);
        filter: saturate(1.1) brightness(1.05);
        box-shadow: 0 10px 26px rgba(0,0,0,0.35);
      }
    }

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
      box-sizing: border-box;
      isolation: isolate;
    }
    .modal.open{ display:flex; }
    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 14px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.55);
      filter: none !important;
      mix-blend-mode: normal !important;
    }

    @media (max-width: 980px){
      :root{
        --polaroid-w: 240px;
        --photo-h: 165px;
      }
      .board{ padding-top: 86px; }
      .polaroid{ transform: rotate(0deg); }
      .photo{ transform:none; }
      .easter{ right: 18px; bottom: 18px; }
    }

    @media (max-width: 520px){
      :root{
        --polaroid-w: 220px;
        --photo-h: 150px;
      }
      .board{ padding-top: 78px; }
      .easter{ width: 42px; }
    }
  </style>
</head>

<body>
  <div class="bg"></div>
  <div class="shade"></div>

  <a class="back" href="../../seul.html">← Volver a Seúl</a>

  <main class="board">
    <div class="stack">
      <div class="polaroid" data-src="../../img/seul/hongdae/01.jpg">
        <div class="photo">
          <img src="../../img/seul/hongdae/01.jpg" alt="Hongdae">
        </div>
      </div>
    </div>
  </main>

  <!-- Easter egg (fijo) -->
  <img class="easter"
       src="../../img/seul/hongdae/02.png"
       data-src="../../img/seul/hongdae/02.png"
       alt=""
       aria-hidden="true">

  <div class="modal" id="modal" aria-hidden="true">
    <img id="modalImg" alt="">
  </div>

  <script>
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    function openModal(src){
      modalImg.src = src;
      modal.classList.add("open");
      modal.setAttribute("aria-hidden","false");
    }
    function closeModal(){
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden","true");
      modalImg.src = "";
    }

    document.querySelector(".polaroid").addEventListener("click", (e) => {
      const src = e.currentTarget.dataset.src || e.currentTarget.querySelector("img")?.src;
      if (src) openModal(src);
    });

    document.querySelector(".easter").addEventListener("click", (e) => {
      const src = e.currentTarget.dataset.src;
      if (src) openModal(src);
    });

    modal.addEventListener("click", closeModal);
    window.addEventListener("keydown", e => {
      if (e.key === "Escape") closeModal();
    });
  </script>
</body>
</html>
