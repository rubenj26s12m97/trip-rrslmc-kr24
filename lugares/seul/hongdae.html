<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Hongdae – Seúl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 280px;
      --photo-h: 190px;
      --center-y: 0px; /* ajuste fino */
    }

    html, body{
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;
      overflow: hidden; /* ✅ scroll en .viewport (X + Y) */
    }

    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 20;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
      -webkit-tap-highlight-color: transparent;
    }

    /* ✅ Scroll del lienzo completo (fondo + polaroids) */
    .viewport{
      position: fixed;
      inset: 0;
      overflow: auto;                 /* ✅ vertical + horizontal */
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      background: #000;

      overflow-anchor: none;
      scroll-behavior: auto;
    }

    /* ✅ Fondo dentro del stage (no fixed) */
    .stage{
      position: relative;
      width: 1400px;
      height: 900px;
      background:
        radial-gradient(ellipse at center, rgba(0,0,0,0.12), rgba(0,0,0,0.65)),
        url("../../img/seul/hongdae/01.jpg") center 45% / cover no-repeat;
    }

    .shade{
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        rgba(0,0,0,0.08),
        rgba(0,0,0,0.30)
      );
      pointer-events: none;
    }

    /* ✅ Contenido centrado dentro del stage */
    .stack{
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, calc(-50% + var(--center-y)));
      width: max-content;
      z-index: 2;
    }

    /* Polaroid */
    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.96);
      border-radius: 12px;
      padding: 12px 12px 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.35);
      cursor: pointer;
      user-select: none;
      position: relative;
      -webkit-tap-highlight-color: transparent;

      transform: rotate(-1.5deg);
      transition: transform .16s ease, box-shadow .16s ease;
      will-change: transform;
    }

    @media (hover:hover){
      .polaroid:hover{
        transform: rotate(0deg) scale(1.04);
        box-shadow: 0 18px 38px rgba(0,0,0,0.45);
        z-index: 20;
      }
    }

    .polaroid::before{
      content:"";
      position:absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .photo{
      margin-top: 10px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 8px;
      overflow: hidden;
      background:#eee;

      /* ✅ anti-blur: des-rotamos la foto */
      transform: rotate(1.5deg);
      transform-origin: center;
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
      pointer-events: none;
      -webkit-user-drag: none;
      user-select: none;
    }

    /* ✅ Easter egg fijo (se mantiene como lo querías) */
    .easter{
      position: fixed;
      right: 24px;
      bottom: 22px;
      width: 45px;
      z-index: 30;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;

      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
      filter: saturate(0.9);
      border-radius: 10px;
    }

    @media (hover:hover){
      .easter:hover{
        transform: scale(1.12) rotate(-1deg);
        filter: saturate(1.1) brightness(1.05);
        box-shadow: 0 10px 26px rgba(0,0,0,0.35);
      }
    }

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
      box-sizing: border-box;
      isolation: isolate;
    }
    .modal.open{ display:flex; }
    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 14px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.55);
      filter: none !important;
      mix-blend-mode: normal !important;
    }

    @media (max-width: 980px){
      :root{
        --polaroid-w: 240px;
        --photo-h: 165px;
      }

      .stage{
        width: 1200px;
        height: 900px;
      }

      .polaroid{ transform: rotate(0deg); }
      .photo{ transform:none; }
      .easter{ right: 18px; bottom: 18px; }
    }

    @media (max-width: 520px){
      :root{
        --polaroid-w: 220px;
        --photo-h: 150px;
      }

      .stage{
        width: 1100px;
        height: 900px;
      }

      .easter{ width: 42px; }
    }
  </style>
</head>

<body>
  <a class="back" href="../../seul.html">← Volver a Seúl</a>

  <div class="viewport" id="viewport">
    <div class="stage" id="stage">
      <div class="shade"></div>

      <main class="stack" id="stack" aria-label="Foto Hongdae">
        <div class="polaroid" data-src="../../img/seul/hongdae/01.jpg">
          <div class="photo">
            <img src="../../img/seul/hongdae/01.jpg" alt="Hongdae">
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Easter egg (fijo) -->
  <img class="easter"
       src="../../img/seul/hongdae/02.png"
       data-src="../../img/seul/hongdae/02.png"
       alt=""
       aria-hidden="true">

  <div class="modal" id="modal" aria-hidden="true">
    <img id="modalImg" alt="">
  </div>

  <script>
    // ---------- Modal ----------
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    function openModal(src){
      modalImg.src = src;
      modal.classList.add("open");
      modal.setAttribute("aria-hidden","false");
    }
    function closeModal(){
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden","true");
      modalImg.src = "";
    }

    document.querySelector(".polaroid").addEventListener("click", (e) => {
      const src = e.currentTarget.dataset.src || e.currentTarget.querySelector("img")?.src;
      if (src) openModal(src);
    });

    document.querySelector(".easter").addEventListener("click", (e) => {
      const src = e.currentTarget.dataset.src;
      if (src) openModal(src);
    });

    modal.addEventListener("click", closeModal);
    window.addEventListener("keydown", e => {
      if (e.key === "Escape") closeModal();
    });

    // ---------- Entrar centrado ----------
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";

    function clamp(v, min, max){ return Math.min(Math.max(v, min), max); }

    function centerOnStack(){
      const vp = document.getElementById("viewport");
      const stage = document.getElementById("stage");
      const stack = document.getElementById("stack");
      if (!vp || !stage || !stack) return;

      const vpRect = vp.getBoundingClientRect();
      const stackRect = stack.getBoundingClientRect();

      const stackCx = stackRect.left + stackRect.width / 2;
      const stackCy = stackRect.top  + stackRect.height / 2;

      const vpCx = vpRect.left + vpRect.width / 2;
      const vpCy = vpRect.top  + vpRect.height / 2;

      const dx = stackCx - vpCx;
      const dy = stackCy - vpCy;

      let targetX = vp.scrollLeft + dx;
      let targetY = vp.scrollTop  + dy;

      const maxX = Math.max(0, stage.scrollWidth  - vp.clientWidth);
      const maxY = Math.max(0, stage.scrollHeight - vp.clientHeight);

      vp.scrollLeft = clamp(targetX, 0, maxX);
      vp.scrollTop  = clamp(targetY, 0, maxY);
    }

    function hardResetScroll(){
      const vp = document.getElementById("viewport");
      if (!vp) return;
      vp.scrollTo({ left: 0, top: 0, behavior: "auto" });
    }

    function forceCenter(){
      hardResetScroll();
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          centerOnStack();
          setTimeout(centerOnStack, 80);
          setTimeout(centerOnStack, 220);
          setTimeout(centerOnStack, 520);
        });
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      hardResetScroll();
      requestAnimationFrame(centerOnStack);
    });

    window.addEventListener("load", forceCenter);
    window.addEventListener("pageshow", () => forceCenter());
    window.addEventListener("orientationchange", () => setTimeout(forceCenter, 250));
    window.addEventListener("resize", () => setTimeout(forceCenter, 140));
  </script>
</body>
</html>
