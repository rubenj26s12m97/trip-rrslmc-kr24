<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Hongdae – Seúl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 280px;
      --photo-h: 190px;
    }

    html, body{
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;
      overflow: hidden;
    }

    /* Fondo */
    .bg{
      position: fixed;
      inset: 0;
      background: url("../../img/seul/hongdae/01.jpg") center 45% / cover no-repeat;
      z-index: 0;
    }

    .shade{
      position: fixed;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        rgba(0,0,0,0.12),
        rgba(0,0,0,0.65)
      );
      z-index: 1;
      pointer-events: none;
    }

    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
    }

    .board{
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding-top: 95px;
      box-sizing: border-box;
    }

    /* ✅ faltaba position:relative para que ::before no se “pierda” */
    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.96);
      border-radius: 12px;
      padding: 12px 12px 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.35);
      cursor: pointer;
      user-select: none;
      position: relative;
      transform: rotate(-1.5deg);
      transition: transform .16s ease, box-shadow .16s ease;
    }

    @media (hover:hover){
      .polaroid:hover{
        transform: rotate(0deg) scale(1.04);
        box-shadow: 0 18px 38px rgba(0,0,0,0.45);
      }
    }

    .polaroid::before{
      content:"";
      position:absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .photo{
      margin-top: 10px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 8px;
      overflow: hidden;
      background:#eee;
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
    }

    /* Imagen escondida */
    .easter{
      position: fixed;
      bottom: 270px;
      right: 195px;
      width: 45px;
      opacity: 1;
      pointer-events: auto;
      z-index: 30;
      filter: saturate(0.9);
      transition: transform .18s ease,
                  box-shadow .18s ease,
                  filter .18s ease;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }

    .easter:hover{
      transform: scale(1.12) rotate(-1deg);
      filter: saturate(1.1) brightness(1.05);
      box-shadow: 0 10px 26px rgba(0,0,0,0.35);
    }

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
      box-sizing: border-box;
    }
    .modal.open{ display:flex; }
    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 14px;
    }
  </style>
</head>

<body>
  <div class="bg"></div>
  <div class="shade"></div>

  <a class="back" href="../../seul.html">← Volver a Seúl</a>

  <main class="board">
    <div class="polaroid" data-src="../../img/seul/hongdae/01.jpg">
      <div class="photo">
        <img src="../../img/seul/hongdae/01.jpg" alt="Hongdae">
      </div>
    </div>
  </main>

  <!-- Imagen escondida (clicable → abre modal con 02.png) -->
  <img class="easter"
       src="../../img/seul/hongdae/02.png"
       data-src="../../img/seul/hongdae/02.png"
       alt=""
       aria-hidden="true">

  <!-- Modal -->
  <div class="modal" id="modal">
    <img id="modalImg" alt="">
  </div>

  <script>
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    function openModal(src){
      modalImg.src = src;
      modal.classList.add("open");
    }
    function closeModal(){
      modal.classList.remove("open");
      modalImg.src = "";
    }

    // Polaroid principal
    document.querySelector(".polaroid").addEventListener("click", (e) => {
      openModal(e.currentTarget.dataset.src);
    });

    // ✅ Easter egg: también abre modal (si no lo quieres, borra este listener)
    document.querySelector(".easter").addEventListener("click", (e) => {
      openModal(e.currentTarget.dataset.src);
    });

    modal.addEventListener("click", closeModal);

    window.addEventListener("keydown", e => {
      if (e.key === "Escape") closeModal();
    });
  </script>
</body>
</html>
