<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Hongdae – Seúl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 280px;
      --photo-h: 190px;
      --center-y: 0px;
    }

    html, body{
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;
      overflow: hidden; /* ✅ scroll en .viewport */
    }

    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 20;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
      -webkit-tap-highlight-color: transparent;
    }

    .viewport{
      position: fixed;
      inset: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      overflow-anchor: none;
      scroll-behavior: auto;
      background: #000;
    }

    /* ✅ fondo dentro del stage (NO fixed) */
    .stage{
      position: relative;
      width: 1400px;
      height: 950px;
      background:
        radial-gradient(ellipse at center, rgba(0,0,0,0.12), rgba(0,0,0,0.65)),
        url("../../img/seul/hongdae/01.jpg") center 45% / cover no-repeat;
    }

    /* bloque centrado */
    .stack{
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, calc(-50% + var(--center-y)));
      width: max-content;
    }

    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.96);
      border-radius: 12px;
      padding: 12px 12px 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.35);
      cursor: pointer;
      user-select: none;
      position: relative;
      -webkit-tap-highlight-color: transparent;

      /* ✅ corcho: rotación + micro desplazamiento */
      transform: rotate(var(--r, -1.5deg)) translate(var(--tx, 0px), var(--ty, 0px));
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
      transform-origin: center;
      will-change: transform;
    }

    @media (hover:hover){
      .polaroid:hover{
        transform: rotate(var(--r, -1.5deg))
                   translate(var(--tx, 0px), calc(var(--ty, 0px) - 2px))
                   scale(1.04);
        box-shadow: 0 18px 38px rgba(0,0,0,0.45);
        z-index: 25;
      }
    }

    .polaroid::before{
      content:"";
      position:absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .photo{
      margin-top: 10px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 8px;
      overflow: hidden;
      background:#eee;

      /* ✅ des-rotada para nitidez */
      transform: rotate(calc(var(--r, -1.5deg) * -1));
      transform-origin: center;
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* ✅ valores del “corcho” (desktop) */
    .polaroid{
      --r: -1.6deg;
      --tx: -8px;
      --ty: -6px;
    }

    /* ✅ Easter egg: parte del stage */
    .easter{
      position: absolute;
      right: 195px;
      bottom: 270px;
      width: 45px;
      opacity: 1;
      pointer-events: auto;
      z-index: 30;
      filter: saturate(0.9);
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      border-radius: 10px;
    }

    .easter:hover{
      transform: scale(1.12) rotate(-1deg);
      filter: saturate(1.1) brightness(1.05);
      box-shadow: 0 10px 26px rgba(0,0,0,0.35);
    }

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
      box-sizing: border-box;
    }
    .modal.open{ display:flex; }
    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 14px;
    }

    /* ✅ móvil: tamaños + corcho suave */
    @media (max-width: 980px){
      :root{
        --polaroid-w: 240px;
        --photo-h: 165px;
      }
      .stage{
        width: 1250px;
        height: 950px;
      }

      .polaroid{
        --r: -1.2deg;
        --tx: -5px;
        --ty: -4px;
      }
    }
  </style>
</head>

<body>
  <a class="back" href="../../seul.html">← Volver a Seúl</a>

  <div class="viewport" id="viewport">
    <div class="stage" id="stage">

      <div class="stack" id="stack">
        <div class="polaroid" data-src="../../img/seul/hongdae/01.jpg">
          <div class="photo">
            <img src="../../img/seul/hongdae/01.jpg" alt="Hongdae">
          </div>
        </div>
      </div>

      <!-- Easter egg -->
      <img class="easter"
           src="../../img/seul/hongdae/02.png"
           data-src="../../img/seul/hongdae/02.png"
           alt=""
           aria-hidden="true">

    </div>
  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <img id="modalImg" alt="">
  </div>

  <script>
    // ---------- Modal ----------
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    function openModal(src){
      modalImg.src = src;
      modal.classList.add("open");
    }
    function closeModal(){
      modal.classList.remove("open");
      modalImg.src = "";
    }

    document.querySelector(".polaroid").addEventListener("click", (e) => {
      openModal(e.currentTarget.dataset.src);
    });

    document.querySelector(".easter").addEventListener("click", (e) => {
      openModal(e.currentTarget.dataset.src);
    });

    modal.addEventListener("click", closeModal);
    window.addEventListener("keydown", e => {
      if (e.key === "Escape") closeModal();
    });

    // ---------- Entrada centrada (BIFF) ----------
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";

    function clamp(v, min, max){ return Math.min(Math.max(v, min), max); }

    function centerOnStack(){
      const vp = document.getElementById("viewport");
      const stage = document.getElementById("stage");
      const stack = document.getElementById("stack");
      if (!vp || !stage || !stack) return;

      const cx = stack.offsetLeft + stack.offsetWidth / 2;
      const cy = stack.offsetTop  + stack.offsetHeight / 2;

      const targetX = cx - vp.clientWidth / 2;
      const targetY = cy - vp.clientHeight / 2;

      const maxX = stage.offsetWidth  - vp.clientWidth;
      const maxY = stage.offsetHeight - vp.clientHeight;

      vp.scrollLeft = clamp(targetX, 0, Math.max(0, maxX));
      vp.scrollTop  = clamp(targetY, 0, Math.max(0, maxY));
    }

    function hardResetScroll(){
      const vp = document.getElementById("viewport");
      if (!vp) return;
      vp.scrollTo({ left: 0, top: 0, behavior: "auto" });
      vp.scrollLeft = 1; vp.scrollTop = 1;
      vp.scrollLeft = 0; vp.scrollTop = 0;
    }

    function forceCenter(){
      hardResetScroll();
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          centerOnStack();
          setTimeout(centerOnStack, 60);
          setTimeout(centerOnStack, 180);
          setTimeout(centerOnStack, 420);
        });
      });
    }

    document.addEventListener("DOMContentLoaded", hardResetScroll);
    window.addEventListener("load", forceCenter);
    window.addEventListener("pageshow", () => forceCenter());
    window.addEventListener("orientationchange", () => setTimeout(forceCenter, 250));
    window.addEventListener("resize", () => setTimeout(forceCenter, 120));
  </script>
</body>
</html>
