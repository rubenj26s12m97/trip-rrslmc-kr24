<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Kkanbu Chicken – Seúl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 220px;
      --photo-h: 155px;

      --base-gap: 92px;   /* ✅ más aire entre 02 y 03 */
      --row-gap: 44px;    /* ✅ aire vertical (entre 01 y base) */
      --center-y: 0px;    /* ✅ ajuste fino del bloque */
    }

    html, body{
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;

      /* ✅ patrón C: fondo fijo + contenido centrado */
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;

      overflow-anchor: none;
      scroll-behavior: auto;
    }

    /* ✅ Fondo fijo */
    .bg{
      position: fixed;
      inset: 0;
      background: url("../../img/seul/kkanbu-chicken/01.jpg") center / cover no-repeat;
      z-index: 0;
    }

    .shade{
      position: fixed;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        rgba(0,0,0,0.18),
        rgba(0,0,0,0.66)
      );
      z-index: 1;
      pointer-events: none;
    }

    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
      -webkit-tap-highlight-color: transparent;
    }

    /* ✅ Contenido centrado (sin entrar por esquina) */
    .board{
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 95px 18px 70px;
      box-sizing: border-box;
    }

    /* Pirámide centrada */
    .pyramid{
      position: relative;
      width: calc(var(--polaroid-w) * 2 + var(--base-gap));
      height: calc(var(--photo-h) * 2 + var(--row-gap) + 120px);
      transform: translateY(var(--center-y));
    }

    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.95);
      border-radius: 12px;
      padding: 12px 12px 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.35);
      cursor: pointer;
      position: absolute;
      user-select: none;
      -webkit-tap-highlight-color: transparent;

      transition: transform .16s ease, box-shadow .16s ease;
      will-change: transform;

      transform: translate(var(--tx, 0px), var(--ty, 0px)) rotate(var(--r, 0deg));
    }

    @media (hover: hover){
      .polaroid:hover{
        transform:
          translate(var(--tx, 0px), calc(var(--ty, 0px) - 2px))
          rotate(var(--r, 0deg))
          scale(1.03);
        box-shadow: 0 18px 38px rgba(0,0,0,0.45);
        z-index: 20;
      }
    }

    .polaroid::before{
      content:"";
      position:absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .photo{
      margin-top: 10px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 8px;
      overflow: hidden;
      background:#eee;

      /* ✅ anti-blur: des-rotamos la foto */
      transform: rotate(calc(var(--r,0deg) * -1));
      transform-origin: center;
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* Posiciones (pirámide) */
    .p1{
      top: 0;
      left: 50%;
      --tx: -50%;
      --ty: 0px;
      --r: -2deg;
      transform: translateX(var(--tx)) translateY(var(--ty)) rotate(var(--r));
    }

    @media (hover:hover){
      .p1:hover{
        transform: translateX(var(--tx)) translateY(calc(var(--ty) - 2px)) rotate(var(--r)) scale(1.03);
      }
    }

    .p2{
      bottom: 0;
      left: 0;
      --tx: 0px;
      --ty: 0px;
      --r: 2deg;
    }

    .p3{
      bottom: 0;
      right: 0;
      --tx: 0px;
      --ty: 0px;
      --r: -1deg;
    }

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.90);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
      box-sizing: border-box;
      isolation: isolate;
    }
    .modal.open{ display:flex; }

    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 14px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.55);
      filter: none !important;
      mix-blend-mode: normal !important;
    }

    /* ✅ móvil */
    @media (max-width: 520px){
      :root{
        --polaroid-w: 180px;
        --photo-h: 130px;
        --base-gap: 62px;
        --row-gap: 36px;
      }

      .board{ padding-top: 78px; }

      /* si queda grande, reduce sin romper centrado */
      .pyramid{ transform: translateY(var(--center-y)) scale(0.96); transform-origin: center top; }

      .polaroid{ transition: transform .12s ease, box-shadow .12s ease; }
      .photo{ transform:none; }
      .polaroid{ --r:0deg; }
    }
  </style>
</head>

<body>
  <div class="bg"></div>
  <div class="shade"></div>

  <a class="back" href="../../seul.html">← Volver a Seúl</a>

  <main class="board">
    <div class="pyramid" aria-label="Fotos Kkanbu Chicken">
      <!-- 01 arriba -->
      <div class="polaroid p1" data-src="../../img/seul/kkanbu-chicken/01.jpg">
        <div class="photo"><img src="../../img/seul/kkanbu-chicken/01.jpg" alt=""></div>
      </div>

      <!-- 02 abajo izquierda -->
      <div class="polaroid p2" data-src="../../img/seul/kkanbu-chicken/02.jpg">
        <div class="photo"><img src="../../img/seul/kkanbu-chicken/02.jpg" alt=""></div>
      </div>

      <!-- 03 abajo derecha -->
      <div class="polaroid p3" data-src="../../img/seul/kkanbu-chicken/03.jpg">
        <div class="photo"><img src="../../img/seul/kkanbu-chicken/03.jpg" alt=""></div>
      </div>
    </div>
  </main>

  <div class="modal" id="modal" aria-hidden="true">
    <img id="modalImg" alt="">
  </div>

  <script>
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    function openModal(src){
      modalImg.src = src;
      modal.classList.add("open");
      modal.setAttribute("aria-hidden","false");
    }
    function closeModal(){
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden","true");
      modalImg.src = "";
    }

    document.querySelectorAll(".polaroid").forEach(card => {
      card.addEventListener("click", () => {
        const src = card.dataset.src || card.querySelector("img")?.src;
        if (src) openModal(src);
      });
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    window.addEventListener("keydown", e => {
      if (e.key === "Escape") closeModal();
    });
  </script>
</body>
</html>
