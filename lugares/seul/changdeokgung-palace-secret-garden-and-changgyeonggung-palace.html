<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Changdeokgung + Secret Garden + Changgyeonggung – Seúl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 205px;
      --photo-h: 150px;

      /* ✅ MÁS GAP */
      --gap-x: 74px;   /* antes 56 */
      --gap-y: 48px;   /* antes 36 */

      --center-y: 0px;
    }

    html, body{
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;

      /* ✅ patrón C (fondo fijo) */
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;

      overflow-anchor: none;
      scroll-behavior: auto;
    }

    /* Fondo fijo */
    .bg{
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at center, rgba(0,0,0,0.10), rgba(0,0,0,0.72)),
        url("../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/01.jpg")
        center 65% / cover no-repeat;
      z-index: 0;
    }

    .shade{
      position: fixed;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        rgba(0,0,0,0.10),
        rgba(0,0,0,0.55)
      );
      z-index: 1;
      pointer-events: none;
    }

    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
      -webkit-tap-highlight-color: transparent;
    }

    /* ✅ Contenedor centrado (sin “entrar por esquina”) */
    .board{
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 95px 18px 70px;
      box-sizing: border-box;
    }

    .stack{
      transform: translateY(var(--center-y));
      display: grid;
      row-gap: var(--gap-y);
      justify-items: center;
      width: max-content;
    }

    .row{
      display: grid;
      justify-content: center;
      column-gap: var(--gap-x);
      width: max-content;
      box-sizing: border-box;
    }

    .r5{ grid-template-columns: repeat(5, var(--polaroid-w)); }
    .r4{ grid-template-columns: repeat(4, var(--polaroid-w)); }

    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.96);
      border-radius: 12px;
      padding: 12px 12px 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.35);
      cursor: pointer;
      position: relative;
      user-select: none;
      -webkit-tap-highlight-color: transparent;

      transform: translateY(var(--lift,0)) rotate(var(--r,0deg));
      transition: transform .16s ease, box-shadow .16s ease;
      transform-origin: center;
      will-change: transform;
    }

    @media (hover: hover){
      .polaroid:hover{
        transform: translateY(calc(var(--lift,0) - 2px))
                   rotate(var(--r,0deg))
                   scale(1.03);
        box-shadow: 0 18px 38px rgba(0,0,0,0.45);
        z-index: 20;
      }
    }

    .polaroid::before{
      content:"";
      position:absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .photo{
      margin-top: 10px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 8px;
      overflow: hidden;
      background:#eee;

      /* ✅ anti-blur */
      transform: rotate(calc(var(--r,0deg) * -1));
      transform-origin: center;
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* Variaciones suaves (desktop) */
    .p1{ --lift:  6px; --r:-2deg; }
    .p2{ --lift: -4px; --r: 2deg; }
    .p3{ --lift:  2px; --r:-1deg; }
    .p4{ --lift: -6px; --r: 1.5deg; }
    .p5{ --lift:  4px; --r:-1.5deg; }

    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
      box-sizing: border-box;
    }
    .modal.open{ display:flex; }
    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 14px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.55);
    }

    /* ✅ móvil: NO remaquetar (siguen 5/4/5), solo ajustar tamaños y gap */
    @media (max-width: 1100px){
      :root{
        --polaroid-w: 185px;
        --photo-h: 135px;

        --gap-x: 32px;
        --gap-y: 36px;

        --center-y: 0px;
      }

      .polaroid{ --lift:0; --r:0deg; }
      .photo{ transform:none; }
    }

    @media (max-width: 520px){
      :root{
        --polaroid-w: 170px;
        --photo-h: 125px;
        --gap-x: 26px;
        --gap-y: 30px;
      }
      .board{ padding-top: 78px; }
    }
  </style>
</head>

<body>
  <div class="bg"></div>
  <div class="shade"></div>

  <a class="back" href="../../seul.html">← Volver a Seúl</a>

  <main class="board">
    <div class="stack" id="stack" aria-label="Fotos Changdeokgung / Secret Garden / Changgyeonggung">

      <!-- Fila 1: 5 -->
      <div class="row r5">
        <div class="polaroid p1" data-src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/01.jpg"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/01.jpg" alt=""></div></div>
        <div class="polaroid p2" data-src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/02.jpg"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/02.jpg" alt=""></div></div>
        <div class="polaroid p3" data-src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/03.jpg"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/03.jpg" alt=""></div></div>
        <div class="polaroid p4" data-src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/04.jpg"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/04.jpg" alt=""></div></div>
        <div class="polaroid p5" data-src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/05.jpg"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/05.jpg" alt=""></div></div>
      </div>

      <!-- Fila 2: 4 -->
      <div class="row r4">
        <div class="polaroid p2" data-src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/06.jpg"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/06.jpg" alt=""></div></div>
        <div class="polaroid p3" data-src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/07.jpg"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/07.jpg" alt=""></div></div>
        <div class="polaroid p4" data-src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/08.jpg"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/08.jpg" alt=""></div></div>
        <div class="polaroid p1" data-src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/09.jpg"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/09.jpg" alt=""></div></div>
      </div>

      <!-- Fila 3: 5 -->
      <div class="row r5">
        <div class="polaroid p5" data-src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/10.jpg"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/10.jpg" alt=""></div></div>
        <div class="polaroid p1" data-src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/11.jpg"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/11.jpg" alt=""></div></div>
        <div class="polaroid p2" data-src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/12.jpg"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/12.jpg" alt=""></div></div>
        <div class="polaroid p3" data-src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/13.jpg"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/13.jpg" alt=""></div></div>
        <div class="polaroid p4" data-src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/14.jpg"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/14.jpg" alt=""></div></div>
      </div>

    </div>
  </main>

  <div class="modal" id="modal" aria-hidden="true">
    <img id="modalImg" alt="">
  </div>

  <script>
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    function openModal(src){
      modalImg.src = src;
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    }
    function closeModal(){
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      modalImg.src = "";
    }

    document.querySelectorAll(".polaroid").forEach(card => {
      card.addEventListener("click", () => {
        const src = card.dataset.src || card.querySelector("img")?.src;
        if (src) openModal(src);
      });
    });

    modal.addEventListener("click", closeModal);
    window.addEventListener("keydown", e => {
      if (e.key === "Escape") closeModal();
    });
  </script>
</body>
</html>
