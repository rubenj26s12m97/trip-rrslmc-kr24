<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Changdeokgung + Secret Garden + Changgyeonggung – Seúl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 200px;
      --photo-h: 145px;
      --gap-x: 56px; /* más separación horizontal */
      --gap-y: 36px;
    }

    html, body{
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* Fondo fijo */
    .bg{
      position: fixed;
      inset: 0;
      background-image: url("../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/01.jpg");
      background-repeat: no-repeat;
      background-position: center 65%;
      background-size: 130% auto;
      z-index: 0;
    }

    .shade{
      position: fixed;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        rgba(0,0,0,0.10),
        rgba(0,0,0,0.75)
      );
      z-index: 1;
    }

    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
    }

    .board{
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding-top: 95px;
      padding-bottom: 120px;
      box-sizing: border-box;
    }

    .stack{
      display: grid;
      row-gap: var(--gap-y);
    }

    .row{
      display: grid;
      justify-content: center;
      column-gap: var(--gap-x);
    }

    .r5{ grid-template-columns: repeat(5, var(--polaroid-w)); }
    .r4{ grid-template-columns: repeat(4, var(--polaroid-w)); }

    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.96);
      border-radius: 12px;
      padding: 12px 12px 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.35);
      cursor: pointer;
      position: relative;
      user-select: none;
      transition: transform .16s ease, box-shadow .16s ease;
      transform: translateY(var(--lift,0)) rotate(var(--r,0deg));
    }

    .polaroid:hover{
      transform: translateY(calc(var(--lift,0) - 2px)) rotate(0deg) scale(1.03);
      box-shadow: 0 18px 38px rgba(0,0,0,0.45);
      z-index: 20;
    }

    .polaroid::before{
      content:"";
      position:absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .photo{
      margin-top: 10px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 8px;
      overflow: hidden;
      background:#eee;
      transform: rotate(calc(var(--r,0deg) * -1));
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
    }

    /* Variaciones suaves */
    .p1{ --lift:  6px; --r:-2deg; }
    .p2{ --lift: -4px; --r: 2deg; }
    .p3{ --lift:  2px; --r:-1deg; }
    .p4{ --lift: -6px; --r: 1.5deg; }
    .p5{ --lift:  4px; --r:-1.5deg; }

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
    }
    .modal.open{ display:flex; }
    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 14px;
    }

    @media (max-width: 1100px){
      :root{
        --polaroid-w: 185px;
        --photo-h: 135px;
        --gap-x: 30px;
      }
      .r5{ grid-template-columns: repeat(3, var(--polaroid-w)); row-gap: 28px; }
      .r4{ grid-template-columns: repeat(2, var(--polaroid-w)); row-gap: 28px; }
      .polaroid{ --lift:0; --r:0deg; }
      .photo{ transform:none; }
    }

    @media (max-width: 560px){
      .r5, .r4{
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="bg"></div>
  <div class="shade"></div>

  <a class="back" href="../../seul.html">← Volver a Seúl</a>

  <main class="board">
    <div class="stack">

      <!-- Fila 1: 5 -->
      <div class="row r5">
        <div class="polaroid p1"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/01.jpg"></div></div>
        <div class="polaroid p2"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/02.jpg"></div></div>
        <div class="polaroid p3"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/03.jpg"></div></div>
        <div class="polaroid p4"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/04.jpg"></div></div>
        <div class="polaroid p5"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/05.jpg"></div></div>
      </div>

      <!-- Fila 2: 4 -->
      <div class="row r4">
        <div class="polaroid p2"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/06.jpg"></div></div>
        <div class="polaroid p3"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/07.jpg"></div></div>
        <div class="polaroid p4"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/08.jpg"></div></div>
        <div class="polaroid p1"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/09.jpg"></div></div>
      </div>

      <!-- Fila 3: 5 -->
      <div class="row r5">
        <div class="polaroid p5"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/10.jpg"></div></div>
        <div class="polaroid p1"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/11.jpg"></div></div>
        <div class="polaroid p2"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/12.jpg"></div></div>
        <div class="polaroid p3"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/13.jpg"></div></div>
        <div class="polaroid p4"><div class="photo"><img src="../../img/seul/changdeokgung-palace-secret-garden-and-changgyeonggung-palace/14.jpg"></div></div>
      </div>

    </div>
  </main>

  <!-- Modal -->
  <div class="modal" id="modal">
    <img id="modalImg" alt="">
  </div>

  <script>
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    document.querySelectorAll(".polaroid").forEach(p => {
      p.addEventListener("click", () => {
        modalImg.src = p.querySelector("img").src;
        modal.classList.add("open");
      });
    });

    modal.addEventListener("click", () => {
      modal.classList.remove("open");
      modalImg.src = "";
    });

    window.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        modal.classList.remove("open");
        modalImg.src = "";
      }
    });
  </script>
</body>
</html>
