<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Namsan Park and Seoul Tower – Seúl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 240px;
      --photo-h: 165px;
      --gap-x: 48px;
      --gap-y: 34px;
    }

    html, body{
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* Fondo fijo con zoom */
    .bg{
      position: fixed;
      inset: 0;
      background-image: url("../../img/seul/namsan-park-and-seoul-tower/01.webp");
      background-repeat: no-repeat;
      background-position: center 75%;
      background-size: 130% auto;
      z-index: 0;
    }

    .shade{
      position: fixed;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        rgba(0,0,0,0.12),
        rgba(0,0,0,0.7)
      );
      z-index: 1;
      pointer-events: none;
    }

    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
    }

    /* Contenedor con scroll */
    .board{
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding-top: 95px;
      padding-bottom: 120px;
      box-sizing: border-box;
    }

    .stack{
      display: grid;
      row-gap: var(--gap-y);
    }

    .row{
      display: grid;
      column-gap: var(--gap-x);
      justify-content: center;
      align-items: start;
    }

    .row.r2{ grid-template-columns: repeat(2, var(--polaroid-w)); }
    .row.r3{ grid-template-columns: repeat(3, var(--polaroid-w)); }

    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.96);
      border-radius: 12px;
      padding: 12px 12px 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.35);
      cursor: pointer;
      position: relative;
      user-select: none;
      -webkit-tap-highlight-color: transparent;

      transform: translateY(var(--lift,0)) rotate(var(--r,0deg));
      transition: transform .16s ease, box-shadow .16s ease;
      will-change: transform;
    }

    .polaroid:hover{
      transform: translateY(calc(var(--lift,0) - 2px))
                 rotate(var(--r,0deg))
                 scale(1.03);
      box-shadow: 0 18px 38px rgba(0,0,0,0.45);
      z-index: 20;
    }

    .polaroid::before{
      content:"";
      position:absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    /* 🔑 Foto des-rotada para evitar blur */
    .photo{
      margin-top: 10px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 8px;
      overflow: hidden;
      background:#eee;

      transform: rotate(calc(var(--r,0deg) * -1));
      transform-origin: center;
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
    }

    /* offsets */
    .p1{ --lift:  6px; --r:-2deg; }
    .p2{ --lift: -4px; --r: 2deg; }
    .p3{ --lift:  2px; --r:-1deg; }
    .p4{ --lift: -6px; --r: 1.5deg; }

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
      box-sizing: border-box;
    }
    .modal.open{ display:flex; }
    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 14px;
    }

    @media (max-width: 980px){
      :root{
        --polaroid-w: 210px;
        --photo-h: 145px;
      }
      .row.r2,
      .row.r3{
        grid-template-columns: 1fr;
        row-gap: 30px;
      }
      .polaroid{ --lift:0; --r:0deg; }
      .photo{ transform:none; }
    }
  </style>
</head>

<body>
  <div class="bg"></div>
  <div class="shade"></div>

  <a class="back" href="../../seul.html">← Volver a Seúl</a>

  <main class="board">
    <div class="stack">

      <!-- Fila 1: 2 -->
      <div class="row r2">
        <div class="polaroid p1" data-src="../../img/seul/namsan-park-and-seoul-tower/02.jpg">
          <div class="photo"><img src="../../img/seul/namsan-park-and-seoul-tower/02.jpg" alt=""></div>
        </div>
        <div class="polaroid p2" data-src="../../img/seul/namsan-park-and-seoul-tower/03.jpg">
          <div class="photo"><img src="../../img/seul/namsan-park-and-seoul-tower/03.jpg" alt=""></div>
        </div>
      </div>

      <!-- Fila 2: 3 -->
      <div class="row r3">
        <div class="polaroid p3" data-src="../../img/seul/namsan-park-and-seoul-tower/04.jpg">
          <div class="photo"><img src="../../img/seul/namsan-park-and-seoul-tower/04.jpg" alt=""></div>
        </div>
        <div class="polaroid p4" data-src="../../img/seul/namsan-park-and-seoul-tower/05.jpg">
          <div class="photo"><img src="../../img/seul/namsan-park-and-seoul-tower/05.jpg" alt=""></div>
        </div>
        <div class="polaroid p1" data-src="../../img/seul/namsan-park-and-seoul-tower/06.jpg">
          <div class="photo"><img src="../../img/seul/namsan-park-and-seoul-tower/06.jpg" alt=""></div>
        </div>
      </div>

      <!-- Fila 3: 2 -->
      <div class="row r2">
        <div class="polaroid p2" data-src="../../img/seul/namsan-park-and-seoul-tower/07.jpg">
          <div class="photo"><img src="../../img/seul/namsan-park-and-seoul-tower/07.jpg" alt=""></div>
        </div>
        <div class="polaroid p3" data-src="../../img/seul/namsan-park-and-seoul-tower/08.jpg">
          <div class="photo"><img src="../../img/seul/namsan-park-and-seoul-tower/08.jpg" alt=""></div>
        </div>
      </div>

    </div>
  </main>

  <!-- Modal -->
  <div class="modal" id="modal">
    <img id="modalImg" alt="">
  </div>

  <script>
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    function openModal(src){
      modalImg.src = src;
      modal.classList.add("open");
    }
    function closeModal(){
      modal.classList.remove("open");
      modalImg.src = "";
    }

    document.querySelectorAll(".polaroid").forEach(card => {
      card.addEventListener("click", () => {
        openModal(card.dataset.src || card.querySelector("img")?.src);
      });
    });

    modal.addEventListener("click", closeModal);

    window.addEventListener("keydown", e => {
      if (e.key === "Escape") closeModal();
    });
  </script>
</body>
</html>
