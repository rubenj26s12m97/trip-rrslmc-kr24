<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Lotte World Tower – Seúl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{
      --polaroid-w: 210px;
      --photo-h: 150px;

      --gap-x: 56px;
      --center-y: 0px;
    }

    html, body{
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #000;
      overflow: hidden; /* ✅ scroll en .viewport (X + Y) */
    }

    .back{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 20;
      background: rgba(255,255,255,0.92);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
      -webkit-tap-highlight-color: transparent;
    }

    /* ✅ Scroll del lienzo completo (fondo + polaroids) */
    .viewport{
      position: fixed;
      inset: 0;
      overflow: auto;                 /* ✅ vertical + horizontal */
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      background: #000;

      overflow-anchor: none;
      scroll-behavior: auto;
    }

    /* ✅ Fondo dentro del stage (no fixed) */
    .stage{
      position: relative;
      width: 1700px; /* ✅ más ancho porque son 4 en fila */
      height: 900px;
      background: url("../../img/seul/lotte-world-tower/01.bmp") center 50% / cover no-repeat;
    }

    .shade{
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        rgba(0,0,0,0.18),
        rgba(0,0,0,0.70)
      );
      pointer-events: none;
    }

    /* ✅ Fila centrada dentro del stage (sin scroll interno) */
    .row{
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, calc(-50% + var(--center-y)));

      display: grid;
      grid-template-columns: repeat(4, var(--polaroid-w));
      column-gap: var(--gap-x);
      justify-content: center;
      align-items: start;
      width: max-content;
      z-index: 2;
    }

    /* Polaroids */
    .polaroid{
      width: var(--polaroid-w);
      background: rgba(255,255,255,0.96);
      border-radius: 12px;
      padding: 12px 12px 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.35);
      cursor: pointer;
      position: relative;
      user-select: none;
      -webkit-tap-highlight-color: transparent;

      transform: translateY(var(--lift,0)) rotate(var(--r,0deg));
      transition: transform .16s ease, box-shadow .16s ease;
      will-change: transform;
    }

    @media (hover: hover){
      .polaroid:hover{
        transform: translateY(calc(var(--lift,0) - 2px))
                   rotate(var(--r,0deg))
                   scale(1.03);
        box-shadow: 0 18px 38px rgba(0,0,0,0.45);
        z-index: 20;
      }
    }

    .polaroid::before{
      content:"";
      position:absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000);
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    /* 🔑 Foto des-rotada para nitidez */
    .photo{
      margin-top: 10px;
      width: 100%;
      height: var(--photo-h);
      border-radius: 8px;
      overflow: hidden;
      background:#eee;
      transform: rotate(calc(var(--r,0deg) * -1));
      transform-origin: center;
    }

    .photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* Offsets suaves */
    .p1{ --lift:  6px;  --r:-1deg; }
    .p2{ --lift: -6px;  --r: 2deg; }
    .p3{ --lift:  8px;  --r:-2deg; }
    .p4{ --lift: -4px;  --r: 1deg; }

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.90);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 18px;
      box-sizing: border-box;
      isolation: isolate;
    }
    .modal.open{ display:flex; }

    .modal img{
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 14px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.55);
      filter: none !important;
      mix-blend-mode: normal !important;
    }

    /* ✅ móvil: NO scroll interno. Ajustamos tamaños y ampliamos stage un poco */
    @media (max-width: 980px){
      :root{
        --polaroid-w: 190px;
        --photo-h: 135px;
        --gap-x: 22px;
        --center-y: 0px;
      }

      .stage{
        width: 1650px;
        height: 900px;
      }

      .polaroid{ --lift:0; --r:0deg; }
      .photo{ transform:none; }
    }

    @media (max-width: 520px){
      :root{
        --polaroid-w: 170px;
        --photo-h: 120px;
        --gap-x: 18px;
      }

      .stage{
        width: 1550px;
        height: 900px;
      }
    }
  </style>
</head>

<body>
  <a class="back" href="../../seul.html">← Volver a Seúl</a>

  <div class="viewport" id="viewport">
    <div class="stage" id="stage">
      <div class="shade"></div>

      <div class="row" id="row" aria-label="Fotos Lotte World Tower">
        <div class="polaroid p1" data-src="../../img/seul/lotte-world-tower/01.bmp">
          <div class="photo"><img src="../../img/seul/lotte-world-tower/01.bmp" alt=""></div>
        </div>

        <div class="polaroid p2" data-src="../../img/seul/lotte-world-tower/02.jpg">
          <div class="photo"><img src="../../img/seul/lotte-world-tower/02.jpg" alt=""></div>
        </div>

        <div class="polaroid p3" data-src="../../img/seul/lotte-world-tower/03.jpg">
          <div class="photo"><img src="../../img/seul/lotte-world-tower/03.jpg" alt=""></div>
        </div>

        <div class="polaroid p4" data-src="../../img/seul/lotte-world-tower/04.jpg">
          <div class="photo"><img src="../../img/seul/lotte-world-tower/04.jpg" alt=""></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="modal" aria-hidden="true">
    <img id="modalImg" alt="">
  </div>

  <script>
    // ---------- Modal ----------
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    function openModal(src){
      modalImg.src = src;
      modal.classList.add("open");
      modal.setAttribute("aria-hidden","false");
    }
    function closeModal(){
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden","true");
      modalImg.src = "";
    }

    document.querySelectorAll(".polaroid").forEach(card => {
      card.addEventListener("click", () => {
        const src = card.dataset.src || card.querySelector("img")?.src;
        if (src) openModal(src);
      });
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    window.addEventListener("keydown", e => {
      if (e.key === "Escape") closeModal();
    });

    // ---------- Entrar centrado ----------
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";

    function clamp(v, min, max){ return Math.min(Math.max(v, min), max); }

    function centerOnRow(){
      const vp = document.getElementById("viewport");
      const stage = document.getElementById("stage");
      const row = document.getElementById("row");
      if (!vp || !stage || !row) return;

      const vpRect = vp.getBoundingClientRect();
      const rowRect = row.getBoundingClientRect();

      const rowCx = rowRect.left + rowRect.width / 2;
      const rowCy = rowRect.top  + rowRect.height / 2;

      const vpCx = vpRect.left + vpRect.width / 2;
      const vpCy = vpRect.top  + vpRect.height / 2;

      const dx = rowCx - vpCx;
      const dy = rowCy - vpCy;

      let targetX = vp.scrollLeft + dx;
      let targetY = vp.scrollTop  + dy;

      const maxX = Math.max(0, stage.scrollWidth  - vp.clientWidth);
      const maxY = Math.max(0, stage.scrollHeight - vp.clientHeight);

      vp.scrollLeft = clamp(targetX, 0, maxX);
      vp.scrollTop  = clamp(targetY, 0, maxY);
    }

    function hardResetScroll(){
      const vp = document.getElementById("viewport");
      if (!vp) return;
      vp.scrollTo({ left: 0, top: 0, behavior: "auto" });
    }

    function forceCenter(){
      hardResetScroll();
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          centerOnRow();
          setTimeout(centerOnRow, 80);
          setTimeout(centerOnRow, 220);
          setTimeout(centerOnRow, 520);
        });
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      hardResetScroll();
      requestAnimationFrame(centerOnRow);
    });

    window.addEventListener("load", forceCenter);
    window.addEventListener("pageshow", () => forceCenter());
    window.addEventListener("orientationchange", () => setTimeout(forceCenter, 250));
    window.addEventListener("resize", () => setTimeout(forceCenter, 140));
  </script>
</body>
</html>
